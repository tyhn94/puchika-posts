name: Puchika

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = sadece kontrol et, post-now = sıradakini hemen paylaş'
        type: choice
        options: [check, post-now]
        default: check

permissions:
  contents: write
  issues: write

concurrency:
  group: puchika
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Puchika bot
        run: node bot/post.mjs
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'auto' }}
          GH_TOKEN: ${{ github.token }}
      - name: Save state
        if: always()
        run: |
          git config user.name "puchika-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p state && git add state
          git diff --cached --quiet || (git commit -m "bot: state" && git pull --rebase && git push)

name: Puchika

on:
  schedule:
    - cron: '23 * * * *'
  push:
    paths: ['gen/posts.js']
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = sadece kontrol et, post-now = sıradakini hemen paylaş'
        type: choice
        options: [check, post-now]
        default: check

permissions:
  contents: write
  issues: write

concurrency:
  group: puchika
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Plan
        id: plan
        run: node bot/render.mjs plan
      - name: Get the drawing tools
        if: steps.plan.outputs.need == '1'
        run: |
          npm install --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg
      - name: Draw the next posts
        if: steps.plan.outputs.need == '1'
        run: node bot/render.mjs draw ${{ steps.plan.outputs.ids }}
      - name: Put the drawings online
        if: always()
        run: |
          git config user.name "puchika-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue.json media
          git diff --cached --quiet || (git commit -m "bot: drawings" && git pull --rebase && git push)
      - name: Post
        if: github.event_name != 'push'
        run: node bot/post.mjs
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'auto' }}
          GH_TOKEN: ${{ github.token }}
      - name: Save state
        if: always()
        run: |
          mkdir -p state && git add state
          git diff --cached --quiet || (git commit -m "bot: state" && git pull --rebase && git push)

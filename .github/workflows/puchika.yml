name: Puchika

on:
  schedule:
    - cron: '23,53 * * * *'
  push:
    paths: ['gen/posts.js']
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = sadece kontrol et, post-now = sıradakini hemen paylaş'
        type: choice
        options: [check, post-now]
        default: check

permissions:
  contents: write
  issues: write

concurrency:
  group: puchika
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Plan
        id: plan
        run: node bot/render.mjs plan
      - name: Get the drawing tools
        if: steps.plan.outputs.need == '1'
        run: |
          npm install --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg
          # the anime voices: Open JTalk (HTS voice "Mei") reshaped with WORLD
          pip install --break-system-packages --quiet numpy pyworld pyopenjtalk-plus
      - name: Draw the next posts
        if: steps.plan.outputs.need == '1'
        run: node bot/render.mjs draw ${{ steps.plan.outputs.ids }}
      - name: Put the drawings online
        if: always()
        run: |
          git config user.name "puchika-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A queue.json media
          if ! git diff --cached --quiet; then
            git commit -m "bot: drawings"
            for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin main && break; git rebase --abort 2>/dev/null; sleep 5; done
          fi
      - name: Post
        if: github.event_name != 'push'
        run: node bot/post.mjs
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'auto' }}
          GH_TOKEN: ${{ github.token }}
      - name: Save state
        if: always()
        run: |
          git rebase --abort 2>/dev/null || true
          mkdir -p state && git add state
          if ! git diff --cached --quiet; then
            git commit -m "bot: state"
            for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin main && break; git rebase --abort 2>/dev/null; sleep 5; done
          fi
      - name: Keep the repo small
        # once a day: if the repo (with its history of old videos) has grown big, start a fresh history with the same files
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(date -u +%H)" = "03" ] || exit 0
          size=$(gh api repos/${{ github.repository }} --jq .size)
          echo "repo size: ${size} KB"
          if [ "$size" -gt 400000 ]; then
            git pull --rebase -X theirs origin main || true
            fresh=$(git commit-tree "HEAD^{tree}" -m "fresh start: history trimmed to keep the repo small")
            git push -f origin "$fresh:refs/heads/main"
          fi

*{box-sizing:border-box}
html,body{margin:0;background:#ddd}
#root{display:inline-block}
:root{--pi:#5a3854}  /* Puchi's ink: text on white, pink-edged things stays dark in every theme */

/* ---------- 1080×1350 slides ---------- */
.slide{position:relative;width:1080px;height:1350px;overflow:hidden;background-color:var(--bg);background-image:var(--pattern);background-size:220px 220px;font-family:'M PLUS Rounded 1c',sans-serif;color:var(--ink);--py:372px}
.slide::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 0%,var(--haze),rgba(255,255,255,0) 60%);pointer-events:none}
.slide .panel{position:absolute;left:46px;top:var(--py);width:988px;height:568px;padding:14px;border-radius:46px;background:var(--bezel);box-shadow:0 0 0 6px var(--shell-hi),0 14px 0 6px var(--shell),0 30px 50px rgba(120,40,80,.18)}
.panel canvas{display:block;width:960px;height:540px;border-radius:34px;image-rendering:pixelated}
.tag{position:absolute;left:60px;top:54px;padding:10px 22px;border-radius:999px;background:var(--surface);box-shadow:0 5px 0 var(--shell-hi);font:400 30px/1 'DotGothic16',monospace;letter-spacing:3px;color:var(--accent-strong);white-space:nowrap}
.tag b{color:#b48cff;font-weight:400}
.pill{position:absolute;left:50%;top:60px;transform:translateX(-50%);padding:12px 28px 10px;border-radius:999px;background:var(--ink);color:var(--bg);font:400 32px/1 'DotGothic16';letter-spacing:5px;white-space:nowrap}
.logo-foot{position:absolute;left:50%;bottom:42px;width:210px;transform:translateX(-50%);filter:drop-shadow(0 4px 6px rgba(120,40,80,.15))}
.nar{position:absolute;left:34px;top:30px;padding:12px 26px 10px;border-radius:16px;background:#fff1b8;border:5px solid var(--pi);box-shadow:5px 6px 0 var(--pi);font:800 38px/1.1 'Baloo 2';color:var(--pi);transform:rotate(-2.5deg);transform-origin:0 50%}

/* speech bubbles: Puchi light, Chika dark */
.bub{position:absolute;max-width:840px;padding:30px 40px 32px;border-radius:48px;font-weight:800;font-size:50px;line-height:1.2;letter-spacing:-.2px}
.bub.p{background:#fff;color:var(--pi);border:7px solid #ff8fb8;box-shadow:0 9px 0 #ffc6da}
.bub.c{background:#2b2240;color:#fff;border:7px solid #7a68b8;box-shadow:0 9px 0 #1a1428}
.bub.big .txt{font-size:76px;line-height:1}
.bub b{font-family:'Baloo 2';font-weight:800;color:#ff5f9e;letter-spacing:1px}
.bub.c b{color:#ffb3d1}
.who{position:absolute;top:-26px;left:34px;padding:5px 18px 3px;border-radius:999px;font:800 26px/1.2 'Baloo 2';letter-spacing:3px}
.bub.p .who{background:#ff8fb8;color:#fff}
.bub.c .who{background:#7a68b8;color:#fff}
.bub.down .who{top:auto;bottom:-24px}
.tail{position:absolute;width:44px;height:44px;background:inherit;border:inherit;left:var(--tl,60px)}
.bub.up .tail{bottom:-28px;transform:rotate(45deg);border-top:0;border-left:0;border-radius:0 0 10px 0}
.bub.down .tail{top:-28px;transform:rotate(45deg);border-bottom:0;border-right:0;border-radius:10px 0 0 0}
.chk{display:block;margin-bottom:12px;padding:12px 22px;border-radius:24px;background:#fff3f8;color:#3f9a55;font-size:40px;line-height:1.38}
.bub.c .chk{background:#3a2f55;color:#9fe3b0}
.chk span{display:block}
.slide .bub.p{left:60px}
.slide .bub.c{right:60px}
.slide .bub.up{bottom:calc(1350px - var(--py) + 32px)}
.slide .bub.down{top:calc(var(--py) + 614px)}

/* cover */
.slide .logo-big{position:absolute;left:50%;top:50px;width:720px;transform:translateX(-50%);filter:drop-shadow(0 8px 12px rgba(120,40,80,.18))}
.slide .ep{position:absolute;left:50%;top:378px;transform:translateX(-50%);padding:8px 26px 6px;border-radius:999px;background:var(--ink);color:var(--bg);font:400 32px/1 'DotGothic16';letter-spacing:6px;white-space:nowrap}
.slide h1{position:absolute;left:30px;right:30px;top:420px;margin:0;text-align:center;font:800 100px/1.05 'Baloo 2';color:var(--ink);letter-spacing:-1px;text-shadow:0 6px 0 var(--tshadow)}
.slide .panel.cover{top:610px}
.slide.cover.two .logo-big{width:560px;top:40px}
.slide.cover.two .ep{top:298px}
.slide.cover.two h1{top:356px;font-size:92px}
.slide.cover.two .panel.cover{top:600px}
.swipe{position:absolute;right:64px;bottom:58px;padding:14px 30px;border-radius:999px;background:linear-gradient(135deg,#ff5f9e,#ff8a6a 60%,#ffc23d);color:#fff;font:800 40px/1 'Baloo 2';box-shadow:0 7px 0 #c8457a}
.swipe span{display:inline-block;margin-left:6px}
/* the end */
.slide .panel.cta{top:90px}
.slide h2{position:absolute;left:60px;right:60px;margin:0;text-align:center;font:800 90px/1.02 'Baloo 2';color:var(--ink);letter-spacing:-1px}
.slide.cta h2{top:735px}
h2 em{font-style:normal;color:var(--accent-strong)}
.slide.cta .sub{position:absolute;left:0;right:0;top:960px;margin:0;text-align:center;font-weight:800;font-size:44px;line-height:1.35;color:var(--ink-soft)}
.slide .logo-mid{position:absolute;left:50%;bottom:56px;width:430px;transform:translateX(-50%);filter:drop-shadow(0 6px 10px rgba(120,40,80,.18))}
/* a single card */
.slide .panel.card{top:170px}
.labels{position:absolute;left:46px;width:988px;top:770px;display:flex;justify-content:space-around}
.labels span{padding:10px 30px 8px;border-radius:999px;font:800 44px/1 'Baloo 2';letter-spacing:2px}
.labels .lp{background:#fff;color:#ff5f9e;box-shadow:0 0 0 5px #ff8fb8,0 9px 0 5px #ffc6da}
.labels .lc{background:#2b2240;color:#fff;box-shadow:0 0 0 5px #7a68b8,0 9px 0 5px #1a1428}
.card-text{position:absolute;left:60px;right:60px;top:780px;bottom:150px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:26px;text-align:center}
.card-text.low{top:850px}
.slide .card-text h2.card-h{position:static;font-size:88px}
.slide .card-text h2.card-h.small{font-size:72px;line-height:1.08}
.card-text.low h2.card-h{font-size:76px}
.card-sub{margin:0;font-weight:800;font-size:44px;line-height:1.35;color:var(--ink-soft);text-wrap:balance}
.slide h2{text-wrap:balance}
/* list items */
.num{position:absolute;left:60px;top:80px;width:170px;height:170px;border-radius:50px;background:linear-gradient(135deg,#ff5f9e,#ff8a6a 60%,#ffc23d);color:#fff;font:800 120px/170px 'Baloo 2';text-align:center;box-shadow:0 10px 0 #c8457a}
.slide h2.item-h{left:262px;right:50px;top:80px;height:180px;display:flex;align-items:center;text-align:left;font-size:80px;line-height:1.0}
.slide .panel.item{top:330px}
.item-sub{position:absolute;left:60px;right:60px;top:960px;margin:0;text-align:center;font-weight:800;font-size:50px;line-height:1.3;color:var(--ink)}
.item-foot{position:absolute;left:70px;right:70px;top:1100px;margin:0;text-align:center;font-weight:800;font-size:40px;line-height:1.3;color:var(--ink-soft)}
/* a friend's profile */
.slide h1.prof-name{position:absolute;left:0;right:0;top:140px;margin:0;text-align:center;font:800 150px/1 'Baloo 2';color:var(--accent-strong);letter-spacing:2px;text-shadow:0 8px 0 var(--tshadow)}
.chips{position:absolute;left:40px;right:40px;top:330px;display:flex;flex-wrap:wrap;justify-content:center;gap:16px}
.chips span{padding:10px 24px 8px;border-radius:999px;background:var(--surface);box-shadow:0 5px 0 var(--shell-hi);font-weight:800;font-size:34px;color:var(--ink)}
.slide .panel.prof{top:500px}
.prof-sub{position:absolute;left:70px;right:70px;top:1110px;margin:0;text-align:center;font-weight:800;font-size:44px;line-height:1.3;color:var(--ink)}

/* ---------- the 1080×1920 Reel ---------- */
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background-color:var(--bg);background-image:var(--pattern);background-size:220px 220px;font-family:'M PLUS Rounded 1c',sans-serif;color:var(--ink)}
#stage::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 55% at 50% 8%,var(--haze),rgba(255,255,255,0) 60%)}
#stage .layer{position:absolute;inset:0}
#stage .panel{position:absolute;left:78px;width:924px;height:532px;padding:14px;border-radius:46px;background:var(--bezel);box-shadow:0 0 0 6px var(--shell-hi),0 14px 0 6px var(--shell),0 30px 50px rgba(120,40,80,.18);overflow:hidden}
#stage .panel canvas{width:896px;height:504px}
#stage .flash{position:absolute;inset:14px;border-radius:34px;background:#fff;opacity:0;pointer-events:none}
#stage .logo-big{position:absolute;left:50%;top:230px;width:780px;transform-origin:50% 50%;filter:drop-shadow(0 10px 14px rgba(120,40,80,.2))}
#stage .ep{position:absolute;left:50%;top:620px;padding:10px 30px 8px;border-radius:999px;background:var(--ink);color:var(--bg);font:400 36px/1 'DotGothic16';letter-spacing:7px;white-space:nowrap}
#stage h1{position:absolute;left:40px;right:40px;top:680px;margin:0;text-align:center;font:800 108px/1.04 'Baloo 2';color:var(--ink);letter-spacing:-1px;text-shadow:0 7px 0 var(--tshadow)}
#cover .panel{top:960px}
#stage .logo-top{position:absolute;left:50%;top:170px;width:330px;transform:translateX(-50%);filter:drop-shadow(0 6px 8px rgba(120,40,80,.16))}
#stage .tag{left:50%;top:330px;transform:translateX(-50%);padding:11px 26px;font-size:32px}
#story .panel{top:780px}
#stage .bub{font-size:52px;transform-origin:var(--ox,50%) var(--oy,100%);opacity:0}
#stage .bub .txt{white-space:pre-wrap}
#stage .bub .ghost{visibility:hidden}
#stage .bub.big .txt{font-size:84px;line-height:1}
#stage .bub.up{bottom:calc(1920px - 748px)}
#stage .bub.down{top:1360px}
#stage .bub.p{left:60px}
#stage .bub.c{right:120px}
#stage .tail{width:46px;height:46px}
#stage .chk{font-size:38px;line-height:1.3;padding:10px 20px;margin-bottom:10px}
#stage .nar{font-size:40px;left:40px;top:34px}
#cta .panel{top:380px}
#stage h2{position:absolute;left:60px;right:60px;top:990px;margin:0;text-align:center;font:800 100px/1.02 'Baloo 2';color:var(--ink);letter-spacing:-1px}
#stage .sub{position:absolute;left:0;right:0;top:1222px;margin:0;text-align:center;font-weight:800;font-size:48px;line-height:1.35;color:var(--ink-soft)}
#stage .logo-mid{position:absolute;left:50%;top:1370px;width:400px;filter:drop-shadow(0 6px 10px rgba(120,40,80,.18))}

/* the profile picture: the middle of the screen, big */
.slide.avatar{width:1080px;height:1080px}
.slide.avatar::before{display:none}
.slide.avatar canvas{position:absolute;left:-228px;top:108px;width:1536px;height:864px;image-rendering:pixelated}

/* panels' extras: a game's HUD, a big GAME OVER, the evil dark */
.hud{position:absolute;right:30px;top:26px;padding:9px 18px 7px;border-radius:12px;background:rgba(43,34,64,.88);color:#fff;font:400 34px/1 'DotGothic16',monospace;letter-spacing:3px;white-space:nowrap}
.over{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);padding:18px 40px 14px;background:#2b2240;color:#fff;border:6px solid #fff;box-shadow:0 0 0 6px #2b2240,0 14px 0 6px rgba(43,34,64,.35);font:400 88px/1 'DotGothic16',monospace;letter-spacing:6px;white-space:nowrap;opacity:0}
.evilshade{position:absolute;inset:14px;border-radius:34px;background:radial-gradient(circle at 70% 50%,rgba(80,0,50,.1),rgba(30,0,40,.65));opacity:0;pointer-events:none}
.cvbox{width:896px;height:504px;border-radius:34px;overflow:hidden}
#stage .cvbox canvas{transform-origin:50% 50%}
/* meme Reels: a caption at the top, the picture lower */
#stage.meme .logo-top.small{top:110px;width:250px}
#stage .hook{position:absolute;left:60px;right:60px;top:240px;height:300px;display:flex;align-items:center;justify-content:center;text-align:center;font:800 68px/1.1 'Baloo 2';color:var(--ink);letter-spacing:-.5px;text-wrap:balance}
#stage .hook em{font-style:normal;color:var(--accent-strong)}
#stage.meme #story .panel{top:822px}
#stage.meme .bub.up{bottom:calc(1920px - 790px)}
#stage.meme .bub.down{top:1392px}
/* a phone wallpaper */
#stage.wall{background:var(--bg)}
#cvWall{position:absolute;top:6px;width:3392px;height:1908px;image-rendering:pixelated}
.wall-pill{position:absolute;left:50%;bottom:520px;padding:16px 32px 14px;border-radius:999px;background:rgba(255,255,255,.9);color:var(--pi);font:800 40px/1 'M PLUS Rounded 1c';white-space:nowrap;box-shadow:0 7px 0 rgba(255,143,184,.7);opacity:0}
/* two pictures */
.mini{position:absolute;left:142px;width:796px;height:460px;padding:14px;border-radius:40px;background:var(--bezel);box-shadow:0 0 0 6px var(--shell-hi),0 12px 0 6px var(--shell),0 24px 40px rgba(120,40,80,.16)}
.mini canvas{display:block;width:768px;height:432px;border-radius:28px;image-rendering:pixelated}
.mini.a{top:290px}.mini.b{top:788px}
.two-top{position:absolute;left:60px;right:60px;top:40px;height:230px;display:flex;align-items:center;justify-content:center;text-align:center;font:800 70px/1.06 'Baloo 2';color:var(--ink);text-wrap:balance}
.two-top em{font-style:normal;color:var(--accent-strong)}

// a pixel is 0 (off), 1 (the crayon's dark line), 2 (its middle tone), 3 (its pale fill) or 4 (a soft

const buf = new Uint8Array(LW*LH), cbuf = new Uint8Array(LW*LH);
let PEN = 0;

const C = {INK:0, PET:1, LEAF:2, RED:3, GOLD:4, LILAC:5, BLUE:6, BROWN:7, ORANGE:8, MINT:9, GRAY:10, PINK:11, NIGHT:12, MOON:13};
const P = (x,y,v) => { x |= 0; y |= 0; if(x < 0 || y < 0 || x >= LW || y >= LH) return; const i = y*LW+x; buf[i] = v == null ? 1 : v; cbuf[i] = PEN; };

// pens: one crayon per row (the last one carries on), for sprites with a stem, a roof…
function spr(rows, x0, y0, dark, pens){
  const keep = PEN;
  for(let j = 0; j < rows.length; j++){ const r = rows[j];
    if(pens) PEN = pens[Math.min(j, pens.length - 1)];
    for(let i = 0; i < r.length; i++){ const ch = r[i];

}

  1:{sc:2, head:0, rows:['XX.XX','.XXX.','..X..','..X..']},
  2:{sc:3, head:0, rows:['XX...XX','XXX.XXX','.XX.XX.','..XXX..','...X...','...X...']},
  3:{sc:3, head:4, rows:['...X...','..XoX..','..XoX..','...X...','XX.X.XX','.XXXXX.','...X...','...X...']},
  4:{sc:3, head:7, rows:['..XXX..','..X.X..','XXXoXXX','X.oXo.X','XXXoXXX','..X.X..','..XXX..','...X...','XX.X.XX','.XXXXX.','...X...']},
  5:{sc:3, head:7, rows:['..XXX..','..XoX..','XXXoXXX','XooXooX','XXXoXXX','..XoX..','..XXX..','...X...','XX.X.XX','.XXXXX.','...X...']}
};
PLANTS[6] = PLANTS[5];
const HEART = ['.X.X.','XXXXX','XXXXX','.XXX.','..X..'];
const HEART_S = ['X.X','XXX','.X.'];
const SPARK = ['.X.','XXX','.X.'];
const ZZ = ['XXX','..X','.X.','XXX'];
const SUN_A = ['...X...','.......','..XXX..','X.XXX.X','..XXX..','.......','...X...'];
const SUN_B = ['.......','.X...X.','..XXX..','..XXX..','..XXX..','.X...X.','.......'];
const MOON = ['.XX..','XX...','X....','XX...','.XX..'];
const FLOWER_F = ['.X.','XoX','.X.','.X.'];
const FLOWER_B = ['.X.','X.X','.X.','.o.','.o.','.o.'];
const FRONT = [1,60,5,56,9,52,13,48];
const BACK = [3,58,7,54,11,50];

const Pet = {
  F:0, stage:0, x:0, tx:0, facing:1, nextWalk:30, nextBlink:20, blinkUntil:0, anim:null, evo:null, grow:null, parts:[], seenStage:null,
  syncStage(){ const s = stageOf(totalXp()); if(!this.evo) this.stage = s; },
  react(type){ this.anim = {type, f0:this.F}; },
  evolve(from, to){ this.evo = {from, to, f0:this.F}; this.stage = to; this.anim = null; },
  spawn(kind, x, y){ this.parts.push({kind, x, y, life: kind === 'spark' ? 6 : 22}); }
};

// the plant on the head of Puchi (a pink flower) and of Chika (a white moon flower); flower and leaf are crayons
function drawPlant(stage, cx, top, sway, flower, leaf){
  const p = PLANTS[stage]; if(!p) return;
  const h = p.rows.length; const x0 = cx - 1 - p.sc; const y0 = top - h;
  for(let j = 0; j < h; j++){ PEN = j < p.head ? (flower == null ? C.PINK : flower) : (leaf == null ? C.LEAF : leaf); spr([p.rows[j]], x0 + (j < p.head ? sway : 0), y0 + j); }
  PEN = C.PET;
}
function drawSeed(cx, cy, st, ch){
  const sh = SHAPES[0]; PEN = ch.egg; blob(cx, cy, sh.rx, sh.ry);
  const c = Math.round(cy);
  [[-3,-2],[1,-4],[2,1],[-2,2],[-1,-3]].forEach(p => { const x = cx+p[0], y = c+p[1]; if(GET(x,y) !== 1) P(x,y,2); if(GET(x+1,y) !== 1) P(x+1,y,2); });
  const xp = totalXp();
  // the seed sprouts a leaf; the eggs get a crack
  PEN = ch.plant ? ch.leaf : (ch.ink || C.INK);
  if(xp >= 1) (ch.plant ? [[-4,0],[-3,-1],[-2,0],[-1,-1],[0,0]] : [[-4,-1],[-3,0],[-2,-1],[-1,0],[0,-1]]).forEach(p => P(cx+p[0], c+p[1]));
  PEN = ch.ink || C.INK;
  if(xp >= 2){ [[1,-1],[2,0],[3,-1]].forEach(p => P(cx+p[0], c+p[1])); if(!st.blink){ P(cx-2, c+2); P(cx+1, c+2); } }
}
/* ---------- characters ----------
   Every Puchi grows through the same seven stages and moves the same way; what changes is its colour,
   what grows on its head, and a few extras (whiskers and a tail, a beak). Stage 0 is a seed for the
   Sprout and an egg for the others. */
// the top edge of the body at column x (first row inside the blob, from above)
function edgeY(ins, x, from){ for(let y = Math.max(0, from - 12); y < LH; y++) if(ins(x, y)) return y; return from; }
function drawBunnyEars(stage, cx, top, sway, ins){
  const len = [0, 2, 3, 5, 6, 7, 7][stage], gap = stage >= 4 ? 2 : 1;
  [cx - 2 - gap, cx + gap - 1].forEach((x0, side) => {
    const base = edgeY(ins, x0 + 1, top);
    for(let j = 1; j <= len; j++){
      const y = base - j, tip = j === len, lean = (sway && side === 0 && j > len - 2) ? -1 : 0;
      PEN = CHARS.bunny.pen;
      if(tip){ P(x0 + 1 + lean, y); continue; }
      P(x0 + lean, y); P(x0 + 2 + lean, y);
      PEN = C.PINK; P(x0 + 1 + lean, y, j < len - 1 ? 2 : 3);
    }
  });
  if(stage >= 6){ PEN = C.GOLD; P(cx + gap + 2, top - len + 1); P(cx + gap + 3, top - len, 2); }
}
function drawCatEars(stage, cx, top, sway, ins){
  const h = [0, 2, 2, 3, 3, 3, 4][stage], off = Math.max(2, Math.round(SHAPES[stage].rx * .55));
  [cx - off - 1, cx + off].forEach(xc => {
    const base = edgeY(ins, xc, top);
    for(let j = 1; j <= h; j++){
      const w = h - j;   // half-width of this row of the triangle
      PEN = CHARS.kitty.pen;
      if(w === 0){ P(xc, base - j); continue; }
      P(xc - w, base - j); P(xc + w, base - j);
      PEN = C.PINK; for(let x = xc - w + 1; x < xc + w; x++) P(x, base - j, 2);
    }
  });
}
function drawStripes(stage, cx, top, ins){
  if(stage < 2) return;
  PEN = CHARS.kitty.pen;
  [cx - 3, cx - 1, cx + 2].forEach((x, i) => { const n = i === 1 ? 2 : 1; for(let j = 1; j <= n; j++) if(ins(x, top + j) && GET(x, top + j) !== 1) P(x, top + j, 2); });
}
function drawTail(stage, cx, cy, sh, bottom){
  if(stage < 2) return;
  PEN = CHARS.kitty.pen;
  const x = Math.round(cx + sh.rx) - 2, y = bottom;
  [[0, 0, 1], [1, 0, 1], [2, 0, 2], [3, -1, 1], [4, -2, 2], [4, -3, 1], [3, -4, 1]].slice(0, stage >= 4 ? 7 : 5).forEach(p => P(x + p[0], y + p[1], p[2]));
}
function drawTuft(stage, cx, top){
  if(stage >= 5){ PEN = C.RED; spr(['X.X.X', 'XXXXX'], cx - 3, top - 2); return; }
  PEN = C.ORANGE;
  if(stage >= 1) P(cx - 1, top - 1);
  if(stage >= 2){ P(cx - 2, top - 2); P(cx, top - 2, 2); }
  if(stage >= 3){ P(cx - 1, top - 3); P(cx + 1, top - 1, 2); }
}
function drawBeak(m, my, mouth, big){
  PEN = C.ORANGE;
  if(mouth === 'open'){ P(m - 1, my); P(m, my); P(m - 1, my + 2); P(m, my + 2); if(big){ P(m - 1, my + 1, 3); P(m, my + 1, 3); } }
  else if(mouth === 'sleep'){ P(m - 1, my, 2); P(m, my, 2); }
  else { P(m - 1, my); P(m, my); P(m - 1, my + 1, 2); P(m, my + 1, 2); }
  PEN = C.INK;
}
function drawBearEars(stage, cx, top, sway, ins){
  const big = stage >= 3, off = Math.max(2, Math.round(SHAPES[stage].rx * .6));
  [cx - off - 1, cx + off].forEach(xc => {
    const base = edgeY(ins, xc, top);
    PEN = CHARS.bear.pen;
    if(!big){ P(xc - 1, base - 1); P(xc + 2, base - 1); P(xc, base - 2); P(xc + 1, base - 2); P(xc, base - 1, 4); P(xc + 1, base - 1, 4); return; }
    P(xc - 2, base - 1); P(xc + 2, base - 1); P(xc - 1, base - 2); P(xc, base - 2); P(xc + 1, base - 2);
    P(xc - 1, base - 1, 4); P(xc + 1, base - 1, 4); PEN = C.PINK; P(xc, base - 1, 2);
  });
  if(stage === 5){ PEN = C.LEAF; spr(['.XX', 'XX.', '.X.'], cx - 2, top - 3); }   // a leaf from the forest
  if(stage >= 6){ PEN = C.GOLD; spr(['X.X.X', 'XXXXX'], cx - 3, top - 2); }
}
// a creamy muzzle and a button nose
function drawMuzzle(stage, cx, top, ins, my, big, L){
  const m = cx + (L || 0), w = big ? 3 : 2;
  PEN = CHARS.bear.pen;
  for(let y = my - 1; y <= my + (big ? 2 : 1); y++) for(let x = m - w; x < m + w; x++){
    const corner = (x === m - w || x === m + w - 1) && (y === my - 1 || y === my + (big ? 2 : 1));
    if(!corner && ins(x, y) && GET(x, y) !== 1) P(x, y, 3);
  }
  if(big){ PEN = C.INK; P(m - 1, my - 1); P(m, my - 1); }
}
function drawFrogBumps(stage, cx, top, sway, ins){
  const big = stage >= 3, ex = EX[stage];
  PEN = CHARS.frog.pen;
  [-1, 1].forEach(side => {
    // a dome over each eye, its walls running down until they meet the body
    const x0 = big ? (side < 0 ? cx - 4 - ex : cx + ex - 2) : (side < 0 ? cx - 2 - ex : cx + ex - 1), w = big ? 6 : 3;
    const y0 = big ? top - 3 : top - 2, x1 = x0 + w - 1;
    let base = y0; for(let x = x0; x <= x1; x++) base = Math.max(base, edgeY(ins, x, top));
    for(let y = y0; y <= base; y++) for(let x = x0; x <= x1; x++){
      const wall = x === x0 || x === x1, roof = y === y0;
      if(roof && wall) continue;
      if(GET(x, y) === 1 && !wall && !roof) { P(x, y, 4); continue; }
      if(wall || roof) { if(!(ins(x, y) && GET(x, y) !== 1 && !roof && y > top)) P(x, y, 1); }
      else P(x, y, 4);
    }
  });
  if(stage >= 4){ PEN = C.PINK; spr(['.X.', 'XoX', '.X.'], cx - 2, top - 3); }
  if(stage >= 6){ PEN = C.GOLD; spr(['X.X', 'XXX'], cx - 2, top - 5); }
}
// a wide froggy grin
function frogMouth(stage, m, my, mouth, big){
  PEN = C.INK;
  if(mouth === 'smile'){ P(m - 3, my - 1); P(m + 2, my - 1); }
  else if(mouth === 'neutral' || mouth == null){ P(m - 2, my + 1); P(m + 1, my + 1); P(m - 3, my); P(m + 2, my); }
}
const CHARS = {
  // Puchi and Chika: the two first friends, light and dark, both open from the start
  sprout: {id: 'sprout', xp: 0, pen: C.PET, egg: C.BROWN, plant: true, leaf: C.LEAF, head: (s, cx, top, sway) => drawPlant(s, cx, top, sway, C.PINK, C.LEAF)},
  chika: {id: 'chika', xp: 0, pen: C.NIGHT, egg: C.NIGHT, ink: C.MOON, plant: true, leaf: C.MINT, head: (s, cx, top, sway) => drawPlant(s, cx, top, sway, C.GOLD, C.MINT)},
  bunny: {id: 'bunny', xp: 30, pen: C.LILAC, egg: C.LILAC, head: drawBunnyEars},
  kitty: {id: 'kitty', xp: 75, pen: C.ORANGE, egg: C.ORANGE, head: drawCatEars, face: (s, cx, top, ins) => drawStripes(s, cx, top, ins), back: drawTail},
  chick: {id: 'chick', xp: 140, pen: C.GOLD, egg: C.GOLD, feet: C.ORANGE, head: drawTuft, beak: true},
  // sold in the store (pack: the bundle they come in; never opened by wins)
  bear: {id: 'bear', xp: Infinity, pack: 'char-bear', pen: C.BROWN, egg: C.BROWN, fill: 4, head: drawBearEars, face: drawMuzzle},
  frog: {id: 'frog', xp: Infinity, pack: 'char-frog', pen: C.LEAF, egg: C.MINT, fill: 4, head: drawFrogBumps, eyesUp: true, after: frogMouth}
};
const CHAR_LIST = Object.keys(CHARS).map(k => CHARS[k]);
let CHAR = 'sprout';   // set by the page from the settings

function drawPet(stage, st){
  const ch = CHARS[st.char || CHAR] || CHARS.sprout;
  const sh = SHAPES[stage]; const cx = 32 + st.xoff;
  const feet = stage >= 2;
  const bottom = (feet ? G-2 : G-1) - st.lift;
  const cy = bottom + 1 - sh.ry;
  const keepPen = PEN;
  if(stage === 0){ drawSeed(cx, cy, st, ch); PEN = keepPen; return {cx, top: Math.round(cy - sh.ry)}; }
  if(ch.back) ch.back(stage, cx, cy, sh, bottom);
  PEN = ch.pen;
  const ins = blob(cx, cy, sh.rx, sh.ry, ch.fill);
  let top = bottom; for(let y = bottom; y >= 0; y--){ if(ins(cx-1, y)) top = y; else break; }
  ch.head(stage, cx, top, st.sway, ins);
  const big = stage >= 3, ex = EX[stage], L = st.look;
  const faceY = Math.round(cy) - (big ? 2 : 1);
  const my = faceY + (big ? 4 : (stage === 1 ? 2 : 3));
  const eyeY = ch.eyesUp ? top - (big ? 2 : 1) : faceY;   // the frog's eyes sit up in their bumps
  PEN = C.PINK;
  if(st.cheeks){
    const xs = big ? [cx-ex-4, cx-ex-3, cx+ex+2, cx+ex+3] : [cx-ex-3, cx-ex-2, cx+ex+1, cx+ex+2];
    xs.forEach(x => { const xx = x + L; if(ins(xx, my-1) && GET(xx, my-1) !== 1) P(xx, my-1, 2); });
  }
  PEN = ch.ink || C.INK;   // the face: dark on the light friends, light on Chika
  [-1, 1].forEach(side => {
    if(!big){
      const x = (side < 0 ? cx-1-ex : cx+ex) + L;
      if(st.eyes === 'open'){ P(x, eyeY); P(x, eyeY+1); }
      else if(st.eyes === 'blink'){ P(x, eyeY+1); }
      else if(st.eyes === 'happy'){ P(x-1, eyeY+1); P(x, eyeY); P(x+1, eyeY+1); }
      else { P(x-1, eyeY+1); P(x, eyeY+1); }
    } else {
      const a = (side < 0 ? cx-2-ex : cx+ex) + L, b = a+1;
      if(st.eyes === 'open'){ for(let y = eyeY; y < eyeY+3; y++){ P(a,y); P(b,y); } P(a, eyeY, 3); }
      else if(st.eyes === 'blink'){ P(a, eyeY+2); P(b, eyeY+2); }
      else if(st.eyes === 'happy'){ P(a-1, eyeY+1); P(a, eyeY); P(b, eyeY); P(b+1, eyeY+1); }
      else { P(a-1, eyeY+2); P(a, eyeY+2); P(b, eyeY+2); P(b+1, eyeY+2); }
    }
  });
  const m = cx + L;
  if(ch.face) ch.face(stage, cx, top, ins, my, big, L);
  if(ch.beak){ drawBeak(m, my, st.mouth, big); }
  else if(st.mouth === 'smile'){ P(m-2,my); P(m+1,my); P(m-1,my+1); P(m,my+1); }
  else if(st.mouth === 'open'){
    for(let x = m-2; x <= m+1; x++) P(x, my);
    if(big){ P(m-2,my+1); P(m+1,my+1); P(m-1,my+1,2); P(m,my+1,2); P(m-1,my+2); P(m,my+2); }
    else { P(m-1,my+1); P(m,my+1); }
  }
  else if(st.mouth === 'sleep'){ P(m-1,my+1,2); P(m,my+1,2); }
  else if(st.mouth === 'sad'){ P(m-1,my); P(m,my); P(m-2,my+1); P(m+1,my+1); }
  else { P(m-1,my+1); P(m,my+1); }
  if(ch.after) ch.after(stage, m, my, st.mouth, big);
  // outfits bought with stars
  if(st.wear === 'glasses'){
    [-1, 1].forEach(side => {
      if(!big){ const x = (side < 0 ? cx-1-ex : cx+ex) + L; for(let i = -1; i <= 1; i++){ P(x+i, eyeY-1); P(x+i, eyeY+2); } P(x-1, eyeY); P(x-1, eyeY+1); P(x+1, eyeY); P(x+1, eyeY+1); }
      else { const a = (side < 0 ? cx-2-ex : cx+ex) + L; for(let i = -1; i <= 2; i++){ P(a+i, eyeY-1); P(a+i, eyeY+3); } for(let y = eyeY; y < eyeY+3; y++){ P(a-1, y); P(a+2, y); } }
    });
    const bl = cx - ex + L, br = cx + ex - (big ? 1 : 2) + L;
    for(let x = bl; x <= br; x++) P(x, eyeY);
  } else if(st.wear === 'scarf'){
    PEN = C.BLUE;
    const sy = my + (big ? 3 : 2);
    let xr = cx;
    for(let x = cx - 12; x <= cx + 12; x++){ if(ins(x, sy)){ P(x, sy); if(x > xr) xr = x; } if(ins(x, sy + 1)) P(x, sy + 1, (x & 1) ? 1 : 2); }
    P(xr - 2, sy + 2); P(xr - 1, sy + 2); P(xr - 2, sy + 3); P(xr - 1, sy + 3, 2); P(xr - 2, sy + 4, 2);
  } else if(st.wear === 'bow'){
    PEN = C.RED;
    const bx = cx + Math.round(sh.rx * .5) - 2, by = top - 1;
    spr(['XX.XX', 'XXXXX', 'XX.XX'], bx, by);
    P(bx + 2, by + 1, 2);
  }
  // the dress-up pack from the store
  else if(st.wear === 'crown'){
    PEN = C.GOLD;
    const w = big ? 7 : 5, x0 = cx - (w >> 1) - 1, y0 = top - 3;
    for(let i = 0; i < w; i++){ if(i % ((w - 1) >> 1) === 0) P(x0 + i, y0); P(x0 + i, y0 + 1, i % 2 ? 2 : 1); P(x0 + i, y0 + 2); }
    PEN = C.RED; P(x0 + (w >> 1), y0 + 1, 2);
  } else if(st.wear === 'flowers'){
    // a ring of little flowers along the top of the head
    const n = big ? 4 : 3, span = Math.round(sh.rx * 1.2), pens = [C.PINK, C.GOLD, C.LILAC, C.BLUE];
    for(let i = 0; i < n; i++){
      const x = Math.round(cx - 1 - span / 2 + i * span / (n - 1)), y = edgeY(ins, x, top) - 1;
      PEN = C.LEAF; if(i < n - 1) P(x + 1, y + 1, 2);
      PEN = pens[i % 4]; P(x - 1, y); P(x + 1, y); P(x, y - 1); P(x, y + 1); PEN = C.GOLD; P(x, y, 3);
    }
  } else if(st.wear === 'phones'){
    // headphones: a band over the head and a cup on each side
    const xl = Math.round(cx - sh.rx) - 1, xr = Math.round(cx + sh.rx) - 1;
    PEN = C.LILAC;
    for(let x = xl + 2; x <= xr - 2; x++) P(x, edgeY(ins, x, top) - 2, x === xl + 2 || x === xr - 2 ? 1 : 2);
    for(let y = edgeY(ins, xl + 2, top) - 1; y < faceY; y++){ P(xl + 1, y); P(xr - 1, y); }
    PEN = C.PINK;
    [xl, xr - 1].forEach(x => { for(let y = faceY; y < faceY + (big ? 4 : 3); y++){ P(x, y); P(x + 1, y, y === faceY || y === faceY + (big ? 3 : 2) ? 1 : 2); } });
  } else if(st.wear === 'shades'){
    // sunglasses: two dark lenses with a glint
    [-1, 1].forEach(side => {
      if(!big){ const x = (side < 0 ? cx-1-ex : cx+ex) + L; for(let y = eyeY; y <= eyeY + 1; y++) for(let i = -1; i <= 1; i++) P(x + i, y); PEN = C.GRAY; P(x - 1, eyeY, 3); PEN = C.INK; }
      else { const a = (side < 0 ? cx-2-ex : cx+ex) + L; for(let y = eyeY; y <= eyeY + 2; y++) for(let i = -1; i <= 2; i++) if(!(y === eyeY + 2 && (i === -1 || i === 2))) P(a + i, y); PEN = C.GRAY; P(a - 1, eyeY, 3); P(a, eyeY, 3); PEN = C.INK; }
    });
    const bl = cx - ex + L, br = cx + ex - (big ? 1 : 2) + L;
    for(let x = bl; x <= br; x++) P(x, eyeY);
  }
  PEN = ch.feet || ch.pen;
  if(feet){
    const fo = stage >= 3 ? 2 : 1; const fy = G - 1 - st.lift;
    P(cx-fo-2, fy - (st.step === 1 ? 1 : 0)); P(cx-fo-1, fy - (st.step === 1 ? 1 : 0));
    P(cx+fo, fy - (st.step === 2 ? 1 : 0)); P(cx+fo+1, fy - (st.step === 2 ? 1 : 0));
  }
  PEN = ch.pen;
  if(stage >= 3){
    const ay = Math.round(cy) + 1;
    let xl = cx - 1, xr = cx; while(ins(xl - 1, ay)) xl--; while(ins(xr + 1, ay)) xr++;
    const up = st.arms === 'up', waveR = st.arms === 'wave';
    if(up){ P(xl-1, ay-1); P(xl-2, ay-2); } else { P(xl-1, ay); P(xl-2, ay+1); }
    if(up || waveR){ P(xr+1, ay-1); P(xr+2, ay-2); } else { P(xr+1, ay); P(xr+2, ay+1); }
  }
  PEN = keepPen;
  return {cx, top};
}

function growRows(rows, i, F){
  if(!Pet.grow || Pet.grow.idx !== i) return rows;
  const a = F - Pet.grow.f0; if(a >= rows.length * 2){ return rows; }
  const n = Math.max(1, Math.ceil((a+1)/2)); return rows.slice(rows.length - n);
}


/* the screen: the 64×36 pixel buffer painted onto the canvas in a small, sweet palette
   (a dark line, a middle tone and a pale fill per crayon) */
const cv = document.getElementById('lcd'); const ctx = cv.getContext('2d');
const col = {inverted:false};
let SC = 4;
function paint(){ paintColor(ctx, cv.width, cv.height, SC); }

const PAL = [
  ['#3d2c4e', '#8f7fa3', '#efe8f5'],   // ink
  ['#cf5a7c', '#f29ab4', '#ffe1e9'],   // the pet
  ['#3b9656', '#7fcb8d', '#d5f2dc'],   // leaf

  ['#e3940c', '#f6c85a', '#fff0c2'],   // gold
  ['#7d62c9', '#b3a1ea', '#ebe5fb'],   // lilac
  ['#3b86d1', '#86bbee', '#dbecfd'],   // blue
  ['#94603a', '#c79770', '#f3e3d2'],   // brown
  ['#ec7232', '#f6a676', '#ffe4d3'],   // orange
  ['#1fa594', '#74d3c6', '#d2f4ef'],   // mint
  ['#767b8c', '#b1b4c1', '#eaebf0'],   // gray

    }
    if(B.fx === 'party' && d >= 0 && d < 1.2){ Object.assign(st, {eyes: 'happy', mouth: 'open', cheeks: true, arms: 'up'}); st.lift = hop(d, who === 'p' ? 0 : .1, .42, 5) + hop(d, who === 'p' ? .5 : .6, .42, 5); }

    else if(B.fx === 'bloom' && who === 'c' && d < 0) stage = b.cBefore;

}

    if(txt.innerHTML !== h) txt.innerHTML = h;
    const tl = clamp(REEL_X + SPEAKER[who] * REEL_S - el.offsetLeft - 30, 40, el.offsetWidth - 90);
    el.style.setProperty('--tl', tl + 'px'); el.style.setProperty('--ox', (tl + 23) + 'px'); el.style.setProperty('--oy', pos === 'up' ? '100%' : '0%');
    show(el, t, L.t0, L.out);
  });
}
// the overlays on a beat's picture: a game's HUD, a big GAME OVER, a zoom, a shake
function overlays(b, t, still){
  const B = b.B, hud = $('#hud'), over = $('#over');
  if(hud){ if(B.hud){ if(hud.innerHTML !== B.hud) hud.innerHTML = B.hud; hud.style.opacity = 1; } else hud.style.opacity = 0; }
  if(over){
    const at = b.start + (B.overAt || 0);
    if(B.over && (still || t >= at)){ if(over.innerHTML !== B.over) over.innerHTML = B.over; over.style.opacity = still ? 1 : (((t - at) * 4 | 0) % 2 || t - at > 1 ? 1 : .25); over.style.transform = 'translate(-50%,-50%) scale(' + (still ? 1 : popScale(t - at)) + ')'; }
    else over.style.opacity = 0;
  }
  const box = $('#cvStory');
  if(box && $('#cvBox')){
    let tr = '';
    if(B.zoom && !still){ const z = B.zoom, k = ease((t - b.start - (z.at || 0)) / (z.dur || .6)); const sc = 1 + ((z.to || 1.8) - 1) * k;
      const ox = REEL_S * (z.x != null ? z.x : (z.who === 'p' ? 18 : 46)), oy = REEL_S * (z.y || 22); box.style.transformOrigin = ox + 'px ' + oy + 'px'; tr += 'scale(' + sc + ')'; }
    if(B.shake && !still){ const [s0, d] = B.shake; const k = t - b.start - s0; if(k >= 0 && k < d) tr += ' translate(' + (((t * 40) | 0) % 2 ? 10 : -10) + 'px,' + (((t * 33) | 0) % 2 ? 6 : -6) + 'px)'; }
    box.style.transform = tr;
  }
  const dk = $('#dark');
  if(dk){ let o = 0; if(B.fx === 'evil' && b.fxAt != null && t >= b.fxAt) o = .35; if(B.dark) o = B.dark; dk.style.opacity = o; }
}
window.renderAt = function(t){
  const S = POST.story, e = TL.ctaStart, CV = TL.cover;
  if(S.wall){
    const cv = $('#cvWall'), sc = 53, b = TL.beats.find(b => t >= b.start && t < b.end) || TL.beats[0];
    cv.style.left = Math.round(540 - (S.wall.x != null ? S.wall.x : 32) * sc) + 'px';
    paintScene(cv, () => drawBeat(b, t, false), sc);
    show($('#wallPill'), t, .3, 2.8, {base: 'translateX(-50%)', pop: false, rise: 30});   // gone before people pause to screenshot
    return;
  }
  const cov = $('#cover'), sto = $('#story'), cta = $('#cta');
  if(cov){
    cov.style.opacity = t < CV - .3 ? 1 : clamp(1 - (t - (CV - .3)) / .3, 0, 1);
    cov.style.transform = t > CV - .3 ? 'scale(' + (1 + (t - (CV - .3)) * .1) + ')' : '';
  }
  sto.style.opacity = !cov ? (t < e - .1 ? 1 : clamp(1 - (t - (e - .1)) / .3, 0, 1)) : t < CV - .2 ? 0 : t < e - .1 ? clamp((t - (CV - .2)) / .3, 0, 1) : clamp(1 - (t - (e - .1)) / .3, 0, 1);
  cta.style.opacity = clamp((t - e) / .3, 0, 1);
  if(cov && t < CV + .1){
    show($('#cLogo'), t, .05, null, {base: 'translateX(-50%)'});
    show($('#cEp'), t, .2, null, {base: 'translateX(-50%)'});
    show($('#cTitle'), t, .4);
    show($('#cPanel'), t, .55, null, {pop: false, rise: 120});
    const cb = stillBeat(Object.assign({place: S.place}, S.cover || COVER_SCENE));
    paintScene($('#cvCover'), () => { drawBeat(cb, t, false); }, REEL_S);
  }
  if(t >= CV - .3 && t < e + .3){
    const b = TL.beats.find(b => t >= b.start && t < b.end) || (t < TL.beats[0].start ? TL.beats[0] : TL.beats[TL.beats.length - 1]);
    paintScene($('#cvStory'), () => drawBeat(b, t, false), REEL_S);
    const nar = $('#nar');
    if(b.B.nar){ if(nar.innerHTML !== b.B.nar) nar.innerHTML = b.B.nar; show(nar, t, b.start + .2, b.end - .15, {base: 'rotate(-2.5deg)'}); } else nar.style.opacity = 0;
    // a white flash for the big moments and when the place changes
    let fl = 0;
    TL.beats.forEach((x, i) => {
      const prev = TL.beats[i - 1];
      if(i > 0 && prev && !x.B.cut && (prev.place !== x.place || prev.night !== x.night)) fl = Math.max(fl, Math.max(0, .7 - (t - x.start) / .3 * .7) * (t >= x.start ? 1 : 0));
      if(x.fxAt != null && ['win', 'bloom', 'grow', 'sun'].includes(x.B.fx) && t >= x.fxAt) fl = Math.max(fl, Math.max(0, .85 - (t - x.fxAt) / .35 * .85));
    });
    $('#flash').style.opacity = fl;
    overlays(b, t, false);
    bubbles(t);
    if(S.meme){ const hk = $('#hook'), hb = b.B.hook; if(hb != null && hk.innerHTML !== hb) hk.innerHTML = hb; else if(hb == null && S.hook && hk.innerHTML !== S.hook) hk.innerHTML = S.hook; }
  }
  if(t >= e){
    show($('#tPanel'), t, e + .05, null, {pop: false, rise: 120});
    show($('#tH'), t, e + .4);
    show($('#tSub'), t, e + 1.0, null, {pop: false, rise: 30});
    show($('#tLogo'), t, e + 1.6, null, {base: 'translateX(-50%)'});
    // they wave, then sing along at the end
    const sc = Object.assign({place: S.place}, S.ctaScene || CTA_SCENE, S.meme ? {} : {fx: 'sing'});
    const cb = Object.assign(stillBeat(sc), {fxAt: S.meme ? null : e + 1.3, start: e, cStage: TL.beats[TL.beats.length - 1].cStage});
    paintScene($('#cvCta'), () => drawBeat(cb, t, false), REEL_S);
  }
};

/* ---------- start ---------- */
window.info = () => ({id: POST.id, type: POST.type, slides: POST.type === 'reel' ? 0 : slideList().length, dur: DUR, story: !!POST.story, app: !!POST.app});
if(POST.app){ /* app demos are filmed from the app itself (bot/app.mjs); this page only makes their sound */ }
else if(JOB.kind === 'reel') buildReel(); else if(POST.story || (POST.slides && POST.slides[JOB.n])) buildSlide(JOB.n);
document.fonts.ready.then(() => {
  if(POST.app){} else if(JOB.kind === 'reel') renderAt(0); else { const h = document.querySelector('.slide.cover h1'); if(h && h.offsetHeight > 130) h.closest('.slide').classList.add('two'); aimTails(); }
  document.body.dataset.ready = '1';
});

function queueDay(k, cellId){
  persistLocalCopy();
  if(Store.mode !== 'cloud'){ lsSet(LOCAL_KEY, snapshotAll()); return; }
  (Store.pend[k] = Store.pend[k] || {})[cellId] = true;
  setSync('saving');
  clearTimeout(Store.timers[k]);
  Store.timers[k] = setTimeout(() => { Store.timers[k] = null; flushDay(k); }, 350);
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function writeDay(k, ids){
  const day = S.days[k] || {};
  const c = {}; ids.forEach(id => { c[id] = Array.isArray(day[id]) ? day[id].slice() : null; });
  const ref = Store.col.doc('d' + k);
  try { await ref.update({c}); }
  catch(e){
    if(e && e.code === 'invalid_argument'){
      const full = {}; for(const id in day){ if(Array.isArray(day[id])) full[id] = day[id].slice(); }
      await ref.set({date:k, c:full});
    } else throw e;
  }
}
async function flushDay(k){
  if(Store.busy[k]) return;
  Store.busy[k] = true;
  let failed = false;
  try {
    while(Store.pend[k] && Object.keys(Store.pend[k]).length){
      const ids = Object.keys(Store.pend[k]); Store.pend[k] = {};
      try { await writeDay(k, ids); }
      catch(e){
        if(e && (e.code === 'unavailable' || e.code === 'resource_exhausted')){ await sleep(700 + Math.random()*900); await writeDay(k, ids); }
        else throw e;
      }
    }
  } catch(e){ failed = true; setSync('err'); }
  finally {
    Store.busy[k] = false;
    if(!failed){ if(Store.pend[k] && Object.keys(Store.pend[k]).length) flushDay(k); else if(!anyPending()) setSync('ok'); }
  }
}
function anyPending(){ for(const k in Store.pend){ if(dayPending(k)) return true; } return Store.setBusy || Store.setDirty || petPending(); }
function saveSettings(){
  persistLocalCopy();
  if(Store.mode !== 'cloud'){ lsSet(LOCAL_KEY, snapshotAll()); return; }
  Store.setDirty = true; setSync('saving');
  clearTimeout(Store.setTimer);
  Store.setTimer = setTimeout(async () => {
    Store.setTimer = null;
    if(Store.setBusy) return;
    Store.setBusy = true;
    try {
      while(Store.setDirty){ Store.setDirty = false; await Store.col.doc('settings').set(JSON.parse(JSON.stringify(S.settings))); }
      if(!anyPending()) setSync('ok');
    } catch(e){ setSync('err'); }
    finally { Store.setBusy = false; }
  }, 300);
}

/* ---------- diary pages: one document per day, saved while typing ---------- */
const JW = {timer:{}, busy:{}, dirty:{}, retry:{}};
function jPending(k){ return !!(JW.timer[k] || JW.busy[k] || JW.dirty[k]); }
function nbStatus(s){
  const el = document.getElementById('nbStatus'); if(!el) return;
  el.textContent = s ? tx('notebook.' + s) : '';
}
function queueJournal(k){
  persistLocalCopy();
  if(Store.mode !== 'cloud'){ lsSet(LOCAL_KEY, snapshotAll()); nbStatus('local'); return; }
  JW.dirty[k] = true; nbStatus('typing');
  clearTimeout(JW.timer[k]);
  JW.timer[k] = setTimeout(() => { JW.timer[k] = null; flushJournal(k); }, 900);
}
async function writeJournal(k){
  const e = S.journal[k]; const ref = Store.col.doc('j' + k);
  if(!e || !e.text.trim()) await ref.delete();
  else await ref.set({date:k, text:e.text, updatedAt:e.updatedAt || new Date().toISOString()});
}
async function flushJournal(k){
  if(JW.busy[k] || !Store.col) return;
  JW.busy[k] = true; let ok = true;
  try {
    while(JW.dirty[k]){
      JW.dirty[k] = false; nbStatus('saving');
      try { await writeJournal(k); }
      catch(err){
        if(err && (err.code === 'unavailable' || err.code === 'resource_exhausted')){ await sleep(800 + Math.random()*800); await writeJournal(k); }
        else throw err;
      }
    }
  } catch(err){ ok = false; JW.dirty[k] = true; nbStatus('err'); JW.retry[k] = (JW.retry[k] || 0) + 1; if(JW.retry[k] <= 3) setTimeout(() => flushJournal(k), 6000); }
  finally {
    JW.busy[k] = false;
    if(ok){ JW.retry[k] = 0; if(JW.dirty[k]) flushJournal(k); else { nbStatus('saved'); if(typeof renderNbList === 'function' && document.activeElement !== document.getElementById('nbText')) renderNbList(); } }
  }
}
function flushJournalNow(){ for(const k in JW.timer){ if(JW.timer[k]){ clearTimeout(JW.timer[k]); JW.timer[k] = null; flushJournal(k); } } }
document.addEventListener('visibilitychange', () => { if(document.hidden) flushJournalNow(); });
window.addEventListener('pagehide', flushJournalNow);

/* ---------- to-do list: one document holding the whole list ---------- */
const TW = {timer:null, busy:false, dirty:false, retry:0};
function normTodos(a){
  if(!Array.isArray(a)) return [];
  return a.filter(t => t && typeof t.text === 'string' && t.id).map(t => ({id:String(t.id), text:t.text.slice(0, 120), done:!!t.done, at:t.at || '', doneAt:t.doneAt || ''})).slice(0, 300);
}
function todoPending(){ return !!(TW.timer || TW.busy || TW.dirty); }
function tdStatus(s){ const el = document.getElementById('tdStatus'); if(el) el.textContent = s ? tx('notebook.' + s) : ''; }
function queueTodos(){
  persistLocalCopy();
  if(Store.mode !== 'cloud'){ lsSet(LOCAL_KEY, snapshotAll()); tdStatus('local'); return; }
  TW.dirty = true; tdStatus('saving');
  clearTimeout(TW.timer);
  TW.timer = setTimeout(() => { TW.timer = null; flushTodos(); }, 400);
}
async function flushTodos(){
  if(TW.busy || !Store.col) return;
  TW.busy = true; let ok = true;
  try {
    while(TW.dirty){
      TW.dirty = false;
      const body = {items: JSON.parse(JSON.stringify(S.todos))};
      try { await Store.col.doc('todos').set(body); }
      catch(err){ if(err && (err.code === 'unavailable' || err.code === 'resource_exhausted')){ await sleep(800 + Math.random()*800); await Store.col.doc('todos').set(body); } else throw err; }
    }
  } catch(err){ ok = false; TW.dirty = true; tdStatus('err'); TW.retry++; if(TW.retry <= 3) setTimeout(flushTodos, 6000); }
  finally { TW.busy = false; if(ok){ TW.retry = 0; if(TW.dirty) flushTodos(); else tdStatus('saved'); } }
}
function flushTodosNow(){ if(TW.timer){ clearTimeout(TW.timer); TW.timer = null; flushTodos(); } }
document.addEventListener('visibilitychange', () => { if(document.hidden) flushTodosNow(); });
window.addEventListener('pagehide', flushTodosNow);

/* ---------- backup and moving data between versions: merge, never delete ---------- */
function exportData(){
  return JSON.stringify({puchika: 1, at: new Date().toISOString(), settings: S.settings, days: S.days, journal: S.journal, todos: S.todos, pet: S.pet});
}
function parseBackup(text){
  try { const o = JSON.parse(String(text || '').trim()); if(o && typeof o === 'object' && (o.days || o.settings || o.journal)) return o; } catch(e){}
  return null;
}
function winsIn(days){ let n = 0; for(const k in days || {}){ const d = days[k] || {}; for(const id in d) n += cnt(d[id]); } return n; }
function mergeInto(src){
  const out = {wins: 0, notes: 0, todos: 0, cells: 0};
  if(!src || !S.ready) return out;
  // settings first, so cells made on the other device have names and icons here
  const ss = src.settings && typeof src.settings === 'object' ? src.settings : {};
  let setChanged = false;
  const have = new Set(allDefs().map(c => c.id));
  (Array.isArray(ss.custom) ? ss.custom : []).forEach(c => {
    if(c && c.id && c.label && !have.has(c.id)){ S.settings.custom.push({id: String(c.id), label: String(c.label).slice(0, 40), icon: String(c.icon || '✨').slice(0, 8), tint: TINTS.includes(c.tint) ? c.tint : 't3', max: Math.max(1, Math.min(10, c.max | 0 || 1))}); have.add(c.id); out.cells++; setChanged = true; }
  });
  (Array.isArray(ss.hidden) ? ss.hidden : []).forEach(id => { if(!S.settings.hidden.includes(id)){ S.settings.hidden.push(id); setChanged = true; } });
  if(!S.settings.petName && ss.petName){ S.settings.petName = String(ss.petName).slice(0, 16); setChanged = true; }
  if(!S.settings.userName && ss.userName){ S.settings.userName = String(ss.userName).slice(0, 20); setChanged = true; }
  if(!S.settings.skin && SKINS[ss.skin]){ S.settings.skin = ss.skin; setChanged = true; }
  // what was opened over there stays open here; choices and stickers come along if this side has none

function toggle(cellId, slot){
  if(!S.ready || editMode) return;
  const def = defById(cellId); if(!def) return;
  const max = def.max || 1;
  const isToday = sel === todayKey();
  const day = S.days[sel] || (S.days[sel] = {});
  const arr = Array.isArray(day[cellId]) ? day[cellId].slice() : [];
  while(arr.length < max) arr.push(null);
  const stamp = isToday ? nowHM() : '';
  const prevXp = totalXp();
  let added = false;
  if(slot == null){
    if(max === 1){ if(arr[0] != null) arr[0] = null; else { arr[0] = stamp; added = true; } }
    else {
      const i = arr.findIndex(v => v == null);
      if(i === -1){ say(tx('board.full')); Pet.react('pet'); Sound.chirp(); return; }
      arr[i] = stamp; added = true;
    }
  } else {
    if(arr[slot] != null) arr[slot] = null; else { arr[slot] = stamp; added = true; }
  }
  day[cellId] = arr.some(v => v != null) ? arr : null;
  if(day[cellId] === null){ delete day[cellId]; }
  queueDay(sel, cellId);
  justDone = added ? cellId : null;
  const xp = totalXp();
  const before = stageOf(prevXp), after = stageOf(xp);
  const allDone = added && isToday && everyCellDone() && allDoneDay !== sel;   // the full-day party once a day
  if(allDone) allDoneDay = sel;
  if(added && isToday) Pet.grow = {idx: dayCount(sel) - 1, f0: Pet.F};
  if(after > before){ const m = tx('chars.' + CHAR + '.evolve.' + after); Pet.evolve(before, after); say(m); Sound.evolve(); Sound.babble(m, 1.1); }
  else {
    Pet.stage = after;
    if(added){
      Pet.react('cheer'); const m = praise(def, isToday); say(m);
      const n = dayCount(sel);
      if(allDone) Sound.pop();   // the party brings its own music
      else { Sound.done(n); if(isToday && MILESTONE_AT.indexOf(n) >= 0) Sound.sparkle(.15, 5); }
    }
    else { Pet.react('undo'); say(tx('praise.undo')); Sound.undo(); }

   provider; the points are only ever added by the server once the payment has gone through (PAY.mode 'live',

function packItems(p){
  if(p.kind === 'wear') return Object.keys(PetCore.ITEMS).filter(k => PetCore.ITEMS[k].pack === p.id);

function itemPack(kind, id){
  if(kind === 'wear') return (PetCore.ITEMS[id] || {}).pack || '';
  if(kind === 'game') return PetCore.GAME_PACKS[id] || '';
  const it = KINDS[kind] && KINDS[kind].items.find(e => e.id === id); return it && it.pack || '';
}
function ownsItem(kind, id){
  const pk = itemPack(kind, id), w = wallet();
  return !!pk && (w.packs.indexOf(pk) >= 0 || w.got.indexOf(kind + ':' + id) >= 0);

function packPrice(p){
  const all = packItems(p).length, miss = all - packHave(p);
  return miss >= all ? p.price : Math.max(10, Math.ceil(p.price * miss / all / 10) * 10);

}

function buyPack(id){

async function callFn(name, data){
  const tok = await FB.user.getIdToken();
  const r = await fetch(PAY.cfg.fn + name, {method: 'POST', headers: {'Content-Type': 'application/json', Authorization: 'Bearer ' + tok}, body: JSON.stringify({data})});
  const j = await r.json().catch(() => ({}));
  if(!r.ok || j.error) throw Object.assign(new Error((j.error && j.error.message) || 'server ' + r.status), {status: (j.error && j.error.status) || ''});
  return j.result;
}
let serverBusy = false;
function serverBuy(data, done){
  if(serverBusy) return;

/* ---------- stickers on the shell ----------
   Tap a sticker to pick it. Drag it to move; drag its corner handle to turn and resize it around its
   middle; × peels it off. On a touch screen two fingers pinch and twist it; on a computer the wheel
   resizes it (Shift + wheel turns it). Each sticker keeps x, y (% of the shell), r (degrees) and s (size). */
let decorating = false, stkKey = '', selStk = -1, gest = null;
const TILTS = [-16, -8, 0, 8, 16];
const STK_MIN = .5, STK_MAX = 2.4, STK_W = 15;   // size limits, and the width (% of the shell) at size 1
function stickersOf(){ return Array.isArray(S.settings.stickers) ? S.settings.stickers : []; }
function setDecorating(on){
  decorating = !!on;

  $('.shell').classList.toggle('decorating', decorating);
}
const stkStyle = s => 'left:' + s.x + '%;top:' + s.y + '%;--r:' + Math.round(s.r || 0) + 'deg;width:' + (STK_W * (s.s || 1)).toFixed(2) + '%';
function renderStickers(force){
  const list = stickersOf().filter(s => stickerById(s.id));
  const key = JSON.stringify(list);
  if(key === stkKey && !force) return;
  stkKey = key;
  if(selStk >= list.length) selStk = -1;
  $('#stkLayer').innerHTML = list.map((s, i) => '<div class="decal' + (i === selStk ? ' sel' : '') + '" data-i="' + i + '" style="' + stkStyle(s) + '">' + stickerSvg(s.id)
    + '<i class="decal-x" data-x aria-hidden="true">×</i><i class="decal-h" data-h aria-hidden="true">↻</i></div>').join('');
  $('#stkArt').innerHTML = list.map((s, i) => '<div class="decal" data-i="' + i + '" style="' + stkStyle(s) + '">' + stickerSvg(s.id) + '</div>').join('');
}
const artOf = i => document.querySelector('#stkArt .decal[data-i="' + i + '"]');

// keep a sticker on the shell and out from under the screen
function settle(s){
  const sh = $('.shell').getBoundingClientRect(), bz = $('.shell .bezel').getBoundingClientRect();
  s.x = Math.max(4, Math.min(96, s.x)); s.y = Math.max(3, Math.min(97, s.y));
  const L = (bz.left - sh.left) / sh.width * 100, R = (bz.right - sh.left) / sh.width * 100, T = (bz.top - sh.top) / sh.height * 100, B = (bz.bottom - sh.top) / sh.height * 100;
  if(s.x > L + 2 && s.x < R - 2 && s.y > T + 2 && s.y < B - 2){
    const d = [[s.x - L, 'l'], [R - s.x, 'r'], [s.y - T, 't'], [B - s.y, 'b']].sort((a, b) => a[0] - b[0])[0][1];
    if(d === 'l') s.x = Math.max(4, L); else if(d === 'r') s.x = Math.min(96, R); else if(d === 't') s.y = Math.max(3, T); else s.y = Math.min(97, B);

  s.r = Math.round(r); s.s = Math.round(Math.max(STK_MIN, Math.min(STK_MAX, s.s || 1)) * 100) / 100;
  s.x = Math.round(s.x * 10) / 10; s.y = Math.round(s.y * 10) / 10;
}
function saveStickers(list, sel){
  S.settings.stickers = list; selStk = sel == null ? selStk : sel;
  saveSettings(); renderStickers(true);
}
function addSticker(id){
  const list = stickersOf().slice();
  if(list.length >= STICKER_MAX){ Sound.nope(); say(tx('stickers.full')); return; }
  // a free spot around the screen: the top corners, then the bottom corners, then anywhere left
  const spots = [[14, 8], [86, 8], [12, 86], [88, 86], [30, 6], [70, 6], [8, 70], [92, 70], [26, 93], [74, 93]];
  const free = spots.find(p => !list.some(s => Math.abs(s.x - p[0]) < 9 && Math.abs(s.y - p[1]) < 7)) || [rand(10, 90), rand(80, 94)];
  const s = {id, x: free[0] + rand(-2, 2), y: free[1] + rand(-2, 2), r: pick(TILTS), s: 1};
  settle(s); list.push(s);
  saveStickers(list, list.length - 1); renderCustom();
  Sound.pop(); Sound.sparkle(.05, 3);

// the sticker being changed is redrawn straight from these numbers until the gesture ends
function liveApply(){ const s = gest.now, st = stkStyle(s); gest.el.setAttribute('style', st); if(gest.art) gest.art.setAttribute('style', st); }
const ang = (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax) * 180 / Math.PI;
function centerOf(el){ const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }
$('#stkLayer').addEventListener('pointerdown', e => {

  e.preventDefault();

  if(e.target.closest('[data-x]')){ const list = stickersOf().slice(); list.splice(i, 1); selStk = -1; saveStickers(list); renderCustom(); Sound.undo(); return; }
  const rect = $('.shell').getBoundingClientRect();

    n.s = Math.max(STK_MIN, Math.min(STK_MAX, st.s * Math.hypot(p[0] - g.c[0], p[1] - g.c[1]) / g.d0));

    n.x = st.x + ((a[0] + b[0]) / 2 - g.m0[0]) / g.rect.width * 100; n.y = st.y + ((a[1] + b[1]) / 2 - g.m0[1]) / g.rect.height * 100;

window.addEventListener('pointercancel', endGesture);

$('#stkLayer').addEventListener('wheel', e => {
  if(!decorating) return;

$('.shell').addEventListener('pointerdown', e => { if(decorating && !e.target.closest('.decal') && selStk >= 0){ selStk = -1; markSel(); } });

/* ---------- automatic day / night from sunrise & sunset ----------
   No location is asked for: the longitude comes from the time zone's standard offset and the
   latitude is a mid-northern guess, which puts sunrise and sunset within the hour for most people. */
const AUTO_KEY = 'puchika-automode';
const PLACE = (function(){
  const y = new Date().getFullYear();
  const std = Math.max(new Date(y, 0, 1).getTimezoneOffset(), new Date(y, 6, 1).getTimezoneOffset());
  return {lat: 40, lng: Math.max(-180, Math.min(180, -std / 4))};
})();
function sunTimes(day, lat, lng){
  // SunCalc-style solar position: returns today's sunrise and sunset as Date objects
  const rad = Math.PI / 180, dayMs = 86400000, J1970 = 2440588, J2000 = 2451545, e = rad * 23.4397, J0 = 0.0009;
  const toDays = d => d.valueOf() / dayMs - 0.5 + J1970 - J2000;
  const fromJulian = j => new Date((j + 0.5 - J1970) * dayMs);
  const lw = rad * -lng, phi = rad * lat, d = toDays(day);
  const n = Math.round(d - J0 - lw / (2 * Math.PI));
  const ds = J0 + lw / (2 * Math.PI) + n;
  const M = rad * (357.5291 + 0.98560028 * ds);
  const C = rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
  const L = M + C + rad * 102.9372 + Math.PI;
  const dec = Math.asin(Math.sin(e) * Math.sin(L));
  const Jnoon = J2000 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  const w = Math.acos((Math.sin(rad * -0.833) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec)));
  const a = J0 + (w + lw) / (2 * Math.PI) + n;
  const Jset = J2000 + a + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  return {rise: fromJulian(Jnoon - (Jset - Jnoon)), set: fromJulian(Jset)};
}
const hm = d => I18N.date(d, {hour:'numeric', minute:'2-digit'});
function sunToday(){
  const now = new Date(); const t = sunTimes(new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12), PLACE.lat, PLACE.lng);
  return {night: now < t.rise || now >= t.set, rise: t.rise, set: t.set};
}

/* ---------- LCD pet ---------- */
/* ---------- pixel pet engine: a 64×36 colour screen and the Puchis drawn on it ---------- */
const LW = 64, LH = 36, G = 32;
// a pixel is 0 (off), 1 (the crayon's dark line), 2 (its middle tone), 3 (its pale fill) or 4 (a soft
// in-between tone for scenery far behind).
// Each pixel also remembers the crayon (PEN) it was drawn with.
const buf = new Uint8Array(LW*LH), cbuf = new Uint8Array(LW*LH);
let PEN = 0;
// NIGHT is Chika's dark body; MOON is a light ink for faces drawn on a dark body (white line, lavender middle, a dark "pale" that becomes the pupil)
const C = {INK:0, PET:1, LEAF:2, RED:3, GOLD:4, LILAC:5, BLUE:6, BROWN:7, ORANGE:8, MINT:9, GRAY:10, PINK:11, NIGHT:12, MOON:13};
const P = (x,y,v) => { x |= 0; y |= 0; if(x < 0 || y < 0 || x >= LW || y >= LH) return; const i = y*LW+x; buf[i] = v == null ? 1 : v; cbuf[i] = PEN; };
const GET = (x,y) => (x < 0 || y < 0 || x >= LW || y >= LH) ? -1 : buf[y*LW+x];
function clearLCD(){ buf.fill(0); cbuf.fill(0); PEN = 0; }
// pens: one crayon per row (the last one carries on), for sprites with a stem, a roof…
function spr(rows, x0, y0, dark, pens){
  const keep = PEN;
  for(let j = 0; j < rows.length; j++){ const r = rows[j];
    if(pens) PEN = pens[Math.min(j, pens.length - 1)];
    for(let i = 0; i < r.length; i++){ const ch = r[i];
      if(ch === 'X') P(x0+i, y0+j, dark == null ? 1 : dark); else if(ch === 'o') P(x0+i, y0+j, 2); else if(ch === '_') P(x0+i, y0+j, 0); } }
  PEN = keep;
}
const withPen = (c, fn) => { const keep = PEN; PEN = c; fn(); PEN = keep; };
function blob(cx, cy, rx, ry, fill){

// the backdrop behind the pixels: 'day', 'night' (sky over grass), 'sky', 'plain', or a background's
// colours {sky: [top, bottom], ground} (see scenes.js)
let SCENE = 'day';
function paintColor(ctx, W, Hh, s){
  const g = s >= 4 ? Math.max(1, Math.round(s * .14)) : 0; const q = s - g;
  const inv = col.inverted;
  ctx.globalAlpha = 1;
  if(inv){ ctx.fillStyle = '#26223f'; ctx.fillRect(0, 0, W, Hh); }
  else if(SCENE === 'plain'){ ctx.fillStyle = '#fff7ea'; ctx.fillRect(0, 0, W, Hh); }
  else {
    const o = typeof SCENE === 'object' ? SCENE : null, night = SCENE === 'night', gy = SCENE === 'sky' ? Hh : G * s;
    const sky = ctx.createLinearGradient(0, 0, 0, gy);
    sky.addColorStop(0, o ? o.sky[0] : night ? '#d4cdf2' : '#d6edff'); sky.addColorStop(1, o ? o.sky[1] : night ? '#f2edfb' : '#fff6e6');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, gy);
    if(gy < Hh){ ctx.fillStyle = o ? o.ground : night ? '#d9ead4' : '#e1f4d2'; ctx.fillRect(0, gy, W, Hh - gy); }
  }
  ctx.fillStyle = inv || (SCENE && SCENE.dark) ? 'rgba(255,255,255,.04)' : 'rgba(61,44,78,.05)';
  for(let i = 0; i < buf.length; i++) if(buf[i] === 0) ctx.fillRect((i % LW) * s, ((i / LW) | 0) * s, q, q);
  let fs = '', ga = 1;
  const darkPlace = !inv && SCENE && SCENE.dark;
  for(let i = 0; i < buf.length; i++){
    const v = buf[i]; if(v === 0) continue;
    const p = PAL[cbuf[i]] || PAL[0];
    const c = inv ? (p[4] || p[1]) : (darkPlace && v === 1 && p[5]) ? p[5] : p[v === 1 ? 0 : v === 2 ? 1 : v === 4 ? 3 : 2];
    const a = inv ? (v === 1 ? .92 : v === 2 ? .4 : .12) : 1;
    if(c !== fs){ ctx.fillStyle = c; fs = c; }
    if(a !== ga){ ctx.globalAlpha = a; ga = a; }
    ctx.fillRect((i % LW) * s, ((i / LW) | 0) * s, q, q);
  }
  ctx.globalAlpha = 1;
}

/* ---------- backgrounds: the place the Puchi lives in, drawn on the screen behind it ----------
   Each one has day and night colours for the sky and the ground (painted under the pixels), the
   crayons for the ground line, and a draw(F, night) that adds soft pixel scenery at the far back:
   it is drawn first, so the flowers, the pet and everything else sit in front of it.
   Names live in the language pack (bgs.list.<id>); each opens when the wins reach its xp. */
// scenery pixels: 4 (the soft far-away tone) unless asked otherwise
const soft = (x, y, v) => P(x, y, v == null || v === 3 ? 4 : v);
function hills(pen, base, amp, f1, f2, v){
  PEN = pen;
  for(let x = 0; x < LW; x++){
    const h = Math.max(1, Math.round(base + amp * Math.sin(x / f1) + Math.sin(x / f2)));
    for(let k = 0; k < h; k++) soft(x, G - 1 - k, k === h - 1 ? 2 : (v || 3));
  }
}
function pine(xc, h, snow){
  for(let j = 0; j < h; j++){
    const w = Math.floor(j / 2);
    for(let x = xc - w; x <= xc + w; x++){
      PEN = snow && j < 3 ? C.GRAY : C.LEAF;
      soft(x, G - 1 - h + j - 1, x === xc - w || x === xc + w ? 2 : 3);
    }
  }
  PEN = C.BROWN; soft(xc, G - 1, 2); soft(xc, G - 2, 2);
}
function cloud(x, y, pen){ PEN = pen || C.GRAY; spr(['.XXX..', 'XXXXXX', '.XXXX.'], x, y, 3); }   // clouds stay pale
const hash = (i, k) => { let v = Math.imul(i * 374761393 + k * 668265263, 1274126177); v ^= v >>> 13; return (v >>> 0) % 1000 / 1000; };
// a small picture from rows of letters: key maps a letter to [crayon, value] (value 2 = line, 3 = soft, 'glow' = pale and bright)
function art(rows, x0, y0, key){
  rows.forEach((r, j) => { for(let i = 0; i < r.length; i++){ const k = key[r[i]]; if(!k) continue; PEN = k[0]; if(k[1] === 'glow') P(x0 + i, y0 + j, 3); else soft(x0 + i, y0 + j, k[1]); } });
}

      for(let x = 0; x < LW; x += 2){ const h = 2 + Math.round(hash(x, 21) * 3), sw = Math.round(Math.sin(F / 14 + x / 5)); for(let k = 0; k < h; k++) soft(x + (k === h - 1 ? sw : 0), G - 1 - k, k === h - 1 ? 2 : 3); }

      for(let i = 0; i < 11; i++){
        const x = Math.round(hash(i, 22) * 60 + 2 + Math.sin((F + i * 40) / 23) * 5), y = Math.round(10 + hash(i, 23) * 18 + Math.sin((F + i * 25) / 17) * 3);

const bgById = id => BGS.find(b => b.id === id) || BGS[0];
// the colours under the pixels for the current place and time
function bgScene(id, night){ const b = bgById(id); return night ? b.night : b.day; }
function drawBg(id, F, night){ const b = bgById(id), keep = PEN; b.draw(F, night); PEN = keep; }

/* ---------- the pet's rules ----------
   Pure functions over a small state object. Time only moves forward through simulate(), in fixed
   5-minute steps from the stored time, so two devices holding the same state always agree.
   The pet never dies: needs bottom out, it gets sad or sick, and care brings it back. */
const PetCore = (function(){
  const MIN = 60000, HR = 60 * MIN, DAY = 24 * HR, STEP = 5 * MIN;
  const RATE = {hunger: 120 * MIN, happy: 150 * MIN, poop: 230 * MIN};
  const MESSY_SICK = 4 * HR, STARVE_SICK = 6 * HR, SICK_WORSE = 10 * HR, PET_GAP = 30 * MIN, SNACK_LIMIT = 5;
  const SLEEP_FROM = 23, SLEEP_TO = 7;
  // mini games: each keeps its own level (one up with every win at the current level) and best score
  const GAME_KEYS = ['catch', 'jump', 'balloon', 'rhythm', 'simon', 'adventure', 'bonk', 'stack'];
  const GAME_PACKS = {bonk: 'game-arcade', stack: 'game-arcade'};   // games that come in a store pack
  // names come from the language pack (items.<key>)
  const ITEMS = {
    cake: {cost:3, kind:'food'},
    bow: {cost:5, kind:'wear'},
    scarf: {cost:6, kind:'wear'},
    glasses: {cost:8, kind:'wear'},
    // the dress-up pack from the store: no stars, they're yours once the pack is (the page adds them to owned)
    crown: {cost:0, kind:'wear', paid:true, pack:'acc-dress'},
    flowers: {cost:0, kind:'wear', paid:true, pack:'acc-dress'},
    phones: {cost:0, kind:'wear', paid:true, pack:'acc-dress'},
    shades: {cost:0, kind:'wear', paid:true, pack:'acc-dress'}
  };
  const p2 = n => String(n).padStart(2, '0');
  const dayKey = t => { const d = new Date(t); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); };
  function asleep(t){ const h = new Date(t).getHours(); return h >= SLEEP_FROM || h < SLEEP_TO; }

  function fresh(now, born){
    return {v:1, born: born || now, t: now, hunger:3, happy:3, poop:0, sick:0, light:true, slept: asleep(now), litSleep:0,
      weight:5, discipline:0, spent:0, owned:[], wear:'', petAt:0, whimDone:-1, messy:0, starve:0, sickFor:0,
      acc:{h:0, j:0, p:0}, snackDay:'', snacks:0, games:{}, applied:[]};
  }
  const num = (v, d, lo, hi) => { v = Number(v); if(!isFinite(v)) v = d; return Math.max(lo, Math.min(hi, v)); };
  const int = (v, d, lo, hi) => Math.round(num(v, d, lo, hi));
  function norm(d, now){
    if(!d || typeof d !== 'object') return null;
    now = now || Date.now();
    const acc = d.acc && typeof d.acc === 'object' ? d.acc : {};
    const owned = Array.isArray(d.owned) ? d.owned.filter((k, i, a) => ITEMS[k] && ITEMS[k].kind === 'wear' && a.indexOf(k) === i) : [];
    return {
      v:1, born: num(d.born, now, 0, now + DAY), t: num(d.t, now, 0, now + DAY),
      hunger: int(d.hunger, 3, 0, 4), happy: int(d.happy, 3, 0, 4), poop: int(d.poop, 0, 0, 4), sick: int(d.sick, 0, 0, 2),
      light: d.light !== false, slept: !!d.slept, litSleep: num(d.litSleep, 0, 0, DAY),
      weight: int(d.weight, 5, 5, 99), discipline: int(d.discipline, 0, 0, 100), spent: int(d.spent, 0, 0, 1e7),
      owned, wear: owned.indexOf(d.wear) >= 0 ? d.wear : '',
      petAt: num(d.petAt, 0, 0, now + DAY), whimDone: num(d.whimDone, -1, -1, 1e9),
      messy: num(d.messy, 0, 0, 30 * DAY), starve: num(d.starve, 0, 0, 30 * DAY), sickFor: num(d.sickFor, 0, 0, 30 * DAY),
      acc: {h: num(acc.h, 0, 0, RATE.hunger), j: num(acc.j, 0, 0, RATE.happy), p: num(acc.p, 0, 0, RATE.poop)},
      snackDay: typeof d.snackDay === 'string' ? d.snackDay.slice(0, 10) : '', snacks: int(d.snacks, 0, 0, 99),
      games: normGames(d.games),
      applied: Array.isArray(d.applied) ? d.applied.filter(x => typeof x === 'string').slice(-80) : []
    };
  }
  function normGames(g){
    const out = {};
    if(g && typeof g === 'object') GAME_KEYS.forEach(k => { const v = g[k]; if(v && typeof v === 'object') out[k] = {lvl: int(v.lvl, 1, 1, 99), best: int(v.best, 0, 0, 99999)}; });
    return out;
  }
  const gameLevel = (s, k) => s && s.games && s.games[k] ? s.games[k].lvl : 1;
  const gameBest = (s, k) => s && s.games && s.games[k] ? s.games[k].best : 0;
  const clone = s => JSON.parse(JSON.stringify(s));

  function simulate(s, now){
    if(!s) return s;
    if(now - s.t > 7 * DAY) s.t = now - 7 * DAY;
    while(s.t + STEP <= now){
      const a = s.t;
      if(asleep(a)){
        // no hunger or boredom at night; a lamp left on spoils the sleep a little
        s.slept = true;
        if(s.light) s.litSleep += STEP;
      } else {
        if(s.slept){
          s.slept = false;
          if(s.litSleep >= HR) s.happy = Math.max(0, s.happy - 1);
          s.litSleep = 0; s.light = true;
        }
        const m = s.sick ? 1.4 : 1;
        s.acc.h += STEP * m; while(s.acc.h >= RATE.hunger){ s.acc.h -= RATE.hunger; s.hunger = Math.max(0, s.hunger - 1); }
        s.acc.j += STEP * m; while(s.acc.j >= RATE.happy){ s.acc.j -= RATE.happy; s.happy = Math.max(0, s.happy - 1); }
        s.acc.p += STEP; while(s.acc.p >= RATE.poop){ s.acc.p -= RATE.poop; s.poop = Math.min(4, s.poop + 1); }
        s.messy = s.poop ? s.messy + STEP : 0;
        s.starve = s.hunger === 0 ? s.starve + STEP : 0;
        if(!s.sick && (s.messy >= MESSY_SICK || s.starve >= STARVE_SICK)){ s.sick = 1; s.sickFor = 0; }
        if(s.sick){ s.sickFor += STEP; if(s.sick === 1 && s.sickFor >= SICK_WORSE) s.sick = 2; }
      }
      s.t = a + STEP;
    }
    return s;
  }

  // A whim: now and then the pet calls without needing anything and refuses food and games.
  // Telling it off at that moment raises discipline, and well-raised pets throw fewer whims.
  function hash(n){ let x = (n | 0) ^ 0x5bd1e995; x = Math.imul(x ^ (x >>> 15), 0x2c1b3c6d); x = Math.imul(x ^ (x >>> 12), 0x297a2d39); x ^= x >>> 15; return x >>> 0; }
  function whim(s, now){
    if(!s || s.sick || asleep(now)) return false;
    const h = Math.floor(now / HR);
    if(s.whimDone === h || now - h * HR > 25 * MIN) return false;
    const p = Math.max(25, 200 - Math.round(s.discipline * 1.75));
    return hash(h) % 1000 < p;
  }
  const stars = (s, earned) => Math.max(0, (earned | 0) - (s ? s.spent : 0));
  const age = (s, now) => s ? Math.max(0, Math.floor((now - s.born) / DAY)) : 0;

  function calls(s, now){
    const out = [];
    if(!s) return out;
    if(asleep(now)){ if(s.light) out.push('light'); return out; }
    if(s.sick) out.push('sick');
    if(s.hunger <= 1) out.push('hungry');
    if(s.poop) out.push('poop');
    if(s.happy <= 1) out.push('bored');
    if(whim(s, now)) out.push('whim');
    return out;
  }

  // a = {kind, at, id?, item?, win?}; returns {ok, code, anim, ...}. Actions with an id are applied once.
  function apply(s, a, now, earned){
    const r = (ok, code, anim, extra) => Object.assign({ok, code, anim: anim || null}, extra || {});
    if(!s || !a) return r(false, 'none');
    const at = Math.min(now, Number(a.at) || now);
    simulate(s, at);
    if(a.id){
      if(s.applied.indexOf(a.id) >= 0) return r(false, 'dup');
      s.applied.push(a.id); if(s.applied.length > 80) s.applied.splice(0, s.applied.length - 80);
    }
    const sl = asleep(at), wh = whim(s, at);
    switch(a.kind){
      case 'meal':
        if(sl) return r(false, 'sleep');
        if(wh) return r(false, 'whim', 'nope');
        if(s.hunger >= 4) return r(false, 'full', 'nope');
        s.hunger++; s.weight = Math.min(99, s.weight + 1); s.starve = 0;
        return r(true, 'meal', 'eat', {food:'meal'});
      case 'snack': {
        if(sl) return r(false, 'sleep');
        if(wh) return r(false, 'whim', 'nope');
        const d = dayKey(at); if(s.snackDay !== d){ s.snackDay = d; s.snacks = 0; }
        s.snacks++; s.happy = Math.min(4, s.happy + 1); s.weight = Math.min(99, s.weight + 2);
        if(s.snacks > SNACK_LIMIT && !s.sick){ s.sick = 1; s.sickFor = 0; return r(true, 'snacksick', 'eat', {food:'snack'}); }
        return r(true, 'snack', 'eat', {food:'snack'});
      }
      case 'game': {
        // the game was allowed when it started, so a whim that begins mid-game does not spoil it
        if(sl) return r(false, 'sleep');
        s.weight = Math.max(5, s.weight - 1);
        const k = GAME_KEYS.indexOf(a.game) >= 0 ? a.game : '';
        let levelUp = false, level = 0;
        if(k){
          const gs = s.games[k] || (s.games[k] = {lvl: 1, best: 0});
          gs.best = Math.max(gs.best, Math.max(0, Math.min(99999, a.score | 0)));
          if(a.win && (a.level | 0) >= gs.lvl && gs.lvl < 99){ gs.lvl++; levelUp = true; }
          level = gs.lvl;
        }
        if(a.win){ s.happy = Math.min(4, s.happy + 1); return r(true, 'gamewin', 'cheer', {levelUp, level, game: k}); }
        return r(true, 'gamelose', 'pet', {level, game: k});
      }
      case 'clean': {
        if(!s.poop) return r(false, 'clean0', 'nope');
        const n = s.poop; s.poop = 0; s.messy = 0;
        return r(true, 'clean', 'flush', {n});
      }
      case 'medicine':
        if(!s.sick) return r(false, 'notsick', 'nope');
        s.sick--;
        if(s.sick) return r(true, 'curemore', 'shot');
        s.messy = 0; s.starve = 0; s.sickFor = 0;
        return r(true, 'cure', 'shot');
      case 'light':
        if(!sl){ if(!s.light){ s.light = true; return r(true, 'lighton'); } return r(false, 'notsleepy', 'nope'); }
        s.light = !s.light;
        return r(true, s.light ? 'lighton' : 'lightoff');
      case 'scold':
        if(sl) return r(false, 'sleep');
        if(wh){ s.discipline = Math.min(100, s.discipline + 25); s.whimDone = Math.floor(at / HR); return r(true, 'scoldok', 'scold'); }
        s.happy = Math.max(0, s.happy - 1);
        return r(false, 'scoldbad', 'scold');
      case 'pet':
        if(sl) return r(false, 'sleep');
        if(at - s.petAt >= PET_GAP){ s.petAt = at; s.happy = Math.min(4, s.happy + 1); }
        return r(true, 'pet', 'pet');
      case 'buy': {
        const it = ITEMS[a.item]; if(!it) return r(false, 'none');
        if(it.kind === 'wear' && s.owned.indexOf(a.item) >= 0){
          s.wear = s.wear === a.item ? '' : a.item;
          return r(true, s.wear ? 'wearon' : 'wearoff', s.wear ? 'wear' : 'pet', {item:a.item});
        }
        if(it.paid) return r(false, 'none');   // pack outfits are never sold for stars
        if(it.kind === 'food' && sl) return r(false, 'sleep');
        const have = stars(s, earned);
        if(have < it.cost) return r(false, 'nostar', 'nope', {need: it.cost - have, item:a.item});
        s.spent += it.cost;
        if(it.kind === 'food'){
          s.hunger = Math.min(4, s.hunger + 2); s.happy = Math.min(4, s.happy + 2); s.weight = Math.min(99, s.weight + 3); s.starve = 0;
          return r(true, 'cake', 'eat', {food:'cake', item:a.item});
        }
        s.owned.push(a.item); s.wear = a.item;
        return r(true, 'bought', 'wear', {item:a.item});
      }
    }
    return r(false, 'none');
  }

  return {ITEMS, GAME_KEYS, GAME_PACKS, SLEEP: {from: SLEEP_FROM, to: SLEEP_TO}, asleep, fresh, norm, clone, simulate, whim, stars, age, calls, apply, dayKey, gameLevel, gameBest};
})();

  function pfGenerate(g){
    const L = g.L, W = Math.min(300, 110 + 14 * L);
    const map = []; for(let r = 0; r < ROWS; r++) map.push(new Array(W).fill('.'));
    const ground = c => { map[GR][c] = '#'; map[GR + 1][c] = '#'; };
    const hearts = [], foes = [];
    const heartAt = (c, r) => hearts.push({x: c * TILE, y: r * TILE, got: false});
    const snail = (c0, c1) => foes.push({type: 'snail', x: (c0 + 1) * TILE, y: GR * TILE - 4, vx: -(.25 + .03 * L), min: c0 * TILE, max: c1 * TILE - 6, alive: true, dead: 0});
    const bee = (c, r) => foes.push({type: 'bee', x: c * TILE, y: r * TILE, base: r * TILE, vx: -(.3 + .03 * L), alive: true, dead: 0, ph: Math.random() * 6});

    if(L >= 2) segs.push('bridge', 'pit');
    if(L >= 3) segs.push('bees');
    if(L >= 4) segs.push('spikes');

  function tileAt(g, px, py){

  function pfHurt(g, why){

  function pfStep(g){

    if(dir) g.face = dir;
    const max = .95;

    if(g.buffer > 0 && g.coyote > 0){ g.vy = -2.25; g.buffer = 0; g.coyote = 0; g.onGround = false; Sound.chirp(); }
    if(g.vy < 0 && !g.jumpHeld) g.vy = Math.max(g.vy, -1.1);   // a quick tap still clears a snail or a short gap

      ny = (top + 1) * TILE; g.vy = .3; Sound.tick();
    }
    g.hy = ny;
    if(g.onGround && g.t % 6 === 0 && solidAt(g, g.hx - 3, g.hy + Hh) && solidAt(g, g.hx + W + 2, g.hy + Hh)) g.safeX = g.hx;
    if(g.hy > ROWS * TILE + 4){ pfHurt(g, 'fall'); if(g.phase !== 'play') return; }
    if(g.inv > 0) g.inv--;
    if(g.onGround && Math.abs(g.vx) > .2) g.walk++;
    // spikes
    const feet = g.hy + Hh - 1;
    if(tileAt(g, g.hx + 1, feet) === '^' || tileAt(g, g.hx + W - 2, feet) === '^'){ pfHurt(g, 'spike'); if(g.phase !== 'play') return; }
    // hearts
    for(const h of g.hearts){
      if(!h.got && h.x + 3 > g.hx && h.x < g.hx + W && h.y + 3 > g.hy && h.y < g.hy + Hh){ h.got = true; g.score++; Sound.pop(); }
    }
    for(const p of g.pops) p.t--;
    g.pops = g.pops.filter(p => p.t > 0);
    // snails and bees
    for(const f of g.foes){
      if(!f.alive){ if(f.dead > 0) f.dead--; continue; }
      if(Math.abs(f.x - g.hx) > 90) continue;   // they wake up when you come near
      if(f.type === 'snail'){
        f.x += f.vx;
        const ahead = f.vx < 0 ? f.x - 1 : f.x + 6;
        if(f.x < f.min || f.x > f.max || !solidAt(g, ahead, GR * TILE + 1) || solidAt(g, ahead, f.y + 2)) f.vx = -f.vx;
      } else {
        f.x += f.vx; f.ph += .12; f.y = f.base + Math.sin(f.ph) * 3;
      }
      // a forgiving box: one pixel less on each side; a stomp counts if we were above it a moment ago
      const fw = f.type === 'snail' ? 6 : 5, fh = 4;
      if(f.x + 1 < g.hx + W && f.x + fw - 1 > g.hx && f.y + 1 < g.hy + Hh && f.y + fh > g.hy){
        const wasAbove = g.hy - g.vy + Hh - 1 <= f.y + 1.5;
        if(g.vy > 0 && wasAbove){
          f.alive = false; f.dead = 14; g.score += 2; g.vy = g.jumpHeld ? -2.1 : -1.5; Sound.squish();
        } else { pfHurt(g, 'foe'); if(g.phase !== 'play') return; }
      }
    }
    // camera, and home at the end
    g.cam = Math.max(0, Math.min(g.W * TILE - LW, g.hx - 24));
    if(g.hx + W >= g.houseX + 3) finish(g, true, g.score, txn('units.heart', g.score));
  }
  function pfDraw(g){
    const cam = Math.round(g.cam), c0 = Math.floor(cam / TILE), F = g.t;
    // far hills and clouds move slower
    PEN = C.LEAF;
    for(let x = 0; x < LW; x++){ const wx = x + cam * .4; const hgt = Math.round(3 + 2 * Math.sin(wx / 9) + Math.sin(wx / 4)); if(((x + F) & 3) === 0 || hgt > 4) P(x, GR * TILE - 1 - hgt, 2); }
    [[10, 7], [40, 9], [75, 6]].forEach(([cx, cy]) => { const x = Math.round(((cx - cam * .2) % 90 + 90) % 90) - 10; spr(['.XXX.', 'XXXXX'], x, cy, 3, [C.GRAY]); });
    for(let c = c0; c <= c0 + 17 && c < g.W; c++) for(let r = 0; r < ROWS; r++){
      const t = g.map[r][c]; if(t === '.') continue;
      const x = c * TILE - cam, y = r * TILE;
      if(t === '#'){
        const topOpen = r === 0 || g.map[r - 1][c] !== '#';
        for(let j = 0; j < 4; j++) for(let i = 0; i < 4; i++){
          const edge = (topOpen && j === 0) || (i === 0 && c > 0 && g.map[r][c - 1] !== '#') || (i === 3 && c < g.W - 1 && g.map[r][c + 1] !== '#');
          PEN = topOpen && j === 0 ? C.LEAF : C.BROWN;
          P(x + i, y + j, edge ? 1 : (((x + i + cam + y + j) % 3) ? 3 : 2));
        }
      }
      else if(t === 'b') spr(T_BRICK, x, y, null, [C.ORANGE]);
      else if(t === 'k') spr((F >> 3) & 1 ? T_GIFT_A : T_GIFT_B, x, y, null, [C.PINK]);
      else if(t === 'u') spr(T_USED, x, y, null, [C.GRAY]);
      else if(t === '^') spr(T_SPIKE, x, y, null, [C.GRAY]);
    }
    spr(HOUSE, g.houseX - cam, GR * TILE - HOUSE.length, null, [C.RED, C.RED, C.RED, C.RED, C.RED, C.BROWN]);
    PEN = C.RED;
    for(const h of g.hearts) if(!h.got) spr(HEART_S, h.x - cam, h.y + (((F >> 3) + h.x) & 1));
    for(const p of g.pops) spr(HEART_S, p.x - cam, p.y - (14 - p.t));
    for(const f of g.foes){
      const x = Math.round(f.x - cam); if(x < -8 || x > LW) continue;
      PEN = f.type === 'snail' ? C.ORANGE : C.GOLD;
      if(!f.alive){ if(f.dead > 0) spr(SQUISH, x, Math.round(f.y) + 2, null, [C.GRAY]); continue; }
      if(f.type === 'snail'){ const s = (F >> 3) & 1 ? SNAIL_A : SNAIL_B; spr(f.vx > 0 ? s.map(r => r.split('').reverse().join('')) : s, x, Math.round(f.y)); }
      else spr((F >> 1) & 1 ? BEE_A : BEE_B, x, Math.round(f.y));
    }
    if(!(g.inv > 0 && ((g.inv >> 1) & 1))){
      const sp = !g.onGround ? HERO_JUMP : (g.walk >> 2) & 1 ? HERO_STEP : HERO;
      spr(sp, Math.round(g.hx - cam), Math.round(g.hy) - 1, null, [C.LEAF, C.PET]);
    }
    if(g.phase === 'end' && g.win && ((F >> 2) & 1)) spr(HEART, g.houseX - cam + 2, GR * TILE - HOUSE.length - 7, null, [C.RED]);
    PEN = C.INK;
  }

  const GAME_DEFS = {
    /* 1. hearts fall, rain drops don't: walk under the right ones */
    catch: {
      input: 'hold',
      intro: g => tx('games.catch.intro', {goal: I18N.num(g.goal)}) + (g.L >= 2 ? tx('games.catch.gold') : '') + (g.L >= 4 ? tx('games.catch.wind') : ''),
      setup(g){ g.goal = Math.min(30, 9 + g.L); g.dur = 625; g.x = 32; g.next = 12; g.catchY = G - 12; },
      step(g){
        const half = Math.ceil(SHAPES[Pet.stage].rx);
        const dir = (ui.held.R ? 1 : 0) - (ui.held.L ? 1 : 0);
        g.x = Math.max(half + 1, Math.min(LW - half - 2, g.x + dir * Math.min(1.7, 1.2 + .05 * g.L)));
        if(--g.next <= 0){
          const r = Math.random(), rainP = g.t > 40 ? Math.min(.38, .14 + .025 * g.L) : 0;
          const kind = r < rainP ? (g.L >= 3 && Math.random() < .3 ? 'big' : 'rain') : (g.L >= 2 && Math.random() < .07 ? 'gold' : 'heart');
          const wind = g.L >= 4 ? (Math.random() - .5) * .22 * Math.min(2, g.L - 3) : 0;
          g.items.push({kind, x: rand(2, LW - 6), y: -4, v: Math.min(1.1, .3 + .035 * g.L + Math.min(.4, g.t / 1500) + Math.random() * .12), vx: wind});
          g.next = Math.max(8, 28 - g.L - Math.floor(g.t / 45)) + rand(0, 8);
        }
        const cx = Math.round(g.x);
        for(const it of g.items){
          it.y += it.v; it.x += it.vx; if(it.x < 1 || it.x > LW - 6) it.vx = -it.vx;
          if(!it.done && it.y + 3 >= g.catchY && it.y <= G - 3 && Math.abs(it.x + 1 - cx) <= half){
            it.done = true;
            if(it.kind === 'rain' || it.kind === 'big'){ g.score = Math.max(0, g.score - (it.kind === 'big' ? 2 : 1)); g.hurt = 10; Sound.nope(); }
            else { g.score += it.kind === 'gold' ? 3 : 1; Pet.spawn('hs', Math.round(it.x), Math.round(g.catchY) - 4); it.kind === 'gold' ? Sound.coin() : Sound.pop(); if(g.score >= g.goal && !g.reached){ g.reached = true; Sound.sparkle(0, 6); } }
          }
          if(it.y > G) it.done = true;
        }
        g.items = g.items.filter(it => !it.done);
        if(g.t >= g.dur) finish(g, g.score >= g.goal, g.score, txn('units.heart', g.score));
      },
      draw(g){
        groundLine(0);
        for(const it of g.items) spr(it.kind === 'rain' ? RAIN : it.kind === 'big' ? RAIN_BIG : it.kind === 'gold' ? GOLD : HEART_S, Math.round(it.x), Math.round(it.y), null, [it.kind === 'rain' || it.kind === 'big' ? C.BLUE : it.kind === 'gold' ? C.GOLD : C.RED]);
        const st = petSt(); st.xoff = Math.round(g.x) - 32;
        const dir = (ui.held.R ? 1 : 0) - (ui.held.L ? 1 : 0);
        if(dir && g.phase === 'play'){ st.look = dir; st.step = ((g.t >> 2) & 1) ? 1 : 2; }
        return st;
      },
      hud: g => [pixSvg(TAMA_PX.heart) + ' ' + g.score + '/' + g.goal, timeBar(1 - g.t / g.dur)],
      tap(g, code){ const half = Math.ceil(SHAPES[Pet.stage].rx); g.x = Math.max(half + 1, Math.min(LW - half - 2, g.x + (code === 'L' ? -4 : 4))); }
    },

    /* 2. run and jump: a tap is a little hop, holding makes a big jump. Small rocks want a hop, cacti a big
       jump, and a rock right before a cactus wants both, in that order (a big jump over the rock comes
       down too late to clear the cactus). */
    jump: {
      input: 'act',
      // A quick tap (up to `wait` steps) is always the same small hop. Holding longer keeps the climb going
      // for up to `boost` more steps without slowing down: the big jump.
      phys: {v0: 1.12, g: .097, wait: 3, boost: 7},
      intro: g => tx('games.jump.intro', {goal: txn('units.obstacle', g.goal), lives: txn('units.life', g.lives)}) + (g.L >= 2 ? tx('games.jump.combo') : '') + (g.L >= 4 ? tx('games.jump.balls') : ''),
      setup(g){ g.goal = Math.min(30, 10 + g.L); g.lives = g.maxLives = g.L >= 7 ? 2 : 3; g.next = 26; g.lift = 0; g.vy = 0; g.ground = 0; g.held = false; g.buffer = 0; g.hold = 0; },
      up(g){ g.vy = this.phys.v0; g.lift = .01; g.buffer = 0; g.hold = 0; Sound.chirp(); },
      // one step in the air; returns true on landing
      air(g){
        const ph = this.phys;
        if(g.held) g.hold++;
        const boost = g.held && g.hold > ph.wait && g.hold <= ph.wait + ph.boost && g.vy > 0;
        g.lift += g.vy; if(!boost) g.vy -= ph.g;
        if(g.lift <= 0){ g.lift = 0; g.vy = 0; return true; }
        return false;
      },
      press(g){ g.held = true; if(g.lift > 0) g.buffer = 5; else this.up(g); },
      release(g){ g.held = false; },
      // what comes next: a list of [obstacle, steps after the one before it]. A hop is ~23 steps in the air,
      // a big jump ~34, so 30 steps between a rock and a cactus leaves room only for hop-then-jump.
      pattern(g){
        const L = g.L, r = Math.random();
        if(L >= 4 && r < .14) return [[{rows: BALL, fast: .45}, 0]];
        if(L >= 2 && r < .14 + Math.min(.24, .08 + .03 * L)) return [[{rows: pick([ROCKS[0], ROCKS[1]])}, 0], [{rows: CACTUS}, Math.max(27, 31 - (L >> 1))]];
        if(r < .5) return [[{rows: CACTUS}, 0]];
        if(L >= 3 && r < .62) return [[{rows: ROCKS[2]}, 0]];
        if(L >= 3 && r < .74) return [[{rows: ROCKS[0]}, 0], [{rows: ROCKS[0]}, Math.max(27, 31 - (L >> 1))]];
        return [[{rows: pick([ROCKS[0], ROCKS[1]])}, 0]];
      },
      step(g){
        if(g.buffer > 0) g.buffer--;
        if(g.lift > 0 && this.air(g) && g.buffer > 0) this.up(g);   // a press just before landing jumps again right away
        g.speed = Math.min(1.7, .95 + .04 * g.L + .02 * g.score);
        g.ground = (g.ground + g.speed) % 4;
        if(--g.next <= 0){
          // gaps are counted in steps, so a faster run doesn't leave less time to land
          let x = LW + 1, steps = 0;
          for(const [it, gap] of this.pattern(g)){ x += gap * g.speed; steps += gap; it.x = x; g.items.push(it); }
          g.next = steps + Math.max(36, 44 - g.L) + rand(0, Math.max(10, 28 - 2 * g.L));
        }
        const cx = 14, half = 2.5;
        for(const it of g.items){
          it.x -= g.speed + (it.fast || 0);
          const w = it.rows[0].length, h = it.rows.length;
          if(!it.hit && !it.passed && g.hurt <= 0 && it.x < cx + half && it.x + w > cx - half && g.lift < h){
            it.hit = true; g.lives--; g.hurt = 14; Sound.nope();
            if(g.lives <= 0){ finish(g, false, g.score, txn('units.obstacle', g.score)); return; }
          }
          if(!it.passed && it.x + w < cx - half){
            it.passed = true; if(it.hit) continue;
            g.score++; Sound.tick();
            if(g.score >= g.goal){ finish(g, true, g.score, txn('units.obstacle', g.score)); return; }
          }
        }
        g.items = g.items.filter(it => it.x > -8);
      },
      draw(g){
        groundLine(Math.floor(g.ground));
        for(const it of g.items) if(!it.hit) spr(it.rows, Math.round(it.x), G - it.rows.length, null, [it.rows === ROCKS[2] ? C.LEAF : it.rows === ROCKS[1] ? C.BROWN : C.GRAY]);
        const st = petSt(); st.xoff = 14 - 32; st.look = 1; st.lift = Math.round(g.lift);
        if(g.phase === 'play'){ st.step = g.lift ? 0 : (((g.t >> 2) & 1) ? 1 : 2); st.arms = g.lift ? 'up' : 'down'; }
        return st;
      },
      hud: g => [esc(tx('games.jump.hud', {score: I18N.num(g.score), goal: I18N.num(g.goal)})), hp({now: g.lives, max: g.maxLives})]
    },

    /* 3. float through the gaps with a balloon */
    balloon: {
      input: 'act',
      intro: g => tx('games.balloon.intro', {goal: txn('units.gate', g.goal), lives: txn('units.life', g.lives)}),
      setup(g){ g.goal = Math.min(30, 8 + g.L); g.lives = g.maxLives = 3; g.y = 12; g.vy = 0; g.next = 30; g.lastGap = 18; g.ground = 0; },
      press(g){ g.vy = -.7; Sound.pop(); },
      step(g){
        g.vy = Math.min(1.5, g.vy + .055); g.y += g.vy;
        const top = 6, bottom = G - 10;
        if(g.y < top){ g.y = top; g.vy = .2; }
        if(g.y > bottom){ g.y = bottom; g.vy = -.9; if(g.hurt <= 0) hurtBalloon(g); if(g.phase !== 'play') return; }
        g.speed = Math.min(1.3, .65 + .03 * g.L + .012 * g.score);
        g.ground = (g.ground + g.speed) % 4;
        const gap = Math.max(12, 21 - .6 * g.L);
        if(--g.next <= 0){
          const lo = 9 + gap / 2, hi = Math.max(lo, G - 3 - gap / 2), drift = 5 + .5 * g.L;
          const c = Math.max(lo, Math.min(hi, g.lastGap + (Math.random() * 2 - 1) * drift));
          g.lastGap = c;
          g.items.push({x: LW + 1, c, gap});
          g.next = Math.round(Math.max(26, 38 - g.L) / g.speed);
        }
        for(const it of g.items){
          it.x -= g.speed;
          const inX = it.x < 16 && it.x + 4 > 10;
          const fy0 = g.y + 1, fy1 = g.y + 8;
          if(inX && !it.hit && g.hurt <= 0 && (fy0 < it.c - it.gap / 2 || fy1 > it.c + it.gap / 2)){ it.hit = true; hurtBalloon(g); if(g.phase !== 'play') return; }
          if(!it.passed && it.x + 4 < 10){ it.passed = true; if(!it.hit){ g.score++; Sound.tick(); if(g.score >= g.goal){ finish(g, true, g.score, txn('units.gate', g.score)); return; } } }
        }
        g.items = g.items.filter(it => it.x > -6);
      },
      draw(g){
        groundLine(Math.floor(g.ground));
        for(const it of g.items){
          const x = Math.round(it.x), y0 = Math.round(it.c - it.gap / 2), y1 = Math.round(it.c + it.gap / 2);
          for(let y = 0; y < G; y++){
            if(y >= y0 && y <= y1) continue;
            const edge = y === y0 - 1 || y === y1 + 1;
            PEN = C.LEAF;
            for(let i = 0; i < 4; i++) P(x + i, y, edge || i === 0 || i === 3 ? 1 : (((x + i + y) & 1) ? 2 : 3));
          }
        }
        const show = !(g.hurt > 0 && ((g.hurt >> 1) & 1));
        if(show){
          const y = Math.round(g.y);
          spr(BALLOON, 11, y, null, [C.RED, C.RED, C.RED, C.RED, C.GRAY]);
          spr(((g.t % 60) < 3) ? MINI_BLINK : MINI, 11, y + 6, null, [C.PET]);
        }
        return null;
      },
      hud: g => [esc(tx('games.balloon.hud', {score: I18N.num(g.score), goal: I18N.num(g.goal)})), hp({now: g.lives, max: g.maxLives})]
    },

    /* 4. notes fly to the line: hit them on time and you play the tune yourself */
    rhythm: {
      input: 'lanes',
      intro: g => tx('games.rhythm.intro', {need: I18N.num(g.need), total: I18N.num(g.notes.length)}),
      // lane 1 is the top line (high notes), lane 0 the bottom one
      setup(g){
        const L = g.L, n = Math.min(48, 16 + 3 * L), beat = Math.max(6, Math.round(13 - .7 * L));
        g.v = Math.min(1.5, .75 + .06 * L);
        const travel = (42 - 9) / g.v;
        g.notes = [];
        let t = Math.round(travel) + 10, deg = 3;
        while(g.notes.length < n){
          deg = Math.max(0, Math.min(7, deg + pick([-2, -1, -1, 1, 1, 2])));
          const lane = deg >= 4 ? 1 : 0;
          g.notes.push({hit: t, lane, f: PENTA[deg]});
          if(L >= 4 && Math.random() < .1 && g.notes.length < n) g.notes.push({hit: t, lane: 1 - lane, f: PENTA[lane ? Math.max(0, deg - 4) : Math.min(7, deg + 4)]});
          const r = Math.random();
          t += r < (L >= 2 ? .3 : 0) ? Math.round(beat / 2) : r > .85 ? beat * 2 : beat;
        }
        g.notes.forEach(nt => { nt.spawn = nt.hit - travel; });
        g.need = Math.ceil(g.notes.length * Math.min(.9, .65 + .025 * L));
        g.combo = 0; g.flash = [0, 0]; g.endAt = g.notes[g.notes.length - 1].hit + 30;
      },
      press(g, code){
        const lane = (code === 'U' || code === 'R') ? 1 : 0;
        g.flash[lane] = 4;
        let best = null, bd = 99;
        for(const nt of g.notes){ if(nt.lane !== lane || nt.done || g.t < nt.spawn) continue; const x = 42 - (g.t - nt.spawn) * g.v, d = Math.abs(x - 9); if(d < bd){ bd = d; best = nt; } }
        if(best && bd <= 4){
          best.done = true; best.ok = true; g.score++; g.combo++;
          Sound.bell(best.f, 0, .16);
          Pet.spawn('spark', 9, lane ? 10 : 22);
          if(g.combo % 8 === 0) Sound.sparkle(0, 3);
        } else { g.combo = 0; Sound.tick(); }
      },
      step(g){
        for(const nt of g.notes){
          if(nt.done || g.t < nt.spawn) continue;
          const x = 42 - (g.t - nt.spawn) * g.v;
          if(x < 9 - 4.5){ nt.done = true; g.combo = 0; }
        }
        if(g.flash[0]) g.flash[0]--; if(g.flash[1]) g.flash[1]--;
        if(g.t >= g.endAt) finish(g, g.score >= g.need, g.score, tx('units.notes', {n: I18N.num(g.score), total: I18N.num(g.notes.length)}));
      },
      draw(g){
        groundLine(0);
        [[1, 11], [0, 23]].forEach(([lane, y]) => {
          PEN = lane ? C.PINK : C.BLUE;
          for(let x = 3; x < 42; x += 3) P(x, y + 2, 2);
          const f = g.flash[lane] > 0;
          for(let yy = y - 1; yy <= y + 4; yy++){ PEN = C.INK; P(6, yy); P(12, yy); if(f){ PEN = C.GOLD; for(let x = 7; x <= 11; x++) P(x, yy, 2); } }
        });
        PEN = C.INK;
        for(const nt of g.notes){
          if(nt.done || g.t < nt.spawn) continue;
          const x = Math.round(42 - (g.t - nt.spawn) * g.v);
          spr(NOTE_DOT, x - 1, nt.lane ? 10 : 22, null, [nt.lane ? C.PINK : C.BLUE]);
        }
        const st = petSt(); st.xoff = 20;
        if(g.phase === 'play'){
          const bounce = g.combo >= 3;
          st.lift = reduced ? 0 : ((g.t >> 2) & 1) * (bounce ? 2 : 1);
          st.mouth = bounce ? (((g.t >> 2) & 1) ? 'open' : 'smile') : 'smile';
          st.arms = bounce ? (((g.t >> 3) & 1) ? 'wave' : 'up') : 'down';
          st.look = -1;
        }
        return st;
      },
      hud: g => ['♪ ' + I18N.num(g.score) + '/' + I18N.num(g.need), g.combo >= 2 ? '×' + I18N.num(g.combo) : '']
    },

    /* 5. the pet sings a little tune; play it back on the three pads */
    simon: {
      input: 'pads',
      intro: g => tx('games.simon.intro', {goal: txn('units.round', g.goal)}),
      setup(g){ g.goal = Math.min(12, 3 + g.L); g.lives = g.maxLives = 2; g.seq = []; for(let i = 0; i < 3; i++) g.seq.push(rand(0, 2)); g.round = 0; beginShow(g); },
      press(g, code){
        if(g.sub !== 'input') return;
        const pad = code === 'L' ? 0 : code === 'R' ? 2 : 1;
        g.lit = pad; g.litT = 6; g.idleT = 0;
        Sound.bell(PAD_NOTES[pad], 0, .17);
        if(pad === g.seq[g.pos]){
          g.pos++;
          if(g.pos >= g.seq.length){
            g.round++; g.score = g.round; Sound.sparkle(.15, 4);
            if(g.round >= g.goal){ finish(g, true, g.round, txn('units.round', g.round)); return; }
            g.seq.push(rand(0, 2)); g.sub = 'pause'; g.wait = 22;
          }
        } else {
          g.lives--; Sound.nope(); g.hurt = 12;
          if(g.lives <= 0){ finish(g, false, g.round, txn('units.round', g.round)); return; }
          g.sub = 'pause'; g.wait = 26;
        }
      },
      step(g){
        if(g.litT > 0 && --g.litT === 0) g.lit = -1;
        if(g.sub === 'pause'){ if(--g.wait <= 0) beginShow(g); return; }
        if(g.sub === 'show'){
          const on = Math.max(5, 11 - g.L), off = Math.max(3, 6 - (g.L >> 1)), per = on + off;
          const i = Math.floor(g.st / per), k = g.st % per;
          if(i >= g.seq.length){ g.sub = 'input'; g.pos = 0; g.idleT = 0; g.lit = -1; return; }
          if(k === 0){ g.lit = g.seq[i]; g.litT = on; Sound.bell(PAD_NOTES[g.seq[i]], 0, .16); }
          g.st++;
          return;
        }
        if(g.sub === 'input' && ++g.idleT > 150){
          g.lives--; Sound.nope(); g.hurt = 12;
          if(g.lives <= 0){ finish(g, false, g.round, txn('units.round', g.round)); return; }
          g.sub = 'pause'; g.wait = 20;
        }
      },
      draw(g){
        groundLine(0);
        for(let p = 0; p < 3; p++){
          const x0 = PAD_X[p], on = g.lit === p;
          PEN = [C.RED, C.GOLD, C.BLUE][p];
          for(let y = 18; y <= 29; y++) for(let x = x0; x < x0 + 14; x++){
            const edge = y === 18 || y === 29 || x === x0 || x === x0 + 13;
            if(edge) P(x, y); else if(on) P(x, y, ((x + y) & 1) ? 1 : 2); else P(x, y, 3);
          }
          const ic = PAD_ICONS[p]; spr(ic, x0 + 7 - Math.ceil(ic[0].length / 2), 22 + (ic.length < 4 ? 1 : 0), on ? 3 : 1);
          PEN = C.INK;
        }
        const singing = g.sub === 'show' && g.lit >= 0;
        spr(singing ? FACE_SING : (g.t % 50) < 3 ? FACE_BLINK : FACE, 30, 7, null, [C.PET]);
        if(singing) spr(NOTE_A, 37, 7, null, [C.LILAC]);
        if(g.sub === 'input' && ((g.t >> 3) & 1)) P(32, 14);
        return null;
      },
      hud: g => [esc(tx('games.simon.hud', {round: I18N.num(g.round), goal: I18N.num(g.goal)}) + (g.sub === 'input' ? tx('games.simon.you') : g.sub === 'show' ? tx('games.simon.listen') : '')), hp({now: g.lives, max: g.maxLives})]
    },
    /* 6. a little side-scrolling platformer: run, jump, bump gift boxes, hop on snails, reach the house */
    adventure: {
      input: 'platform',
      intro: g => tx('games.adventure.intro'),
      setup(g){
        pfGenerate(g);
        g.lives = g.maxLives = 3;
        g.hx = 8; g.hy = 28 - 5; g.vx = 0; g.vy = 0; g.onGround = true; g.coyote = 0; g.buffer = 0; g.jumpHeld = false;
        g.cam = 0; g.face = 1; g.safeX = 8; g.inv = 0; g.walk = 0; g.pops = [];
      },
      press(g, code){
        if(code === 'L' || code === 'R' || code === 'D') return;
        g.buffer = 6; g.jumpHeld = true;
      },
      release(g, code){ if(code !== 'L' && code !== 'R') g.jumpHeld = false; },
      step(g){ pfStep(g); },
      draw(g){ pfDraw(g); return null; },
      hud: g => [pixSvg(TAMA_PX.heart) + ' ' + I18N.num(g.score), hp({now: g.lives, max: g.maxLives})]
    },

    /* 7. (arcade pack) critters pop out of three holes: bonk them before they hide. From level 3 a bomb
       turns up now and then, and bonking it costs two. */
    bonk: {
      input: 'pads',
      intro: g => tx('games.bonk.intro', {goal: I18N.num(g.goal)}) + (g.L >= 2 ? tx('games.bonk.gold') : '') + (g.L >= 3 ? tx('games.bonk.bombs') : ''),
      setup(g){ g.goal = Math.min(30, 9 + g.L); g.dur = 750; g.holes = [null, null, null]; g.next = 8; g.mallet = -1; g.malletT = 0; },
      // how far a critter is out of its hole (0…6): up, a wait, back down
      out(h){ const a = h.age; return a < 6 ? a + 1 : a < 6 + h.stay ? 6 : Math.max(0, 12 + h.stay - a); },
      press(g, code){
        const i = code === 'L' ? 0 : code === 'R' ? 2 : 1, h = g.holes[i];
        g.mallet = i; g.malletT = 5;
        if(!h || h.hit || this.out(h) < 2){ Sound.tick(); return; }
        h.hit = true; h.age = Math.max(h.age, 6 + h.stay);   // knocked back down
        if(h.bomb){ g.score = Math.max(0, g.score - 2); g.hurt = 12; Sound.nope(); return; }
        g.score += h.gold ? 2 : 1; h.gold ? Sound.coin() : Sound.pop();
        Pet.spawn('spark', HOLE_X[i] - 1, HOLE_Y - 9);
        if(g.score >= g.goal) finish(g, true, g.score, txn('units.bonk', g.score));
      },
      step(g){
        if(g.malletT > 0 && --g.malletT === 0) g.mallet = -1;
        g.holes = g.holes.map(h => { if(!h) return null; h.age++; return h.age > 12 + h.stay ? null : h; });
        if(--g.next <= 0){
          const free = [0, 1, 2].filter(i => !g.holes[i]);
          if(free.length){
            const r = Math.random(), bomb = g.L >= 3 && r < Math.min(.3, .1 + .03 * g.L), gold = !bomb && g.L >= 2 && Math.random() < .12;
            g.holes[pick(free)] = {age: 0, stay: Math.max(7, 24 - 2 * g.L - Math.floor(g.t / 160)) + rand(0, 5), bomb, gold, hit: false};
          }
          g.next = Math.max(5, 20 - g.L - Math.floor(g.t / 110)) + rand(0, 7);
        }
        if(g.t >= g.dur) finish(g, g.score >= g.goal, g.score, txn('units.bonk', g.score));
      },
      draw(g){
        groundLine(0);
        spr((g.t % 60) < 3 ? FACE_BLINK : FACE, 30, 9, null, [C.PET]);
        g.holes.forEach((h, i) => {
          const cx = HOLE_X[i];
          PEN = C.BROWN; for(let x = cx - 5; x <= cx + 5; x++) P(x, HOLE_Y - 1, 2);
          PEN = C.INK; for(let x = cx - 5; x <= cx + 5; x++) P(x, HOLE_Y, 1);
          if(h){
            const n = this.out(h);
            if(n > 0){
              const rows = (h.bomb ? BOMB : h.hit ? CRITTER_HIT : CRITTER).slice(0, n), pen = h.gold ? C.GOLD : C.BROWN;
              pix(rows, cx - 3, HOLE_Y - n + 1, h.bomb
                ? {k: [C.INK, 1], w: [C.INK, 3], g: [C.GRAY, 1], s: [((g.t >> 1) & 1) ? C.RED : C.GOLD, 1]}
                : {b: [pen, 1], f: [pen, 3], e: [C.INK, 1], '-': [C.INK, 2], n: [C.PINK, 1], c: [C.PINK, 2]});
              if(h.hit && !h.bomb){ PEN = C.GOLD; const k = (g.t >> 1) & 1; P(cx - 3 + k * 6, HOLE_Y - n - 1, 1); P(cx + 3 - k * 6, HOLE_Y - n - 2, 2); }
            }
          }
          PEN = C.BROWN;
          for(let x = cx - 6; x <= cx + 6; x++){ P(x, HOLE_Y + 1, Math.abs(x - cx) === 6 ? 2 : 1); if(Math.abs(x - cx) < 6) P(x, HOLE_Y + 2, 3); }
          if(g.mallet === i) pix(MALLET, cx - 2, HOLE_Y - 11 + (5 - g.malletT), {r: [C.RED, 1], R: [C.RED, 2], h: [C.BROWN, 1]});
        });
        PEN = C.INK;
        return null;
      },
      hud: g => [esc(tx('games.bonk.hud', {score: I18N.num(g.score), goal: I18N.num(g.goal)})), timeBar(1 - g.t / g.dur)]
    },

    /* 8. (arcade pack) a block slides above the tower: tap to drop it. Whatever hangs over the edge is cut
       off, so the blocks get narrower; three perfect drops in a row make it wider again. */
    stack: {
      input: 'act', BH: 3,
      intro: g => tx('games.stack.intro', {goal: txn('units.block', g.goal)}),
      setup(g){ g.goal = Math.min(26, 9 + g.L); g.tower = [{x: 24, w: 16}]; g.cam = 0; g.chips = []; g.combo = 0; this.spawn(g); },
      spawn(g){ const top = g.tower[g.tower.length - 1], left = g.tower.length % 2 === 0; g.blk = {x: left ? 0 : LW - top.w, w: top.w, dir: left ? 1 : -1}; },
      rowY(i){ return G - this.BH * (i + 1); },
      press(g){
        const b = g.blk, top = g.tower[g.tower.length - 1]; if(!b) return;
        let x = Math.round(b.x), w = b.w;
        const n = g.tower.length, y = this.rowY(n);
        if(Math.abs(x - top.x) <= 1){
          x = top.x; g.combo++;
          if(g.combo >= 3 && w < 16){ w = Math.min(16, w + 2); x = Math.max(0, Math.min(LW - w, x - 1)); g.combo = 0; Sound.sparkle(0, 6); }
          else Sound.sparkle(0, 2 + Math.min(3, g.combo));
        } else {
          g.combo = 0;
          const l = Math.max(x, top.x), r = Math.min(x + w, top.x + top.w);
          if(r - l <= 0){ g.chips.push({x, y, w, vy: 0, pen: STACK_PENS[n % STACK_PENS.length]}); g.blk = null; finish(g, false, g.score, txn('units.block', g.score)); return; }
          if(x < top.x) g.chips.push({x, y, w: top.x - x, vy: 0, pen: STACK_PENS[n % STACK_PENS.length]});
          else g.chips.push({x: top.x + top.w, y, w: x + w - top.x - top.w, vy: 0, pen: STACK_PENS[n % STACK_PENS.length]});
          x = l; w = r - l; Sound.pop();
        }
        g.tower.push({x, w}); g.score = g.tower.length - 1;
        if(g.score >= g.goal){ g.blk = null; finish(g, true, g.score, txn('units.block', g.score)); return; }
        this.spawn(g);
      },
      step(g){
        const b = g.blk;
        if(b){
          const sp = Math.min(1.9, .62 + .07 * g.L + .035 * g.score);
          b.x += b.dir * sp;
          if(b.x <= 0){ b.x = 0; b.dir = 1; } else if(b.x >= LW - b.w){ b.x = LW - b.w; b.dir = -1; }
        }
        // the camera climbs so the sliding block stays below the score line
        const want = Math.max(0, 9 - this.rowY(g.tower.length));
        if(g.cam < want) g.cam = Math.min(want, g.cam + .6);
        for(const c of g.chips){ c.vy += .18; c.y += c.vy; }
        g.chips = g.chips.filter(c => c.y + g.cam < LH + 2);
      },
      block(x, y, w, pen){
        PEN = pen;
        for(let i = 0; i < w; i++){ P(x + i, y, 1); P(x + i, y + 2, 1); P(x + i, y + 1, i === 0 || i === w - 1 ? 1 : 3); }
      },
      draw(g){
        const cam = Math.round(g.cam);
        if(cam < LH - G) { PEN = C.LEAF; for(let x = 0; x < LW; x++) P(x, G + cam); }
        g.tower.forEach((t, i) => { const y = this.rowY(i) + cam; if(y < LH && y > -4) this.block(t.x, y, t.w, STACK_PENS[i % STACK_PENS.length]); });
        const top = g.tower[g.tower.length - 1], ty = this.rowY(g.tower.length - 1) + cam;
        if(g.blk) this.block(Math.round(g.blk.x), this.rowY(g.tower.length) + cam, g.blk.w, STACK_PENS[g.tower.length % STACK_PENS.length]);
        else if(g.phase === 'end' && g.win) spr(((g.t >> 2) & 1) ? MINI : MINI_BLINK, top.x + (top.w >> 1) - 2, ty - 4 - ((g.t >> 2) & 1), null, [C.PET]);
        for(const c of g.chips) this.block(c.x, Math.round(c.y) + cam, c.w, c.pen);
        PEN = C.INK;
        return null;
      },
      hud: g => [esc(tx('games.stack.hud', {score: I18N.num(g.score), goal: I18N.num(g.goal)})), g.combo >= 1 ? esc(tx('games.stack.perfect')) + (g.combo >= 2 ? ' ×' + I18N.num(g.combo) : '') : '']
    }
  };
  // the games you can play: the free ones, plus any from packs you own
  let GAMES = [];
  const listGames = () => { GAMES = PetCore.GAME_KEYS.filter(k => GAME_DEFS[k] && (!PetCore.GAME_PACKS[k] || (H.has && H.has('game', k)))).map(k => ({k})); return GAMES; };
  const gameName = k => tx('games.' + k + '.name');
  const gameShort = k => I18N.has('games.' + k + '.short') ? tx('games.' + k + '.short') : gameName(k);
  function beginShow(g){ g.sub = 'show'; g.st = 0; g.lit = -1; g.litT = 0; }
  function hurtBalloon(g){
    g.lives--; g.hurt = 20; Sound.nope();
    if(g.lives <= 0) finish(g, false, g.score, txn('units.gate', g.score));
  }

  function stopLoop(){ if(loop){ clearInterval(loop); loop = null; } }
  function startGame(kind){
    const def = GAME_DEFS[kind]; if(!def || (PetCore.GAME_PACKS[kind] && !(H.has && H.has('game', kind)))) return;
    const s = H.state(), now = Date.now();
    if(PetCore.asleep(now)){ close(); show({ok:false, code:'sleep'}); return; }
    if(s && PetCore.whim(s, now)){ close(); show({ok:false, code:'whim', anim:'nope'}); return; }
    Pet.anim = null; Pet.parts = [];
    ui.held.L = ui.held.R = false;
    ui.mode = 'game';
    const g = ui.game = {kind, L: PetCore.gameLevel(s, kind), phase:'ready', t:0, score:0, lives:0, maxLives:0, hurt:0, items:[], win:false, scoreText:'', hud:['', '']};
    def.setup(g);
    H.say(tx('tama.level', {level: I18N.num(g.L)}) + def.intro(g));
    renderOv();
    stopLoop(); loop = setInterval(gameStep, GAME_STEP);
    drawGameFrame(g);
  }
  function finish(g, win, score, scoreText){
    if(g.phase !== 'play') return;
    g.phase = 'end'; g.t = 0; g.win = win; g.scoreText = scoreText;
    ui.held.L = ui.held.R = false;
    const r = doAct('game', {win, game: g.kind, level: g.L, score}, {score: scoreText});
    g.levelUp = !!(r && r.levelUp);
    if(g.levelUp) setTimeout(() => Sound.fanfare(), 700);
    if(ui.mode === 'game') renderOv();
  }
  // one input from a button, a side of the screen or a key
  function gameInput(code, on){
    const g = ui.game; if(ui.mode !== 'game' || !g) return;
    const def = GAME_DEFS[g.kind];
    if(def.input === 'hold'){ if(code === 'L' || code === 'R') ui.held[code] = on; return; }
    if(def.input === 'platform'){
      if(code === 'L' || code === 'R'){ ui.held[code] = on; return; }
      if(g.phase === 'play'){ if(on) def.press(g, code); else def.release(g, code); }
      return;
    }
    if(g.phase !== 'play') return;
    if(on){ if(def.press) def.press(g, code); }
    else if(def.release) def.release(g, code);   // the jump game listens to how long a press lasts
  }
  // a click without a press (keyboard focus, assistive tech)
  function tapGame(code){
    const g = ui.game; if(!g || g.phase !== 'play') return;
    const def = GAME_DEFS[g.kind];
    if(def.input === 'hold'){ if(def.tap) def.tap(g, code); }
    else if(def.press){ def.press(g, code); if(def.release) setTimeout(() => { if(ui.game === g) def.release(g, code); }, 90); }
  }
  function gameStep(){
    const g = ui.game;
    if(!g || ui.mode !== 'game'){ stopLoop(); return; }
    if(document.hidden) return;
    g.t++;
    if(g.phase === 'ready'){
      if(g.t % 19 === 1) Sound.beep();
      if(g.t >= 57){ g.phase = 'play'; g.t = 0; Sound.bell(1046.5, 0, .14); }
    } else if(g.phase === 'play'){
      GAME_DEFS[g.kind].step(g);
    } else if(g.t >= (g.levelUp ? 70 : 50)){ close(); return; }
    if(ui.game !== g) return;
    hud();
    drawGameFrame(g);
  }
  function drawGameFrame(g){
    clearLCD(); col.inverted = false; SCENE = g.kind === 'adventure' ? 'sky' : 'day';
    const st = GAME_DEFS[g.kind].draw(g);
    if(st){
      if(g.phase === 'end'){
        st.eyes = g.win ? 'happy' : 'open'; st.mouth = g.win ? 'open' : 'neutral'; st.arms = g.win ? 'up' : 'down';
        if(g.win && !reduced) st.lift = [0,2,4,5,4,2,0,0][g.t % 8];
      }
      let visible = true;
      if(g.hurt > 0){ st.eyes = 'sleep'; st.mouth = 'sad'; visible = !((g.hurt >> 1) & 1); }
      if(visible){ const info = drawPet(Pet.stage, st); if(g.kind === 'catch') g.catchY = info.top; }
    }
    if(g.hurt > 0) g.hurt--;
    particles(g.t);
    paint();
  }

  /* ---- input ---- */
  function onIcon(e){ const b = e.target.closest('[data-i]'); if(!b) return; Sound.beep(); ui.sel = +b.dataset.i; renderIcons(); run(ui.sel); }
  el.top.addEventListener('click', onIcon);
  el.bottom.addEventListener('click', onIcon);
  // Every finger is tracked on its own, so lifting the jump thumb doesn't stop the running one.
  // In the platformer a finger (or the mouse) running on one side can also flick up to jump without letting go.
  const ptrs = {}, FLICK = 9;
  const platform = () => ui.mode === 'game' && ui.game && GAME_DEFS[ui.game.kind].input === 'platform';
  const ptrDown = (e, code) => { ptrs[e.pointerId] = {code, y: e.clientY, up: false}; gameInput(code, true); };
  const ptrUp = e => {
    const p = ptrs[e.pointerId]; if(!p) return; delete ptrs[e.pointerId];
    if(p.up) gameInput('U', false);
    gameInput(p.code, false);
  };
  el.screen.addEventListener('pointerdown', e => {
    const z = e.target.closest('[data-g]'); if(!z || ui.mode !== 'game') return;
    e.preventDefault(); ptrDown(e, z.dataset.g);
  });
  window.addEventListener('pointermove', e => {
    const p = ptrs[e.pointerId]; if(!p || (p.code !== 'L' && p.code !== 'R') || !platform()) return;
    const dy = e.clientY - p.y;
    if(!p.up){ if(dy < -FLICK){ p.up = true; p.y = e.clientY; gameInput('U', true); } else if(dy > 0) p.y = e.clientY; }
    else { if(dy > FLICK * .7){ p.up = false; p.y = e.clientY; gameInput('U', false); } else if(dy < 0) p.y = e.clientY; }
  });
  ['pointerup', 'pointercancel'].forEach(ev => window.addEventListener(ev, ptrUp));
  window.addEventListener('blur', () => {
    Object.keys(ptrs).forEach(k => delete ptrs[k]);
    ui.held.L = ui.held.R = false;
    if(ui.game && ui.game.jumpHeld != null) ui.game.jumpHeld = false;
  });
  const KEYS = {ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'U', ArrowDown: 'D', ' ': 'U'};
  document.addEventListener('keydown', e => {
    if(ui.mode === 'main' || e.metaKey || e.ctrlKey || e.altKey || e.target.closest('input, textarea, select')) return;
    if(e.key === 'Escape'){ e.preventDefault(); back(); return; }
    if(ui.mode !== 'game') return;
    const code = KEYS[e.key]; if(!code) return;
    e.preventDefault();
    if(e.repeat && GAME_DEFS[ui.game.kind].input !== 'hold') return;
    gameInput(code, true);
  });
  document.addEventListener('keyup', e => { const code = KEYS[e.key]; if(code) gameInput(code, false); });
  el.screen.addEventListener('click', e => {
    ui.touched = Date.now();
    if(ui.mode === 'game'){
      // a click without a press (keyboard focus, assistive tech) still plays
      const z = e.target.closest('[data-g]'); if(z && e.detail === 0) tapGame(z.dataset.g);
      return;
    }
    const o = e.target.closest('[data-o]'); if(o){ Sound.beep(); choose(+o.dataset.o); return; }
    if(ui.mode === 'status'){ Sound.beep(); choose(0); return; }
    if(ui.mode !== 'main') return;
    doAct('pet');
  });
  el.btnBack.addEventListener('click', back);

  /* ---- noticing needs ---- */
  function watchCalls(s, now){
    const c = PetCore.calls(s, now); const key = c.join(',');
    if(!ui.booted){ ui.booted = H.ready(); ui.calls = key; renderIcons(); return; }
    if(key === ui.calls) return;
    const prev = ui.calls ? ui.calls.split(',') : [];
    ui.calls = key; renderIcons();
    const added = c.filter(k => prev.indexOf(k) < 0);
    if(added.length && H.onNeed) H.onNeed(added[0]);
  }

  /* ---- the screen, ten times a second ---- */
  function particles(F){
    Pet.parts = Pet.parts.filter(p => p.life > 0);
    for(const p of Pet.parts){
      p.life--;
      PEN = p.kind === 'heart' || p.kind === 'hs' ? C.RED : p.kind === 'note' ? (p.x & 4 ? C.LILAC : C.BLUE) : p.kind === 'z' ? C.LILAC : C.GOLD;
      if(p.kind === 'heart'){ if(!reduced && F % 2 === 0) p.y -= 1; if(p.life > 3 || F % 2) spr(HEART, p.x, p.y); }
      else if(p.kind === 'hs'){ if(!reduced && F % 2 === 0) p.y -= 1; spr(HEART_S, p.x, p.y); }
      else if(p.kind === 'note'){ if(!reduced && F % 2 === 0){ p.y -= 1; p.x += ((p.life >> 2) & 1) ? 1 : -1; } if(p.life > 2 || F % 2) spr((p.x & 2) ? NOTE_B : NOTE_A, p.x, p.y); }
      else if(p.kind === 'z'){ if(!reduced && F % 3 === 0){ p.y -= 1; p.x += (p.life % 6 < 3) ? 1 : 0; } spr(ZZ, p.x, p.y); }
      else spr(p.life > 3 ? SPARK : ['X'], p.x - (p.life > 3 ? 1 : 0), p.y - (p.life > 3 ? 1 : 0));
    }
    PEN = C.INK;
  }
  function frame(){
    if(document.hidden) return;
    const F = ++Pet.F, now = Date.now();
    if(H.onFrame) H.onFrame(F);
    const s = H.state();
    if(F % 10 === 0 && s){ PetCore.simulate(s, now); watchCalls(s, now); }
    if(F % 10 === 5 && s && now >= ui.nextSong){
      if(ui.mode !== 'main' || Pet.anim || Pet.evo || PetCore.asleep(now) || s.sick || !sing()) ui.nextSong = now + 5 * 60000;
    }
    if((ui.mode === 'food' || ui.mode === 'shop' || ui.mode === 'status' || ui.mode === 'games') && now - ui.touched > 25000) close();
    if(ui.mode === 'main' && ui.sel >= 0 && now - ui.touched > 15000){ ui.sel = -1; renderIcons(); }
    if(ui.mode === 'game') return;   // the game draws itself, faster
    clearLCD();

    const sl = PetCore.asleep(now), hr = new Date(now).getHours();
    const tc = H.todayWins();
    const sick = !!(s && s.sick);
    let busy = !!(Pet.anim || Pet.evo);
    const dark = sl && !!s && !s.light && !busy;
    col.inverted = dark;
    const flushing = Pet.anim && Pet.anim.type === 'flush';
    const np = flushing ? Pet.anim.n : (s ? s.poop : 0);
    const night = hr < 6 || hr >= 20, place = bgById(BG);
    SCENE = bgScene(BG, night);
    if(!dark){
      drawBg(BG, F, night);   // the chosen place, at the very back
      PEN = C.GOLD;
      if(place.sun !== false){
        if(night){ spr(MOON, 3, 2); if(!sick) [[52,4],[58,9],[45,3],[61,2]].forEach((p, i) => { if(((F >> 3) + i) % 3) P(p[0], p[1], ((F >> 3) + i) % 4 ? 1 : 2); }); }
        else spr(((F >> 3) & 1) ? SUN_A : SUN_B, 2, 2);
      }
      PEN = C.GRAY;
      if(sick && ((F >> 2) & 1)) spr(SKULL, 57, 2);
      groundLine(0, place.line, place.dirt);
      // a flower for every win of the day, each in its own colour
      const total = Math.min(tc, FRONT.length + BACK.length);
      const bloom = i => [C.PINK, C.GOLD, C.LILAC, C.BLUE, C.RED, C.ORANGE, C.MINT][i % 7];
      for(let i = FRONT.length; i < total; i++){ const rows = growRows(FLOWER_B, i, F), b = bloom(i); spr(rows, BACK[i - FRONT.length], G - 6 + (FLOWER_B.length - rows.length), null, [b, b, b, C.LEAF, C.LEAF, C.LEAF].slice(FLOWER_B.length - rows.length)); }
      for(let i = 0; i < Math.min(total, FRONT.length); i++){ const rows = growRows(FLOWER_F, i, F), b = bloom(i); spr(rows, FRONT[i], G - rows.length, null, [b, b, b, C.LEAF].slice(FLOWER_F.length - rows.length)); }
      PEN = C.BROWN;
      if(tc > FRONT.length + BACK.length && F % 6 === 0) Pet.spawn('spark', rand(2, 60), rand(14, 26));
      const wave = flushing ? 64 - (F - Pet.anim.f0) * 4 : 99;
      for(let i = 0; i < Math.min(4, np); i++){
        const x = POOP_X[i]; if(x + 5 > wave) continue;
        spr(POOP, x, G - 4);
        if(!flushing) withPen(C.MINT, () => spr((((F >> 2) + i) & 1) ? STINK_A : STINK_B, x + 1 + (i & 1), G - 8));
      }
      PEN = C.BLUE;
      if(flushing && wave > -4) for(let y = G - 9; y < G; y++){ const wx = wave + (((y + F) % 4) < 2 ? 0 : 1); P(wx, y); P(wx + 2, y, 2); }
      PEN = C.INK;
    }

    // pet mood
    const low = !!s && (s.hunger <= 1 || s.happy <= 1 || sick);
    const sleeping = sl && !busy;
    const wh = !!s && !busy && PetCore.whim(s, now);
    const st = {lift:0, eyes:'open', mouth: low ? 'sad' : ((tc >= 1 || (s && s.happy >= 3)) ? 'smile' : 'neutral'),
      cheeks: tc >= 3 || (!!s && s.happy >= 4 && !low), arms:'down', look:0, sway:0, xoff:0, step:0, blink:false, wear: s ? s.wear : ''};
    let stage = Pet.stage;
    if(!reduced && !sleeping && !sick) st.lift = (F >> 3) & 1;
    if(!reduced && ((F >> 4) % 3 === 0)) st.sway = 1;
    let walking = false;
    if(!sleeping && !sick && !busy && !reduced && stage > 0){
      const lo = np ? -8 : -6, hi = np ? -2 : 6;
      if(F >= Pet.nextWalk || Pet.tx < lo || Pet.tx > hi){ Pet.tx = rand(lo, hi); Pet.nextWalk = F + 40 + rand(0, 70); }
      if(Pet.x !== Pet.tx){ walking = true; if(F % (low ? 4 : 2) === 0){ const d = Math.sign(Pet.tx - Pet.x); Pet.facing = d; Pet.x += d; } }
    }
    if(walking){ st.look = Pet.facing; st.step = ((F >> 1) & 1) ? 1 : 2; st.lift = 0; }
    if(F >= Pet.nextBlink){ Pet.blinkUntil = F + 2; Pet.nextBlink = F + 25 + rand(0, 40); }
    if(F < Pet.blinkUntil){ st.eyes = 'blink'; st.blink = true; }
    if(stage === 0 && !reduced && F % 50 < 6) st.xoff = [1,-1,1,-1,1,0][F % 50];
    if(sick && !busy && !reduced && F % 30 < 4) st.xoff = [1,-1,1,0][F % 30];
    if(wh){ st.arms = ((F >> 2) & 1) ? 'wave' : 'up'; st.mouth = 'open'; if(!reduced) st.lift = ((F >> 2) & 1) * 2; }
    if(sleeping){ st.eyes = 'sleep'; st.mouth = 'sleep'; st.lift = 0; st.arms = 'down'; if(F % 16 === 0) Pet.spawn('z', 32 + Math.round(Pet.x) + 6, 14); }

    let food = null, shot = -1, scolding = false;
    if(Pet.anim){
      const a = F - Pet.anim.f0, ty = Pet.anim.type;
      const end = n => { if(a >= n) Pet.anim = null; };
      if(ty === 'cheer'){
        const J = [0,2,4,5,4,2,0,0,2,3,2,0,0]; const cap = stage >= 5 ? 3 : 5;
        st.lift = reduced ? 0 : Math.min(J[a] || 0, cap); st.eyes = 'happy'; st.mouth = 'open'; st.cheeks = true; st.arms = 'up';
        if(stage === 0 && !reduced) st.xoff = [1,-1,1,-1,1,-1,0][a] || 0;
        if(a === 2 || a === 9) Pet.spawn('heart', 32 + Math.round(Pet.x) + (a === 2 ? 5 : -9), 12);
        end(16);
      } else if(ty === 'pet'){
        st.eyes = 'happy'; st.mouth = 'smile'; st.cheeks = true; st.arms = ((a >> 1) & 1) ? 'wave' : 'down';
        if(!reduced) st.lift = [0,1,2,1,0][a] || 0;
        if(stage === 0 && !reduced) st.xoff = [1,-1,1,0][a] || 0;
        if(a === 1) Pet.spawn('hs', 32 + Math.round(Pet.x) + 4, 12);
        end(14);
      } else if(ty === 'undo'){
        st.mouth = 'neutral'; if(!reduced) st.xoff = [1,-1,1,-1,0][a] || 0;
        end(8);
      } else if(ty === 'plead'){
        st.mouth = 'sad'; st.arms = ((a >> 1) & 1) ? 'wave' : 'up'; if(!reduced) st.xoff = [1,-1,1,-1,0][a % 5] || 0;
        if(a === 3) Pet.spawn('hs', 32 + Math.round(Pet.x) + 6, 12);
        end(18);
      } else if(ty === 'eat'){
        st.mouth = (a < 18 && a % 6 < 3) ? 'open' : 'smile'; st.eyes = a >= 18 ? 'happy' : 'open'; st.cheeks = a >= 18; st.lift = 0;
        Pet.tx = Pet.x; food = {k: Pet.anim.food, bite: Math.min(3, Math.floor(a / 6))};
        if(a === 20) Pet.spawn('hs', 32 + Math.round(Pet.x) + 5, 12);

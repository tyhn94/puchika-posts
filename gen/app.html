        end(28);
      } else if(ty === 'flush'){
        st.look = 1; st.eyes = a >= 10 ? 'happy' : 'open'; st.mouth = a >= 10 ? 'smile' : 'open';
        end(20);
      } else if(ty === 'shot'){
        shot = a; st.eyes = a < 10 ? 'sleep' : 'happy'; st.mouth = a < 10 ? 'neutral' : 'open'; st.lift = 0;
        if(a >= 10 && a % 2 === 0) Pet.spawn('spark', 32 + Math.round(Pet.x) + rand(-12, 12), rand(8, 24));
        end(22);
      } else if(ty === 'scold'){
        scolding = true; st.mouth = 'sad'; st.eyes = 'sleep'; if(!reduced) st.xoff = [1,-1,1,-1,0,0,0][a % 7];
        end(16);
      } else if(ty === 'nope'){
        st.look = ((a >> 1) & 1) ? 1 : -1; st.mouth = 'neutral'; st.lift = 0;
        end(12);
      } else if(ty === 'sing'){
        st.eyes = 'happy'; st.cheeks = true; st.mouth = ((a >> 1) % 3) ? 'open' : 'smile';
        if(!reduced){ st.xoff = [0, 1, 1, 0, -1, -1][(a >> 2) % 6]; st.lift = (a >> 2) & 1; }
        st.arms = ((a >> 3) & 1) ? 'wave' : 'up';
        if(a % 7 === 0) Pet.spawn('note', 32 + Math.round(Pet.x) + (((a / 7) & 1) ? 6 : -11), 11);
        end(Pet.anim.len || 40);
      } else if(ty === 'wear'){
        st.eyes = 'happy'; st.mouth = 'open'; st.arms = 'up'; st.cheeks = true;
        if(a % 3 === 0) Pet.spawn('spark', 32 + Math.round(Pet.x) + rand(-14, 14), rand(4, 24));
        end(20);
      } else end(30);
    }
    if(Pet.evo){
      const a = F - Pet.evo.f0;
      if(a < 24) stage = ((a >> 1) & 1) ? Pet.evo.from : Pet.evo.to;
      st.eyes = 'happy'; st.mouth = 'open'; st.cheeks = true; st.arms = 'up';
      if(a % 3 === 0) Pet.spawn('spark', 32 + Math.round(Pet.x) + rand(-16, 16), rand(4, 26));
      if(a === 26 || a === 32) Pet.spawn('heart', 32 + Math.round(Pet.x) + (a === 26 ? 7 : -11), 10);
      if(a >= 36){ Pet.evo = null; Pet.anim = {type:'cheer', f0:F}; }
    }
    if(stage > 0) st.xoff += Math.round(Pet.x);
    const info = drawPet(stage, st);
    const rx = Math.ceil(SHAPES[stage].rx), ry = SHAPES[stage].ry;
    if(dark){ for(let i = 0; i < buf.length; i++) if(buf[i] === 1) buf[i] = 2; }
    if(food){
      const rows = FOODS[food.k] || FOODS.meal, w = rows[0].length;
      let fx = info.cx + rx + 2; const right = fx + w <= LW - 1; if(!right) fx = info.cx - rx - 2 - w;
      const cut = Math.ceil(food.bite * w / 3);
      const fp = {meal: [C.ORANGE], snack: [C.PINK], cake: [C.RED, C.PINK, C.PINK, C.GOLD]}[food.k] || [C.ORANGE];
      if(cut < w) spr(right ? rows.map(r => r.slice(cut)) : rows.map(r => r.slice(0, w - cut)), right ? fx + cut : fx, G - rows.length, null, fp);
    }
    if(shot >= 0 && shot < 12) spr(SYRINGE, Math.max(info.cx + rx - 1, 58 - shot * 3), Math.round(G - 2 - ry), null, [C.BLUE]);
    if((scolding && ((F >> 1) & 1)) || (wh && ((F >> 2) & 1))) spr(BANG, Math.min(LW - 2, info.cx + rx + 2), Math.max(1, info.top - 1), null, [C.RED]);
    if(stage >= 6 && !dark && F % 10 === 0) Pet.spawn('spark', 32 + Math.round(Pet.x) + rand(-15, 15), rand(3, 24));
    if(tc >= 6 && !dark && !sleeping && F % 24 === 0) Pet.spawn('spark', 32 + Math.round(Pet.x) + rand(-14, 14), rand(5, 22));
    particles(F);
    paint();
  }

  return {
    frame, back, sing,
    act: (kind, extra) => doAct(kind, extra),   // the page's Customize panel dresses the pet through this
    redraw(){ if(ui.mode !== 'game') renderOv(); },
    // one still frame of a game, for the store's pictures (draws into the pixel buffer; the caller paints it)
    preview(kind){
      const def = GAME_DEFS[kind]; if(!def) return;
      const g = {kind, L: 3, phase: 'play', t: 20, score: 5, lives: 3, maxLives: 3, hurt: 0, items: [], win: false};
      def.setup(g);
      if(kind === 'bonk'){ g.holes = [{age: 8, stay: 10, hit: true}, {age: 7, stay: 10, gold: true}, {age: 3, stay: 10, bomb: true}]; g.mallet = 0; g.malletT = 4; }
      if(kind === 'stack'){ g.tower = [{x: 22, w: 16}, {x: 23, w: 15}, {x: 23, w: 15}, {x: 25, w: 13}, {x: 25, w: 13}, {x: 26, w: 12}]; g.blk = {x: 40, w: 12, dir: 1}; }
      def.draw(g);
    },
    game: () => ui.game,   // read-only peek, used by the automated tests
    // after a language change: icon names and whatever menu is open
    refresh(){ icons.forEach((b, i) => { const n = iconName(TAMA_ICONS[i].k); b.setAttribute('aria-label', n); b.title = n; }); renderIcons(); if(ui.mode !== 'game') renderOv(); },
    needs(){ const s = H.state(); return s ? PetCore.calls(s, Date.now()) : []; },
    needMsg
  };
}

/* ---------- confetti: a juicy burst for big moments (all five prayers of a day) ----------
   One canvas over the whole window, drawn only while something is flying. Paper ribbons flip in 3D
   and flutter down, little crescents and stars twinkle, a soft ring and flash mark where it began. */
const Confetti = (function(){
  const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const FALLBACK = ['#ff8fb8', '#f5c654', '#78d1a8', '#8ab6f2', '#b29cef'];
  let cv = null, cx = null, W = 0, H = 0, dpr = 1, raf = 0, last = 0;
  let parts = [], rings = [], timers = [];
  const R = (a, b) => a + Math.random() * (b - a);
  const pickOf = a => a[Math.floor(Math.random() * a.length)];

  function setup(){
    if(cv && cv.isConnected) return;
    cv = document.createElement('canvas'); cv.className = 'kz-confetti'; cv.setAttribute('aria-hidden', 'true');
    document.body.appendChild(cv); cx = cv.getContext('2d');
    resize();
  }
  function resize(){
    if(!cv) return;
    dpr = Math.min(2, window.devicePixelRatio || 1); W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  }
  window.addEventListener('resize', () => { if(raf) resize(); });

  function darkBg(){
    const m = (getComputedStyle(document.body).backgroundColor || '').match(/\d+(\.\d+)?/g);
    if(!m || m.length < 3 || (m.length > 3 && +m[3] === 0)) return false;
    return (.2126 * m[0] + .7152 * m[1] + .0722 * m[2]) < 110;
  }
  // the current theme's own colors, plus gold (and white on dark backgrounds)
  function palette(){
    const cs = getComputedStyle(document.documentElement);
    const own = ['--accent', '--accent-strong', '--t1d', '--t2d', '--t3d', '--t4d', '--t5d', '--shell-deep']
      .map(n => (cs.getPropertyValue(n) || '').trim()).filter(v => v && v.indexOf('var(') < 0);
    const base = own.length >= 4 ? own : own.concat(FALLBACK);
    return {paper: base.concat(['#ffc93c', '#ffb02e']), shine: darkBg() ? ['#ffffff', '#ffe58a', '#ffd25e'] : ['#ffc93c', '#ffb02e', '#f7a8c8']};
  }

  function add(x, y, ang, speed, kind, color, o){
    o = o || {};
    const paper = kind === 'rect' || kind === 'strip';
    parts.push({
      x, y, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed, kind, color,
      w: kind === 'strip' ? R(3.5, 5) : kind === 'rect' ? R(7, 11) : R(6, 9), h: kind === 'strip' ? R(11, 17) : R(4, 6.5),
      rot: R(0, Math.PI * 2), vr: R(-.18, .18), flip: R(0, Math.PI * 2), vf: R(.08, .22),
      wob: R(0, Math.PI * 2), ws: R(.05, .12), wa: paper ? R(.4, 1.3) : R(.1, .5),
      drag: o.drag || (paper ? R(.955, .972) : R(.95, .965)), g: o.g || (paper ? R(.16, .24) : R(.12, .2)),
      term: o.term || (paper ? R(1.6, 2.6) : R(1.2, 2)),
      age: 0, life: o.life || (paper ? R(3400, 5200) : R(2600, 4200)), tw: R(0, 6)
    });
  }
  function mix(pal, i){ return i % 5 === 4 ? pickOf(pal.shine) : pickOf(pal.paper); }
  function shapeFor(i, fancy){
    const r = Math.random();
    if(fancy && r < .12) return 'moon';
    if(fancy && r < .26) return 'star';
    if(r < .36) return 'dot';
    if(r < .5) return 'strip';
    return 'rect';
  }
  // a radial pop at (x, y), leaning upwards
  function burst(x, y, n, power, pal, fancy){
    for(let i = 0; i < n; i++){
      const ang = -Math.PI / 2 + R(-1, 1) * Math.PI * .85;
      add(x, y, ang, R(.35, 1) * power, shapeFor(i, fancy), mix(pal, i));
    }
  }
  // a party popper from a corner, aimed up and inwards
  function cannon(x, y, dir, n, power, pal, fancy){
    const sideways = Math.min(1, W / H * .9);   // on a tall phone screen, don't shoot everything off the other side
    for(let i = 0; i < n; i++){
      const ang = -Math.PI / 2 + dir * R(.28, .72), sp = R(.6, 1) * power;
      add(x, y, ang, sp, shapeFor(i, fancy), mix(pal, i));
      parts[parts.length - 1].vx *= sideways;
    }
  }
  // a slow shower of crescents, stars and paper from the top
  function rain(n, pal){
    for(let i = 0; i < n; i++){
      const kind = i % 3 === 0 ? 'moon' : i % 3 === 1 ? 'star' : 'rect';
      add(R(0, W), R(-80, -10), Math.PI / 2, R(.3, 1.2), kind, kind === 'rect' ? pickOf(pal.paper) : pickOf(pal.shine.concat(pal.paper.slice(0, 3))),
        {g: .03, term: R(.9, 1.6), drag: .99, life: R(3200, 4600)});
    }
  }

  function drawStar(s){
    cx.beginPath();
    for(let i = 0; i < 10; i++){ const r = i % 2 ? s * .45 : s, a = -Math.PI / 2 + i * Math.PI / 5; cx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
    cx.closePath(); cx.fill();
  }
  function drawMoon(s){
    // a crescent: the outer circle minus a smaller one shifted to the right
    cx.beginPath();
    cx.arc(0, 0, s, .896, Math.PI * 2 - .896, false);
    cx.arc(s * .45, 0, s * .8, -1.35, 1.35, true);
    cx.closePath(); cx.fill();
  }
  function frame(now){
    const dt = Math.min(48, now - (last || now)); last = now;
    const k = dt / 16.67;
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx.clearRect(0, 0, W, H);
    for(const r of rings){
      r.age += dt; const p = Math.min(1, r.age / r.life), e = 1 - Math.pow(1 - p, 3);
      if(r.flash){
        const g = cx.createRadialGradient(r.x, r.y, 0, r.x, r.y, r.max * (.4 + .6 * e));
        g.addColorStop(0, r.color); g.addColorStop(1, 'rgba(255,255,255,0)');
        cx.globalAlpha = .55 * (1 - p); cx.fillStyle = g; cx.beginPath(); cx.arc(r.x, r.y, r.max, 0, Math.PI * 2); cx.fill();
      } else {
        cx.globalAlpha = .7 * (1 - p); cx.strokeStyle = r.color; cx.lineWidth = Math.max(.5, r.lw * (1 - p));
        cx.beginPath(); cx.arc(r.x, r.y, 6 + r.max * e, 0, Math.PI * 2); cx.stroke();
      }
    }
    rings = rings.filter(r => r.age < r.life);
    for(const p of parts){
      p.age += dt;
      const dk = Math.pow(p.drag, k);
      p.vx *= dk; p.vy = Math.min(p.term, p.vy * dk + p.g * k);
      p.wob += p.ws * k; p.rot += p.vr * k; p.flip += p.vf * k; p.tw += .25 * k;
      p.x += (p.vx + Math.sin(p.wob) * p.wa * Math.min(1, p.age / 500)) * k; p.y += p.vy * k;
      const fade = Math.min(1, (p.life - p.age) / 700, p.age / 60);
      if(fade <= 0) continue;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.color;
      if(p.kind === 'rect' || p.kind === 'strip'){
        const c = Math.cos(p.flip);
        cx.globalAlpha = fade * (c < 0 ? .72 : 1);
        cx.scale(1, Math.max(.08, Math.abs(c)));
        cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      } else if(p.kind === 'dot'){
        cx.globalAlpha = fade; cx.beginPath(); cx.arc(0, 0, p.w * .42, 0, Math.PI * 2); cx.fill();
      } else {
        const tw = .75 + .25 * Math.sin(p.tw);
        cx.globalAlpha = fade * (.7 + .3 * tw); cx.scale(tw, tw);
        if(p.kind === 'star') drawStar(p.w); else drawMoon(p.w * .9);
      }
      cx.restore();
    }
    parts = parts.filter(p => p.age < p.life && p.y < H + 60 && p.x > -80 && p.x < W + 80);
    cx.globalAlpha = 1;
    if(parts.length || rings.length || timers.length) raf = requestAnimationFrame(frame);
    else { raf = 0; cx.clearRect(0, 0, W, H); cv.style.display = 'none'; }
  }
  function run(){
    cv.style.display = '';
    if(!raf){ last = 0; raf = requestAnimationFrame(frame); }
  }
  function later(ms, fn){
    const id = setTimeout(() => { timers = timers.filter(t => t !== id); fn(); run(); }, ms);
    timers.push(id);
  }

  return {
    // the big one: a pop where it happened, two party poppers from the bottom corners, then a soft shower
    party(o){
      o = o || {};
      setup(); resize();
      const pal = palette();
      const x = o.x != null ? o.x : W / 2, y = o.y != null ? o.y : H / 2;
      const scale = Math.max(.85, Math.min(1.3, Math.sqrt(W * H) / 760)) * (o.scale || 1);
      const accent = pal.paper[0];
      if(RM){ rain(Math.round(36 * scale), pal); run(); return; }
      rings.push({x, y, max: 150 * scale, life: 520, lw: 7, color: accent, age: 0});
      rings.push({x, y, max: 120 * scale, life: 380, flash: true, color: pal.shine[1], age: 0});
      burst(x, y, Math.round(110 * scale), 15 * Math.max(1, scale), pal, true);
      run();
      const pw = H * .052 * (o.scale || 1);   // strong enough to reach the upper part of any screen
      later(110, () => cannon(-6, H + 6, 1, Math.round(90 * scale), pw, pal, true));
      later(230, () => cannon(W + 6, H + 6, -1, Math.round(90 * scale), pw, pal, true));
      // a second little pop where the card lands, then a slow shower of crescents and stars
      if(o.echo) later(o.echo.at || 380, () => { rings.push({x: o.echo.x, y: o.echo.y, max: 110 * scale, life: 420, lw: 5, color: pal.shine[0], age: 0}); burst(o.echo.x, o.echo.y, Math.round(36 * scale), 10, pal, true); });
      later(650, () => rain(Math.round(50 * scale), pal));
    },
    burst(x, y, n){ setup(); resize(); burst(x, y, n || 40, 11, palette(), true); run(); }
  };
})();

/* ---------- the Puchi on the page: saving it and wiring the device ---------- */
const TAMA_HINT_KEY = 'puchika-device-hint';
function firstWinMs(){ const ks = Object.keys(S.days).filter(k => dayCount(k) > 0).sort(); return ks.length ? parseKey(ks[0]).getTime() : Date.now(); }

// the pet lives in one document; saves are coalesced like the to-do list
const PW = {timer:null, busy:false, dirty:false, retry:0};
function petPending(){ return !!(PW.timer || PW.busy || PW.dirty); }
function queuePet(){
  persistLocalCopy();
  if(Store.mode !== 'cloud'){ lsSet(LOCAL_KEY, snapshotAll()); return; }
  PW.dirty = true; setSync('saving');
  clearTimeout(PW.timer);
  PW.timer = setTimeout(() => { PW.timer = null; flushPet(); }, 500);
}
async function flushPet(){
  if(PW.busy || !Store.col || !S.pet) return;
  PW.busy = true; let ok = true;
  try {
    while(PW.dirty){
      PW.dirty = false;
      const body = PetCore.clone(S.pet);
      try { await Store.col.doc('pet').set(body); }
      catch(err){ if(err && (err.code === 'unavailable' || err.code === 'resource_exhausted')){ await sleep(800 + Math.random() * 800); await Store.col.doc('pet').set(body); } else throw err; }
    }
  } catch(err){ ok = false; PW.dirty = true; setSync('err'); PW.retry++; if(PW.retry <= 3) setTimeout(flushPet, 6000); }
  finally { PW.busy = false; if(ok){ PW.retry = 0; if(PW.dirty) flushPet(); else if(!anyPending()) setSync('ok'); } }
}
function flushPetNow(){ if(PW.timer){ clearTimeout(PW.timer); PW.timer = null; flushPet(); } }
document.addEventListener('visibilitychange', () => { if(document.hidden) flushPetNow(); });
window.addEventListener('pagehide', flushPetNow);

function petSay(m, d){ say(m); Sound.babble(m, d == null ? .45 : d); }
function petChanged(){ queuePet(); renderPetPanel(); }
const Tama = makeTama({
  el: {top: $('#iconsTop'), bottom: $('#iconsBottom'), screen: $('#screen'), ov: $('#lcdOv'), btnBack: $('#btnBack')},
  ready: () => S.ready && !!S.pet,
  has: (type, id) => S.ready && ownsItem(type, id),   // games from store packs
  state: () => S.pet,
  earned: () => totalXp(),
  todayWins: () => dayCount(todayKey()),
  act(kind, extra){
    const now = Date.now();
    const r = PetCore.apply(S.pet, Object.assign({kind, at: now}, extra), now, totalXp());
    if(r.ok || r.code === 'scoldbad') petChanged();
    return r;
  },
  say: (m, o) => (o && o.voice === false) ? say(m) : petSay(m),
  singOn: () => S.ready && S.settings.sing !== false && Sound.on,
  status(){ Sound.chirp('q'); petSay(statusMsg(), .3); },
  petMsgs(){ let m, n = 0; do { m = tx('petMsgs'); } while(m === lastSaid && ++n < 6); return m; },
  onNeed(k){
    if(document.hidden || tab !== 'wins' || !I18N.has('tama.need.' + k)) return;
    Pet.anim = {type:'plead', f0:Pet.F}; Sound.chirp('q'); petSay(needMsg(k));
  },
  onFrame(){
    const t = todayKey();
    if(t !== lastToday){ if(sel === lastToday) sel = t; lastToday = t; weekStart = mondayOf(sel); renderAll(); }
  }
});
function tick(){ Tama.frame(); if(tab === 'talk') TalkUI.frame(); }
if(/[?&]tamatest\b/.test(location.search)) window.__tama = Tama;

function sizeCanvas(){
  const box = $('#lcdBtn'); const w = box.clientWidth - 12; if(w <= 0) return;
  const dpr = window.devicePixelRatio || 1;
  SC = Math.max(2, Math.floor(w * dpr / LW));
  const cssW = LW * SC / dpr;
  cv.width = LW * SC; cv.height = LH * SC;
  cv.style.width = cssW + 'px'; cv.style.height = (LH * SC / dpr) + 'px';
  // menus: small and neat, like the text on a real toy (a touch smaller on very narrow screens)
  const lcd = $('#lcdBtn'), scr = $('#screen');
  lcd.style.setProperty('--ovfs', (cssW < 190 ? 12 : 14) + 'px');
  // games keep their touch areas and score line on the screen itself
  lcd.style.setProperty('--scr-x', scr.offsetLeft + 'px'); lcd.style.setProperty('--scr-y', scr.offsetTop + 'px');
  lcd.style.setProperty('--scr-w', cssW + 'px'); lcd.style.setProperty('--scr-h', (LH * SC / dpr) + 'px');
}

/* ---------- Talk: chatting with the Puchi, no AI ----------
   A careful script instead of a model: it listens for patterns (chat.hear.* in the language pack), keeps
   a small memory (your name, what you like, how you felt), knows your day (wins, to-dos, streak, the
   pet's needs) and can really do things (mark a win, add a to-do, feed or cuddle the pet). Several
   little conversations can run over more than one message (a riddle, a game, a yes/no question).
   Nothing leaves the browser. H is the page: it gives the facts and does the actions. */
function makeTalk(H){
  const KEY = 'puchika-talk';
  const blank = () => ({log: [], likes: [], fav: {}, mood: null, intro: false, askedName: false, care: 0, turns: 0});
  let mem = blank();
  try { const m = JSON.parse(localStorage.getItem(KEY) || 'null'); if(m && typeof m === 'object') mem = Object.assign(blank(), m); } catch(e){}
  const save = () => { try { mem.log = mem.log.slice(-80); localStorage.setItem(KEY, JSON.stringify(mem)); } catch(e){} };
  let pending = null, lastIn = '', petTurns = 0;
  const recent = [];

  /* ---- words ---- */
  const persona = () => H.ctx().persona;
  const has = k => I18N.has(k);
  const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  function vars(extra){
    const c = H.ctx(), v = Object.assign({pet: c.pet, name: c.name || tx('chat.friend'), stage: c.stage, place: c.place, wins: txn('units.win', c.wins)}, extra || {});
    if(v.x != null) v.X = cap(v.x);
    if(v.topic != null) v.Topic = cap(v.topic);
    if(v.pick != null) v.Pick = cap(v.pick);
    return v;
  }
  // a line from the pack (Chika's own when she has one), never the same one twice in a row
  function line(key, extra){
    const k = persona() === 'c' && has('chat.c.' + key) ? 'chat.c.' + key : 'chat.' + key;
    const arr = I18N.list(k);
    if(!arr.length) return tx(k, vars(extra));
    let pool = arr.filter(s => recent.indexOf(s) < 0); if(!pool.length) pool = arr;
    const s = pool[Math.floor(Math.random() * pool.length)];
    recent.push(s); if(recent.length > 50) recent.shift();
    return I18N.fill(s, vars(extra));
  }
  const pick = a => a[Math.floor(Math.random() * a.length)];

  /* ---- hearing ---- */
  // lowercase words only, a space at each end, so " phrase " can be found anywhere
  function norm(s){
    s = String(s).toLowerCase().replace(/[’`´]/g, "'")
      .replace(/[❤♥💕💖💗💓💞💘😍🥰😘]/gu, ' love you ').replace(/[😢😭😞😔☹🙁😿💔]/gu, ' sad ').replace(/[😂🤣😆😹]/gu, ' haha ')
      .replace(/[😡😠🤬]/gu, ' angry ').replace(/[😴🥱]/gu, ' tired ').replace(/[😊🙂😄😁😃☺]/gu, ' happy ');
    s = s.replace(/([a-z])\1{2,}/g, '$1$1');   // heyyyy → heyy
    s = ' ' + s.replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim() + ' ';
    return s.replace(/ u /g, ' you ').replace(/ ur /g, ' your ').replace(/ r /g, ' are ').replace(/ im /g, " i'm ").replace(/ ive /g, " i've ")
      .replace(/ pls | plz /g, ' please ').replace(/ wanna /g, ' want to ').replace(/ gonna /g, ' going to ').replace(/ gotta /g, ' got to ').replace(/ hii+ /g, ' hi ');
  }
  const RX = {};
  function rx(alt){ return RX[alt] || (RX[alt] = new RegExp(' (?:' + alt + ') ')); }
  const hears = (n, key) => has('chat.hear.' + key) && rx(tx('chat.hear.' + key)).test(n);
  const words = n => n.trim().split(' ').filter(Boolean);
  const STOP = new Set(('i me my mine you your yours we our it its is am are was were be been being a an the and or but so to of in on at for with about from by as that this these those there here what which who whom whose when where why how all any some no not do does did done have has had having can could will would should shall may might must just very really too also then than now today tomorrow yesterday please thanks thank like love want need get got go going make made know think feel feeling really much more most some thing things stuff lot lots little bit kind sort yeah yes ok okay oh hey hi hello um uh hmm well maybe').split(' '));
  // what a message is about: the thing after "my"/"the"/"a" first, else the longest word that isn't an -ing word
  function topicOf(n){
    const own = n.match(/ (?:my|our|the|a|an) ([a-z]{3,}) /);
    if(own && !STOP.has(own[1])) return own[1];
    const w = words(n).filter(x => x.length > 3 && !STOP.has(x) && !/^\d+$/.test(x) && x.indexOf("'") < 0);
    if(!w.length) return '';
    const plain = w.filter(x => !/ing$/.test(x));
    return (plain.length ? plain : w).sort((a, b) => b.length - a.length)[0];
  }
  const NEG = / (?:need to|have to|has to|want to|going to|got to|should|will|i'll|didn't|did not|haven't|have not|hasn't|can't|cannot|couldn't|could not|forgot to|forget to|not yet|tomorrow|later|plan to|hope to|try to|trying to|must|wish i|i'd like to|don't|do not|never)(?= )/;
  const PAST = / (?:i|i've|just|finally|already|did|done|finished|today i|we)(?= )/;

  /* ---- what the page knows ---- */
  function cellFor(n){
    for(const c of H.cells()){
      const key = 'chat.cells.' + c.id;
      if(has(key)){ if(rx(tx(key)).test(n)) return c; continue; }
      const w = words(norm(c.label)).filter(x => x.length > 3 && !STOP.has(x));
      if(w.length && w.every(x => n.indexOf(' ' + x.slice(0, Math.max(4, x.length - 2))) >= 0)) return c;
    }
    return null;
  }

  /* ---- replies ---- */
  const say = (text, o) => Object.assign({text}, o || {});
  const chips = (...keys) => keys.filter(Boolean).map(k => tx('chat.chips.' + k));
  function markWin(c){
    const have = c.have, max = c.max || 1;
    if(have >= max) return say(line('win.full', {cell: c.label}), {chips: chips('idea', 'how')});
    const r = H.mark(c.id), now = H.ctx();
    if(max > 1 && r.have < max) return say(line('win.multi', {cell: c.label, n: I18N.num(r.have), max: I18N.num(max)}), {mood: 'happy'});
    return say(line('win.marked', {cell: c.label, wins: txn('units.win', now.wins)}), {mood: 'happy', chips: chips('wins', 'idea')});
  }
  function idea(){
    const c = H.ctx();
    const open = H.cells().filter(x => x.have < (x.max || 1) && !(x.id === 'wake' && c.hour >= 12));
    if(!open.length) return [say(tx('chat.idea.allDone'), {mood: 'happy'})];
    const cell = pick(open);
    pending = {kind: 'idea', id: cell.id};
    const text = has('chat.idea.' + cell.id) ? tx('chat.idea.' + cell.id) : tx('chat.idea.custom', {cell: cell.label});
    return [say(text + ' ' + line('idea.after'), {chips: chips('done', 'idea')})];
  }
  function stats(){
    const c = H.ctx();
    let s = tx('chat.stats.line', {wins: txn('units.win', c.wins), total: txn('units.win', c.total)});
    if(c.streak > 1) s += tx('chat.stats.streak', {streak: txn('units.day', c.streak)});
    s += c.left ? tx('chat.stats.next', {left: txn('units.win', c.left), nextStage: c.nextStage}) : tx('chat.stats.max');
    s += tx('chat.stats.cheer');
    return [say(s, {mood: 'happy', chips: chips('idea')})];
  }
  function todoText(raw){
    let t = String(raw).trim().replace(/^[:\-–\s]+/, '').replace(/[.!?\s]+$/, '');
    t = t.replace(/^(?:to |that i |that |a |an )/i, '').replace(/\bmy\b/gi, 'my');
    return cap(t.slice(0, 120));
  }
  function addTodo(text){
    if(!text) { pending = {kind: 'todoText'}; return [say(line('todo.ask'))]; }
    if(!H.addTodo(text)) return [say(line('todo.full'))];
    return [say(line('todo.added', {x: text}), {mood: 'happy'})];
  }
  function act(kind){
    const r = H.act(kind) || {code: 'none'};
    const code = r.code === 'snack' || r.code === 'cake' ? 'meal' : r.code;
    return [say(has('chat.act.' + code) ? line('act.' + code) : line('act.none'), {mood: r.ok ? 'happy' : null})];
  }
  function story(){
    const v = {place: H.ctx().place, hero: pick(I18N.list('chat.story.hero')), goal: pick(I18N.list('chat.story.goal')), try: pick(I18N.list('chat.story.try'))};
    return [say([line('story.start', v), line('story.middle', v), line('story.end', v)].join(' '), {chips: chips('riddle', 'joke')})];
  }
  function riddle(){
    const all = I18N.list('chat.riddles'), i = (mem.riddle = ((mem.riddle == null ? Math.floor(Math.random() * all.length) : mem.riddle) + 1) % all.length);
    pending = {kind: 'riddle', i, wrong: 0}; save();
    return [say(line('riddle.ask', {q: all[i][0]}), {chips: chips('giveUp')})];
  }
  function wyr(){
    const pairs = I18N.list('chat.wyr.pairs'), p = pick(pairs);
    pending = {kind: 'wyr', a: p[0], b: p[1]};
    return [say(line('wyr.ask', {a: p[0], b: p[1]}), {chips: [cap(p[0]), cap(p[1])]})];
  }
  function welcome(){
    const c = H.ctx(), out = [];
    if(!mem.intro){
      mem.intro = true; save();
      if(c.name) return [say(line('introNamed'), {mood: 'happy', chips: chips('how', 'help')})];
      pending = {kind: 'name'}; mem.askedName = true; save();
      return [say(line('intro'), {mood: 'happy'})];
    }
    const part = c.asleep ? 'night' : c.hour < 12 ? 'morning' : c.hour < 18 ? 'afternoon' : 'evening';
    let s = line('welcome.' + part);
    const recentMood = mem.mood && Date.now() - mem.mood.t < 36 * 3600e3 && ['sad', 'tired', 'stressed', 'lonely', 'angry', 'sick'].indexOf(mem.mood.k) >= 0;
    if(recentMood){ s += ' ' + line('welcome.mood', {mood: tx('chat.moodWords.' + mem.mood.k)}); out.push(say(s, {chips: chips('how', 'idea')})); return out; }
    if(!c.wins){ s += ' ' + line('welcome.none'); pending = {kind: 'ideaOffer'}; out.push(say(s, {chips: chips('yes', 'no')})); return out; }
    const cells = I18N.joinList(c.done.slice(0, 4).map(d => d.label));
    s += ' ' + line(c.wins >= 6 ? 'welcome.lots' : 'welcome.some', {cells});
    out.push(say(s, {mood: 'happy', chips: chips('how', 'joke', 'idea')}));
    return out;
  }

  // something that clearly means more than a name or a little note
  const INTENTS = ['greet', 'howAreYou', 'thanks', 'joke', 'riddle', 'game', 'rps', 'wyr', 'story', 'fact', 'sing', 'help', 'idea', 'stats', 'crisis', 'stop', 'mood_sad', 'mood_lonely', 'mood_tired', 'mood_stressed', 'mood_angry', 'mood_sick', 'mood_bored', 'mood_happy', 'mood_okay', 'love', 'bye'];
  const looksLikeIntent = n => INTENTS.some(k => hears(n, k));

  /* ---- the little conversations that wait for an answer ---- */
  function answerPending(n, raw){
    const p = pending; pending = null;
    const yes = hears(n, 'yes'), no = hears(n, 'no');
    switch(p.kind){
      case 'name': {
        if(no && words(n).length <= 3) return [say(line('nameSkip'), {chips: chips('how', 'help')})];
        if(looksLikeIntent(n)) return null;
        const m = raw.trim().match(/^(?:(?:my name is|my name's|i'm|i am|it's|its|call me|just)\s+)?([\p{L}][\p{L}'’-]{0,15})(?:\s+[\p{L}][\p{L}'’-]{0,15})?[.!]?$/iu);
        if(m && !STOP.has(m[1].toLowerCase())){ const name = cap(m[1]); H.setName(name); return [say(line('nameSet', {name}), {mood: 'happy', chips: chips('how', 'help')})]; }
        return null;
      }
      case 'riddle': {
        const r = I18N.list('chat.riddles')[p.i];
        if(rx(r[1]).test(n)) return [say(line('riddle.right'), {mood: 'happy', chips: chips('riddle', 'joke')})];
        if(hears(n, 'giveUp')) return [say(line('riddle.reveal', {a: r[2]}), {chips: chips('riddle', 'joke')})];
        if(looksLikeIntent(n) || words(n).length > 5) return null;   // they moved on
        if(p.wrong >= 1) return [say(line('riddle.reveal', {a: r[2]}), {chips: chips('riddle', 'joke')})];
        pending = {kind: 'riddle', i: p.i, wrong: p.wrong + 1}; return [say(line('riddle.wrong'), {chips: chips('giveUp')})];
      }
      case 'rps': {
        if(hears(n, 'stop') || no) return [say(line('stopGame'))];
        const W = {}; ['rock', 'paper', 'scissors'].forEach(k => { W[k] = rx(tx('chat.rps.words.' + k)); });
        const me = ['rock', 'paper', 'scissors'].find(k => W[k].test(n)); if(!me) return null;
        const pet = pick(['rock', 'paper', 'scissors']), beats = {rock: 'scissors', paper: 'rock', scissors: 'paper'};
        const res = me === pet ? 'tie' : beats[me] === pet ? 'win' : 'lose';
        pending = {kind: 'rps'};
        return [say(line('rps.' + res, {mine: tx('chat.rps.' + pet)}) + tx('chat.rps.again'), {mood: res === 'lose' ? 'happy' : null, chips: chips('rock', 'paper', 'scissors', 'stop')})];
      }
      case 'guess': {
        if(hears(n, 'stop') || hears(n, 'giveUp')) return [say(line('guess.out', {n: I18N.num(p.n)}))];
        const ws = tx('chat.guess.words').split('|');
        let g = parseInt((n.match(/ (\d+) /) || [])[1], 10);
        if(isNaN(g)){ const i = ws.findIndex(w => n.indexOf(' ' + w + ' ') >= 0); if(i >= 0) g = i + 1; }
        if(isNaN(g) || g < 1 || g > 10){ if(words(n).length > 4) return null; pending = p; return [say(line('guess.notNum'))]; }
        if(g === p.n) return [say(line('guess.right', {n: I18N.num(p.n)}), {mood: 'happy', chips: chips('guess', 'riddle')})];
        if(p.tries >= 2) return [say(line('guess.out', {n: I18N.num(p.n)}), {chips: chips('guess', 'play')})];
        pending = {kind: 'guess', n: p.n, tries: p.tries + 1};
        return [say(line(g < p.n ? 'guess.higher' : 'guess.lower'))];
      }
      case 'wyr': {
        const sig = o => words(norm(o)).filter(x => x.length > 3 && !STOP.has(x));
        const hitA = sig(p.a).some(w => n.indexOf(' ' + w) >= 0) || rx(tx('chat.wyr.first')).test(n);
        const hitB = sig(p.b).some(w => n.indexOf(' ' + w) >= 0) || rx(tx('chat.wyr.second')).test(n);
        if(/ both /.test(n)) return [say(line('wyr.both'), {chips: chips('wyr', 'play')})];
        if(/ neither | none /.test(n)) return [say(line('wyr.neither'), {chips: chips('wyr', 'play')})];
        if(hitA === hitB){ if(words(n).length > 6) return null; pending = p; return [say(line('wyr.unclear', {a: p.a, b: p.b}), {chips: [cap(p.a), cap(p.b)]})]; }
        const pick1 = hitA ? p.a : p.b, other = hitA ? p.b : p.a;
        return [say(line(Math.random() < .5 ? 'wyr.same' : 'wyr.other', {pick: pick1, other}), {mood: 'happy', chips: chips('wyr', 'play')})];
      }
      case 'todo': if(yes) return addTodo(p.text); if(no) return [say(line('todo.no'))]; return null;
      case 'todoText': if(no) return [say(line('todo.no'))]; return addTodo(todoText(raw));
      case 'mark': {
        if(yes || hears(n, 'done')){ const c = H.cells().find(x => x.id === p.id); return c ? [markWin(c)] : null; }
        if(no) return [say(line('win.later'))];
        return null;
      }
      case 'idea': {
        if(hears(n, 'done') || (yes && words(n).length <= 3)){ const c = H.cells().find(x => x.id === p.id); return c ? [markWin(c)] : null; }
        if(hears(n, 'idea') || / another | something else | other /.test(n)) return idea();
        return null;
      }
      case 'ideaOffer': if(yes) return idea(); if(no) return [say(line('fallback.no'), {chips: chips('how', 'joke')})]; return null;
      case 'moodHelp': {
        if(yes) return [say(line('comfort', {idea: pick(I18N.list('chat.comfortIdeas'))}), {chips: chips('okay', 'idea')})];
        if(no) return [say(line('comfortNo'))];
        return null;
      }
      case 'gratitude': {
        if((words(n).length < 2 && !yes) || cellFor(n) || looksLikeIntent(n)) return null;
        pending = {kind: 'journal', text: raw.trim().slice(0, 240)};
        return [say(line('gratitudeGot'), {mood: 'happy', chips: chips('yes', 'no')})];
      }
      case 'journal': if(yes){ H.journal(p.text); return [say(line('gratitudeSaved'), {mood: 'happy'})]; } if(no) return [say(line('fallback.no'))]; return null;
    }
    return null;
  }

  /* ---- one message in, one or two answers out ---- */
  function hear(raw){
    raw = String(raw || '').trim().slice(0, 400);
    if(!raw) return [];
    const n = norm(raw), w = words(n), c = H.ctx();
    mem.turns++;
    // safety comes first, always: a fixed, caring answer that points to real help
    if(hears(n, 'crisis')){ pending = null; mem.care = Date.now(); save(); return [say(tx('chat.crisis'), {link: true, mood: 'care'})]; }
    if(pending){ const r = answerPending(n, raw); if(r) return r; }
    // right after a hard moment, small answers get a gentle check-in instead of cheer
    if(Date.now() - mem.care < 15 * 60e3 && w.length <= 2 && !hears(n, 'bye') && !hears(n, 'thanks')) return [say(line('careAfter'), {mood: 'care'})];
    if(n === lastIn && w.length > 1) return [say(line('fallback.repeat'))];
    lastIn = n;
    if(!w.length) return [say(line('fallback.gibberish'))];
    // a greeting in front of something else: answer the rest, with a hello
    let hello = '';
    if(hears(n, 'greet') && w.length > 2){ const rest = n.replace(rx(tx('chat.hear.greet')), ' '); if(words(rest).length >= 2){ hello = line('greet'); } }
    const out = understand(n, raw, c);
    if(hello && out.length && out[0].text.indexOf(hello) !== 0) out[0].text = hello + ' ' + out[0].text;
    // now and then, a little nudge of its own (never after a hard moment)
    petTurns++;
    const calm = Date.now() - mem.care > 15 * 60e3;
    if(calm && !pending && out.length === 1 && petTurns % 5 === 0){
      if(!c.name && !mem.askedName){ mem.askedName = true; pending = {kind: 'name'}; out.push(say(line('nudge.name'))); }
      else if(!c.wins && mem.ideaDay !== c.today){ mem.ideaDay = c.today; pending = {kind: 'ideaOffer'}; out.push(say(line('nudge.idea'), {chips: chips('yes', 'no')})); }
      else if(mem.likes.length && mem.turns - (mem.likeAt || -99) > 25){ mem.likeAt = mem.turns; out.push(say(line('fallback.like', {like: pick(mem.likes)}))); }
      else if(!mem.gratitudeDay || mem.gratitudeDay !== c.today){ mem.gratitudeDay = c.today; pending = {kind: 'gratitude'}; out.push(say(line('gratitudeAsk'))); }
    }
    save();
    return out;
  }

  function understand(n, raw, c){
    const w = words(n);
    // to-dos: "remind me to…", "add a to-do: …"
    const lead = n.match(/ (?:remind me to|don't let me forget to|dont let me forget to|add (?:a )?(?:to do|todo|task|reminder)(?: to| for| that)?|new (?:to do|todo|task)) (.+)/) || n.match(/^ (?:to do|todo) (.+)/);
    if(lead){ const i = raw.toLowerCase().indexOf(lead[1].trim().split(' ')[0]); return addTodo(todoText(i >= 0 ? raw.slice(i) : lead[1])); }
    if(hears(n, 'todoAdd')) return addTodo('');
    // "my name is…"
    const nm = raw.match(/(?:my name is|my name's|call me|i'm called|i am called|you can call me)\s+([\p{L}][\p{L}'’-]{0,15})/iu);
    if(nm && !STOP.has(nm[1].toLowerCase())){ const name = cap(nm[1]); H.setName(name); return [say(line('nameSet', {name}), {mood: 'happy'})]; }
    // a win done, or planned
    let askCell = null;
    const opinion = / i (?:really |totally |just |so )?(?:like|love|hate|enjoy|adore|prefer|dislike) /.test(n) || /\?\s*$/.test(raw);
    const cell = opinion ? null : cellFor(n);
    if(cell){
      if(/ (?:didn't|did not|haven't|have not|forgot to|couldn't|could not|never) /.test(n)) return [say(line('win.notYet'), {chips: chips('idea')})];
      if(NEG.test(n)){
        const m = n.match(/ (?:need to|have to|want to|going to|got to|should|will|plan to|hope to|try to|must|i'll) (.+)/);
        const x = todoText(m ? m[1] : cell.label);
        pending = {kind: 'todo', text: x};
        return [say(line('win.plan', {x}), {chips: chips('yes', 'no')})];
      }
      if(PAST.test(n) || w.length <= 4) return [markWin(cell)];
      askCell = cell;   // not sure it was done: ask, unless something else fits better
    }
    // plans that aren't a cell: "I need to…" → offer a to-do
    const plan = n.match(/ i (?:need to|have to|got to|should|must|want to|am going to|i'm going to) (.{6,})/) || n.match(/ i'm going to (.{6,})/);
    if(plan && !hears(n, 'crisis')){ const x = todoText(plan[1]); pending = {kind: 'todo', text: x}; return [say(line('win.plan', {x}), {chips: chips('yes', 'no')})]; }
    // the pet itself
    if(hears(n, 'hug')) return act('pet');
    if(hears(n, 'feed') && !hears(n, 'favQ')) return act('meal');
    if(hears(n, 'clean')) return act('clean');
    if(/ (?:take|have|need) (?:your |some )?medicine | medicine /.test(n)) return act('medicine');
    // feelings (about the speaker, or a one-word answer)
    const aboutMe = / (?:i'm|i am|i feel|feeling|i've been|i was|i felt|so|very|really|kinda|kind of|a bit|pretty|super) /.test(n) || w.length <= 3;
    if(aboutMe && !hears(n, 'bye') && !hears(n, 'thanks') && !(hears(n, 'greet') && w.length <= 2)){
      const neg = n.match(/ not (?:very |that |so |too )?(sad|tired|stressed|angry|lonely|sick|bored|upset|worried) /);
      if(neg) return [say(line('mood.notBad'), {mood: 'happy'})];
      if(/ not (?:too |that )?bad | so so /.test(n)){ mem.mood = {k: 'okay', t: Date.now()}; return [say(line('mood.okay'))]; }
      for(const k of ['sad', 'lonely', 'tired', 'stressed', 'angry', 'sick', 'bored', 'happy', 'okay']){
        if(!hears(n, 'mood_' + k)) continue;
        if((k === 'happy' || k === 'okay') && hears(n, 'howAreYou')){ mem.mood = {k, t: Date.now()}; return [say(line('howAreYouToo'), {mood: 'happy', chips: chips('idea', 'joke')})]; }
        if((k === 'happy' || k === 'okay') && hears(n, 'greet')) break;
        mem.mood = {k, t: Date.now()};
        const r = [say(line('mood.' + k), {mood: k === 'happy' || k === 'okay' ? 'happy' : 'care'})];
        if(['sad', 'tired', 'stressed', 'lonely', 'angry'].indexOf(k) >= 0){ pending = {kind: 'moodHelp'}; r.push(say(line('moodHelp'), {chips: chips('yes', 'no')})); }
        if(k === 'bored') r[0].chips = chips('rps', 'riddle', 'story');
        return r;
      }
    }
    // things they like
    const fav = n.match(/ my fav(?:ou?rite)? (\w+) is (.+?) $/);
    if(fav){ mem.fav[fav[1]] = fav[2].trim(); save(); return [say(line('favSaved', {kind: fav[1], x: fav[2].trim()}), {mood: 'happy'})]; }
    const like = n.match(/ i (?:really |totally |just |so )?(?:like|love|adore|enjoy)(?: to)? (.+?) $/);
    if(like && !/^(you|it|that|this|them|him|her|puchi|chika)( |$)/.test(like[1])){
      const x = words(like[1]).slice(0, 4).join(' ').replace(/ (so much|a lot|very much)$/, '');
      if(mem.likes.indexOf(x) < 0){ mem.likes.push(x); if(mem.likes.length > 12) mem.likes.shift(); }
      save();
      return [say(line('likeSaved', {x}), {mood: 'happy'})];
    }
    if(hears(n, 'recall')){
      if(mem.likes.length) return [say(line('recall', {likes: I18N.joinList(mem.likes.slice(-3))}))];
      return [say(c.name ? line('recallName') : line('recallNone'))];
    }
    // play
    if(hears(n, 'rps')){ pending = {kind: 'rps'}; return [say(line('rps.ask'), {chips: chips('rock', 'paper', 'scissors')})]; }
    if(hears(n, 'wyr')) return wyr();
    if(hears(n, 'riddle')) return riddle();
    if(hears(n, 'guess')){ pending = {kind: 'guess', n: 1 + Math.floor(Math.random() * 10), tries: 0}; return [say(line('guess.ask'))]; }
    if(hears(n, 'joke')) return [say(line('joke'), {mood: 'happy', chips: chips('joke', 'riddle')})];
    if(hears(n, 'laugh')) return [say(line('laugh'), {mood: 'happy'})];
    if(hears(n, 'story')) return story();
    if(hears(n, 'fact')) return [say(line('fact'), {chips: chips('fact', 'joke')})];
    if(hears(n, 'sing')){ H.sing(); return [say(line('sing'), {mood: 'sing'})]; }
    if(hears(n, 'game')) return [say(line('game'), {chips: chips('rps', 'riddle', 'guess', 'wyr')})];
    // help with the day
    if(hears(n, 'idea')) return idea();
    if(hears(n, 'stats')) return stats();
    if(hears(n, 'todoList')){
      if(!c.todos.length) return [say(line('todo.none'), {chips: chips('todo')})];
      return [say(line('todo.some', {n: txn('units.todo', c.todos.length), list: I18N.joinList(c.todos.slice(0, 3).map(t => '“' + t + '”'))}))];
    }
    // about the pet and the world
    if(hears(n, 'areYouAi')) return [say(line('areYouAi'))];
    if(hears(n, 'howAreYou')){
      const s = c.petState, k = s.sick ? 'sick' : s.asleep ? 'sleepy' : s.hungry ? 'hungry' : s.happy <= 1 ? 'sad' : s.happy >= 3 ? 'great' : 'fine';
      return [say(line('howAreYou.' + k), {mood: k === 'great' || k === 'fine' ? 'happy' : null})];
    }
    if(hears(n, 'needs')){ const need = H.needs(); return [say(need || line('needsNone'))]; }
    if(hears(n, 'whoAreYou')) return [say(line('whoAreYou'))];
    if(hears(n, 'age')) return [say(c.ageDays ? line('age', {age: txn('units.day', c.ageDays)}) : line('ageNew'))];
    if(hears(n, 'place')) return [say(line('place'))];
    if(hears(n, 'maker')) return [say(line('maker'))];
    if(hears(n, 'dream')) return [say(line('dream'))];
    if(hears(n, 'meaning')) return [say(line('meaning'))];
    if(hears(n, 'time')) return [say(line('time', {time: I18N.date(new Date(), {hour: 'numeric', minute: '2-digit'}), date: I18N.date(new Date(), {weekday: 'long', month: 'long', day: 'numeric'})}))];
    if(hears(n, 'weather')) return [say(line('weather', {sky: tx(c.night ? 'chat.skyNight' : 'chat.skyDay')}))];
    if(hears(n, 'favQ')) return [say(line('favQ'))];
    if(hears(n, 'likeQ')){
      const m = n.match(/ (?:do you |you )(?:like|love|enjoy) (.+?) $/), x = m ? words(m[1]).slice(0, 3).join(' ') : '';
      if(x){ const yesList = / (?:sun|sunshine|flower|flowers|water|win|wins|star|stars|music|song|songs|cake|snack|snacks|me|hug|hugs|cuddle|cuddles|game|games|chika|puchi|rain|nap|naps|strawberr\w*|milk|moon|night|cats?|dogs?|bunn\w*|frogs?|bears?) /.test(' ' + x + ' '); return [say(line(yesList ? 'likeYes' : 'likeNo', {x}), {mood: yesList ? 'happy' : null})]; }
    }
    if(hears(n, 'chika')) return [say(line(c.persona === 'c' ? 'aboutChika' : 'aboutChika'))];
    if(hears(n, 'puchi')) return [say(line(c.persona === 'c' ? 'aboutPuchi' : 'aboutPuchi'))];
    if(hears(n, 'appCell')) return [say(line('appCell'))];
    if(hears(n, 'appCustom')) return [say(line('appCustom'))];
    if(hears(n, 'appNotebook')) return [say(line('appNotebook'), {chips: chips('todo')})];
    if(hears(n, 'appStars')) return [say(line('appStars'))];
    if(hears(n, 'store')) return [say(line('store'))];
    if(hears(n, 'help')) return [say(line('help'), {chips: chips('idea', 'joke', 'play', 'todo')})];
    if(hears(n, 'whatDoing')) return [say(c.night ? line('whatDoingNight') : line('whatDoing'))];
    if(hears(n, 'love')) return [say(line('love'), {mood: 'love'})];
    if(hears(n, 'compliment')) return [say(line('compliment'), {mood: 'happy'})];
    if(hears(n, 'insult') && / (?:you|you're|youre|are|so) /.test(n)) return [say(line('insult'), {mood: 'sad'})];
    if(askCell){ pending = {kind: 'mark', id: askCell.id}; return [say(line('win.ask', {cell: askCell.label}), {chips: chips('yes', 'no')})]; }
    if(hears(n, 'thanks')) return [say(line('thanks'), {mood: 'happy'})];
    if(hears(n, 'sorry')) return [say(line('sorry'))];
    if(hears(n, 'bye')) return [say(c.night ? line('byeNight') : line('bye'), {mood: 'happy'})];
    if(hears(n, 'greet')) return [say(line('greet'), {mood: 'happy', chips: chips('how', 'idea', 'joke')})];
    if(Date.now() - mem.care < 15 * 60e3) return [say(line('careAfter'))];
    // nothing matched: answer in a way that still listens
    if(hears(n, 'yes') && w.length <= 2) return [say(line('fallback.yes'))];
    if(hears(n, 'no') && w.length <= 2) return [say(line('fallback.no'))];
    if(raw.length > 6 && raw === raw.toUpperCase() && /[A-Z]{4}/.test(raw)) return [say(line('fallback.caps'))];
    if(raw.length > 220) return [say(line('fallback.long'))];
    if(w.length === 1 && w[0].length > 3 && (!/[aeiouy]/.test(w[0]) || /[bcdfghjklmnpqrstvwxz]{4,}/.test(w[0]))) return [say(line('fallback.gibberish'))];
    const feel = n.match(/ i (?:feel|am feeling|'m feeling|'m|am) (?:so |very |really |a bit |kinda )?([a-z]{3,})(?: |$)/);
    if(feel && !STOP.has(feel[1])) return [say(line('fallback.feel', {x: feel[1]}))];
    if(/^ because | cause | 'cause /.test(n)) return [say(line('fallback.because'))];
    if(/\?\s*$/.test(raw)) return [say(line('fallback.question'))];
    const topic = topicOf(n);
    if(topic && Math.random() < .75) return [say(line('fallback.topic', {topic}))];
    return [say(line('fallback.generic'))];
  }

  return {
    hear, welcome,
    log: () => mem.log,
    remember(who, text){ mem.log.push({w: who, t: text, p: persona(), at: Date.now()}); save(); },
    clear(){ mem.log = []; pending = null; save(); },
    pending: () => pending,
    memory: () => mem
  };
}

/* ---------- the Talk tab: chat bubbles, quick replies and a little portrait of the friend ----------
   The brain is makeTalk (talk.js); this gives it the facts of the day and the hands to act. */
function streakDays(){
  const d = new Date(); if(!dayCount(keyOf(d))) d.setDate(d.getDate() - 1);
  let n = 0; while(n < 3650 && dayCount(keyOf(d)) > 0){ n++; d.setDate(d.getDate() - 1); }
  return n;
}
const TalkUI = (function(){
  const T = makeTalk({
    ctx(){
      const xp = totalXp(), st = stageOf(xp), d = S.days[todayKey()] || {}, now = Date.now(), h = new Date().getHours(), s = S.pet;
      return {
        persona: CHAR === 'chika' ? 'c' : 'p', pet: petName(), name: hitap(), stage: STAGES[st].n,
        nextStage: STAGES[st + 1] ? STAGES[st + 1].n : '', left: STAGES[st + 1] ? STAGES[st + 1].xp - xp : 0,
        total: xp, wins: dayCount(todayKey()), streak: streakDays(), today: todayKey(),
        done: visibleDefs().filter(c => cnt(d[c.id]) > 0).map(c => ({id: c.id, label: c.label})),
        todos: S.todos.filter(t => !t.done).map(t => t.text),
        place: tx('bgs.' + BG + '.name'), hour: h, night: h < 6 || h >= 20, asleep: PetCore.asleep(now),
        petState: {sick: !!(s && s.sick), asleep: PetCore.asleep(now), hungry: !!(s && s.hunger <= 1), happy: s ? s.happy : 3},
        ageDays: s ? PetCore.age(s, now) : 0
      };
    },
    cells(){ const d = S.days[todayKey()] || {}; return visibleDefs().map(c => ({id: c.id, label: c.label, max: c.max || 1, have: cnt(d[c.id])})); },
    // a win from the chat goes on today's board, exactly as if the cell was tapped
    mark(id){ if(sel !== todayKey()){ sel = todayKey(); weekStart = mondayOf(sel); } toggle(id); return {have: cnt((S.days[todayKey()] || {})[id])}; },
    addTodo(text){
      if(!S.ready || S.todos.length >= 300) return false;
      S.todos.push({id: 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), text, done: false, at: new Date().toISOString(), doneAt: ''});
      queueTodos(); renderTodos(); return true;
    },
    setName(n){ S.settings.userName = n; saveSettings(); renderAll(); },
    act(kind){ return S.ready ? Tama.act(kind) : null; },
    needs(){ const c = Tama.needs(); return c.length ? c.slice(0, 2).map(Tama.needMsg).join(' ') : ''; },
    journal(text){
      const k = todayKey(), cur = S.journal[k], add = '♡ ' + text;
      S.journal[k] = {text: cur && cur.text && cur.text.trim() ? cur.text.replace(/\s+$/, '') + '\n' + add : add, updatedAt: new Date().toISOString()};
      queueJournal(k);
    },
    sing(){ anim = {kind: 'sing', until: Date.now() + 3600}; if(Sound.on) Sound.melody(); }
  });

  const log = $('#tkLog'), chipsEl = $('#tkChips'), input = $('#tkInput');
  let queue = [], busy = false, anim = null, talkUntil = 0, opened = false;
  const linkify = s => esc(s).replace(/findahelpline\.com/g, '<a href="https://findahelpline.com" target="_blank" rel="noopener">findahelpline.com</a>');
  function bubble(who, text, persona){
    const el = document.createElement('div');
    el.className = 'tk-msg ' + (who === 'u' ? 'me' : 'pet' + (persona === 'c' ? ' chika' : ''));
    el.innerHTML = '<div class="tk-b">' + (who === 'u' ? esc(text) : linkify(text)) + '</div>';
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }
  function setChips(list){
    if(!list || !list.length){
      list = [tx('chat.chips.how'), dayCount(todayKey()) ? tx('chat.chips.wins') : tx('chat.chips.water'), tx('chat.chips.idea'), tx('chat.chips.joke'), tx('chat.chips.play')];
    }
    chipsEl.innerHTML = list.map(t => '<button type="button" class="tk-chip">' + esc(t) + '</button>').join('');
  }
  function typing(on){
    let t = log.querySelector('.tk-typing');
    if(on && !t){ t = document.createElement('div'); t.className = 'tk-msg pet tk-typing' + (CHAR === 'chika' ? ' chika' : ''); t.setAttribute('aria-label', tx('chat.typing', {pet: petName()})); t.innerHTML = '<div class="tk-b"><i></i><i></i><i></i></div>'; log.appendChild(t); log.scrollTop = log.scrollHeight; }
    if(!on && t) t.remove();
  }
  // the friend's answers, one after another, each after a little "typing…"
  function pump(){
    if(busy || !queue.length) return;
    busy = true;
    const r = queue.shift();
    typing(true);
    const wait = reduced ? 250 : Math.max(650, Math.min(1700, 420 + r.text.length * 13));
    setTimeout(() => {
      typing(false);
      bubble('p', r.text, CHAR === 'chika' ? 'c' : 'p');
      T.remember('p', r.text);
      Sound.babble(r.text, 0);
      talkUntil = Date.now() + Math.min(2600, 300 + r.text.length * 35);
      if(r.mood) anim = {kind: r.mood, until: Date.now() + 2600};
      if(!queue.length) setChips(r.chips);
      header();
      requestAnimationFrame(() => { log.scrollTop = log.scrollHeight; });   // after the chips have taken their room
      busy = false; pump();
    }, wait);
  }
  function answer(list){ list.forEach(r => queue.push(r)); if(list.length) chipsEl.innerHTML = ''; pump(); }
  function send(text){
    text = String(text || '').trim(); if(!text || !S.ready) return;
    bubble('u', text); T.remember('u', text); Sound.tick();
    answer(T.hear(text));
  }
  function header(){
    $('#tkName').textContent = upper(petName());
    $('#tkStatus').textContent = tx('chat.status', {stage: STAGES[stageOf(totalXp())].n, wins: txn('units.win', dayCount(todayKey()))});
    $('#tkNote').textContent = tx('chat.note', {pet: petName()});
    input.placeholder = tx('chat.placeholder', {pet: petName()});
    $('#tkPortrait').setAttribute('data-egg', eggShown || 'classic');
  }
  let waiting = false;
  function open(){
    // the friend and the name are only known once the data has loaded
    if(!S.ready){ if(!waiting){ waiting = true; const w = () => { if(S.ready){ waiting = false; if(tab === 'talk') open(); } else setTimeout(w, 150); }; setTimeout(w, 150); } return; }
    header();
    if(!opened){
      opened = true;
      log.innerHTML = '';
      T.log().slice(-40).forEach(m => bubble(m.w === 'u' ? 'u' : 'p', m.t, m.p));
    }
    const last = T.log()[T.log().length - 1];
    if(!last || Date.now() - last.at > 30 * 60e3) answer(T.welcome());
    else setChips();
    if(!matchMedia('(hover: none)').matches) setTimeout(() => input.focus({preventScroll: true}), 50);
  }
  $('#tkForm').addEventListener('submit', e => { e.preventDefault(); const v = input.value; input.value = ''; send(v); });
  chipsEl.addEventListener('click', e => { const b = e.target.closest('.tk-chip'); if(!b) return; Sound.pop(); send(b.textContent); });
  $('#tkClear').addEventListener('click', () => { T.clear(); log.innerHTML = ''; queue = []; Sound.page(); answer(T.welcome()); });

  // the portrait: the friend in its own place, blinking, talking along with its bubbles
  const pcv = $('#tkPet');
  let F = 0;
  function frame(){
    F++;
    const now = Date.now(), s = S.pet, xp = totalXp(), stage = Pet.evo ? Pet.stage : stageOf(xp);
    const a = anim && now < anim.until ? anim.kind : null, talking = now < talkUntil;
    const asleep = PetCore.asleep(now) && !talking && !a;
    thumb(pcv, () => {
      const night = new Date().getHours() < 6 || new Date().getHours() >= 20;
      SCENE = bgScene(BG, night); drawBg(BG, F, night);
      PEN = bgById(BG).line; for(let x = 0; x < LW; x++) P(x, G);
      const st = {lift: 0, eyes: 'open', mouth: 'smile', cheeks: false, arms: 'down', look: 1, sway: (F >> 3) & 1, xoff: 0, step: 0, blink: false, wear: s ? s.wear : '', char: CHAR};
      if(asleep){ st.eyes = 'sleep'; st.mouth = 'sleep'; }
      if(a === 'happy'){ st.eyes = 'happy'; st.cheeks = true; st.lift = (F >> 1) & 1; st.arms = (F >> 2) & 1 ? 'up' : 'wave'; }
      if(a === 'love'){ st.eyes = 'happy'; st.cheeks = true; }
      if(a === 'sad' || a === 'care'){ st.mouth = a === 'sad' ? 'sad' : 'neutral'; }
      if(a === 'sing'){ st.eyes = 'happy'; st.mouth = (F >> 1) & 1 ? 'open' : 'smile'; st.lift = (F >> 2) & 1; }
      if(talking) st.mouth = (F >> 1) & 1 ? 'open' : (st.mouth === 'sad' ? 'sad' : 'smile');
      if(!asleep && st.eyes === 'open' && F % 37 < 2) st.eyes = 'blink';
      drawPet(stage, st);
      PEN = C.RED;
      if(a === 'love'){ const k = F % 12; spr(HEART_S, 22 + (k >> 2), 12 - (k >> 1)); spr(HEART_S, 40 - (k >> 2), 14 - (k >> 1)); }
      if(a === 'sing'){ PEN = C.LILAC; P(24, 10 - ((F >> 1) % 6), 1); P(25, 10 - ((F >> 1) % 6), 1); P(40, 12 - (((F >> 1) + 3) % 6), 1); }
      if(asleep){ PEN = C.LILAC; spr(ZZ, 42, 10 - ((F >> 3) % 3)); }
    }, [16, 6, 32, 27]);
  }
  return {open, frame, send, header, brain: T};
})();

/* ---------- an app, not a page ----------
   A long press or a drag never starts a text selection, opens the browser's menu or drags an image around;
   fields you type in (and links) keep their usual behaviour. */
(function(){
  const elOf = t => t && t.nodeType === 3 ? t.parentElement : t;
  const typable = t => !!(t && t.closest && t.closest('input, textarea, select, [contenteditable="true"], .selectable'));
  document.addEventListener('selectstart', e => { if(!typable(elOf(e.target))) e.preventDefault(); });
  document.addEventListener('dragstart', e => { if(!typable(elOf(e.target))) e.preventDefault(); });
  document.addEventListener('contextmenu', e => { const t = elOf(e.target); if(!typable(t) && !(t && t.closest && t.closest('a[href]'))) e.preventDefault(); });
})();

const onThemeChange = () => renderModeBtn();
if(window.matchMedia){ const mq = matchMedia('(prefers-color-scheme: dark)'); if(mq.addEventListener) mq.addEventListener('change', onThemeChange); }
new MutationObserver(onThemeChange).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme','data-mode','data-skin','class','style']});
sizeCanvas();
if(window.ResizeObserver) new ResizeObserver(sizeCanvas).observe($('#lcdBtn')); else window.addEventListener('resize', sizeCanvas);
Pet.syncStage();

try { startTab = localStorage.getItem(TAB_KEY) || 'wins'; } catch(e){}
if(location.hash === '#notebook') startTab = 'notebook';
if(location.hash === '#store') startTab = 'store';
if(location.hash === '#talk') startTab = 'talk';

tick();
initStore();

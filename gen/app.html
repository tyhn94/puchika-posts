*{box-sizing:border-box}
body{background-color:var(--bg);background-image:var(--pattern);background-size:160px 160px;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button{font-family:inherit}
/* an app, not a document: holding a finger down never selects text, opens a callout menu, drags a picture
   ghost or flashes grey. Only the places you type in (and anything marked .selectable) keep those. */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea,select,[contenteditable="true"],.selectable{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img,svg,canvas{-webkit-user-drag:none;user-drag:none}
button,a,label,[role="tab"],.shell,.tab,.tk-chip,.sh-card,.egg-pick{touch-action:manipulation}
.shell,.shell *{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.app{max-width:1140px;margin:0 auto;padding-inline:16px;padding-block:24px 56px}

/* header */
/* header: the logo in the middle, the line under it, then the switches, all centred */
.top{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:26px;text-align:center}
/* the official logo (brand/puchika-logo.png); the build inlines web/logo.webp */
.top h1.logo{margin:0;line-height:0}
.top h1.logo img{display:block;margin:0 auto;width:clamp(190px,22vw,250px);height:auto;filter:drop-shadow(0 5px 10px var(--soft))}
.top-right{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.skins{display:inline-flex;align-items:center;gap:7px;padding:5px 10px 5px 13px;border-radius:999px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.skins .lbl{font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-right:1px}
.skin{width:24px;height:24px;border-radius:50%;border:2px solid var(--surface);padding:0;cursor:pointer;box-shadow:0 0 0 2px var(--line);transition:transform .12s,box-shadow .12s}
@media (hover:hover){.skin:hover{transform:scale(1.14)}}
.skin[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--ink);transform:scale(1.08)}
/* swatches show each theme's own colours, so they stay fixed in light and dark */
.skin.berry{background:linear-gradient(135deg,#ffc4d8 0 50%,#ff8fb8 50% 100%)}
.skin.matcha{background:linear-gradient(135deg,#ccf0d8 0 50%,#6cc596 50% 100%)}
.skin.soda{background:linear-gradient(135deg,#d2e0ff 0 50%,#8cadff 50% 100%)}
.skin.mocha{background:linear-gradient(135deg,#f0dccb 0 50%,#a8774f 50% 100%)}
.soundbtn{font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:999px;background:var(--pill);border:2px solid var(--pill-d);color:var(--ink);display:inline-flex;gap:7px;align-items:center;white-space:nowrap;cursor:pointer;box-shadow:0 3px 0 var(--pill-d)}
.soundbtn svg{width:16px;height:16px;flex:none}
.soundbtn .wave{transition:opacity .2s}
.soundbtn.off{background:var(--surface);border-color:var(--line);color:var(--ink-soft);box-shadow:0 3px 0 var(--line)}
.soundbtn.off .wave{opacity:0}
.soundbtn .x{opacity:0}
.soundbtn.off .x{opacity:1}
.modebtn .ico-moon{display:none}
.modebtn.night .ico-sun{display:none}
.modebtn.night .ico-moon{display:block}
.soundbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--pill-d)}
.top p{margin:6px 0 0;color:var(--ink-soft);font-weight:500;text-wrap:balance}
.sync{font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:999px;background:var(--surface);border:2px solid var(--line);color:var(--ink-soft);display:inline-flex;gap:8px;align-items:center;white-space:nowrap;box-shadow:0 4px 12px var(--soft)}
.acct-top{font-size:12.5px;font-weight:800;padding:7px 14px;border-radius:999px;background:var(--accent);border:2px solid var(--accent-strong);color:#fff;display:inline-flex;gap:7px;align-items:center;white-space:nowrap;cursor:pointer;box-shadow:0 3px 0 var(--accent-strong)}
.acct-top svg{width:15px;height:15px}
.acct-top.in{background:var(--pill);border-color:var(--pill-d);color:var(--ink);box-shadow:0 3px 0 var(--pill-d)}
.acct-top:active{transform:translateY(2px);box-shadow:none}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--ink-soft)}
.sync[data-s="ok"] i{background:var(--t3d)}
.sync[data-s="saving"] i{background:var(--t2d)}
.sync[data-s="err"] i{background:var(--danger)}

.layout{display:grid;grid-template-columns:minmax(280px,330px) minmax(0,1fr);gap:36px;align-items:start}
.pet-col{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:20px;min-width:0}
@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr);gap:28px}
  .pet-col{position:static;max-width:420px;width:100%;margin-inline:auto}
}

/* the device: a soft rounded square with a touch screen and one Back button */
.shell{position:relative;width:100%;max-width:300px;margin-inline:auto;padding:34px 24px 24px;border-radius:32% 32% 28% 28% / 24% 24% 21% 21%;background:radial-gradient(115% 72% at 30% 14%,var(--shell-hi) 0%,var(--shell) 46%,var(--shell-deep) 125%);box-shadow:0 8px 0 var(--shell-deep),0 22px 34px var(--shadow);display:flex;flex-direction:column;align-items:center;gap:12px}
.shell .tag{font-family:var(--f-pixel);font-weight:400;font-synthesis:none;font-size:13px;letter-spacing:2.5px;color:var(--shell-ink);margin-top:-12px}
.bezel{width:100%;padding:9px;border-radius:22px;background:var(--bezel);box-shadow:inset 0 2px 0 var(--hi),0 3px 0 var(--shell-deep)}
.lcd{background:var(--lcd);border-radius:12px;padding:6px;box-shadow:inset 0 2px 8px var(--lcd-shadow);border:0;width:100%}
.lcd canvas{display:block;image-rendering:pixelated}
.stage{width:100%;display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--f-pixel);font-synthesis:none;color:var(--shell-ink);padding-inline:4px}
.stage b{font-size:17px;font-weight:400}
.stage span{font-size:13px;font-variant-numeric:tabular-nums}
.xpbar{width:100%;height:10px;border-radius:6px;background:var(--bezel);box-shadow:inset 0 1px 3px var(--lcd-shadow);overflow:hidden;margin-top:-6px}
.xpbar i{display:block;height:100%;width:0;background:var(--leaf);transition:width .6s ease}
.btns{display:flex;justify-content:center;margin-top:0}
.dbtn{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:0;cursor:pointer;font-family:var(--f-pixel);font-synthesis:none;font-size:13px;color:var(--shell-ink)}
.dbtn i{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--hi) 0,transparent 42%),var(--btn);box-shadow:0 4px 0 var(--btn-deep);transition:transform .07s,box-shadow .07s}
.dbtn:active i{transform:translateY(3px);box-shadow:0 1px 0 var(--btn-deep)}
.dbtn.back i{width:60px;height:34px;border-radius:999px;background:radial-gradient(60% 70% at 32% 26%,var(--hi) 0,transparent 60%),var(--btn)}
.dbtn.back svg{width:19px;height:19px}
.stage .stars{margin-left:auto;margin-right:10px;display:inline-flex;align-items:center;gap:4px}
.stage .stars svg{width:11px;height:11px}
.pet-tools{display:flex;justify-content:center;margin-top:-6px}
.pet-tools .linkbtn{font-size:14px}
/* @tama-css */
.lcd{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:3px;width:100%;background:var(--lcd);box-shadow:inset 0 2px 8px var(--lcd-shadow)}
.ticons{display:flex;justify-content:space-between}
.ticon{flex:1;display:grid;place-items:center;height:var(--ticon-h,24px);padding:0;border:0;border-radius:7px;background:none;color:var(--lcd-ink);opacity:.26;cursor:pointer;transition:opacity .12s;-webkit-tap-highlight-color:transparent}
.ticon svg{display:block;width:var(--ticon-s,17px);height:var(--ticon-s,17px)}
.ticon:hover{opacity:.55}
.ticon.sel{opacity:1}
.ticon.alert{animation:tcall 1s steps(1) infinite}
@keyframes tcall{0%{opacity:1}50%{opacity:.18}}
.ticon:focus-visible{outline:2px solid var(--lcd-ink);outline-offset:-2px}
/* the screen is not positioned: menus open over the whole LCD (icons included) for room to write big; games sit on the screen itself */
.screen{width:fit-content;margin:0 auto;line-height:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.screen canvas{display:block;image-rendering:pixelated}
.lcd-ov{position:absolute;inset:0;z-index:2;border-radius:inherit;display:flex;flex-direction:column;gap:.12em;padding:.45em .6em;background:var(--lcd);color:var(--lcd-ink);font-family:var(--f-pixel);font-weight:400;font-synthesis:none;font-size:var(--ovfs,11px);line-height:1.1;text-align:left;overflow:hidden;cursor:default}
.lcd-ov[hidden]{display:none}
.lcd-ov .px{display:inline-block;width:.8em;height:.8em;vertical-align:-.05em}
.ov-h{display:flex;justify-content:space-between;align-items:center;gap:.4em;font-size:.9em;letter-spacing:.08em;opacity:.7}
.ov-row{display:flex;align-items:center;gap:.4em;width:100%;padding:.1em .3em;border:0;border-radius:.3em;background:none;color:inherit;font:inherit;line-height:1.15;text-align:left;cursor:pointer}
.ov-row .ov-cur{visibility:hidden;width:.5em}
.ov-row.cur{background:var(--lcd-ink);color:var(--lcd)}
.ov-row.cur .ov-cur{visibility:visible}
.ov-row.poor .ov-r{opacity:.55}
.ov-row .ov-r{margin-left:auto;white-space:nowrap}
.ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:.12em .3em}
.ov-grid .ov-row{gap:.25em;padding:.12em .2em}
.ov-grid .ov-cur{display:none}   /* no cursor in the two-column list: it is all touch, and the names need the room */
.ov-hearts{display:flex;gap:.35em}
.ov-hearts svg{width:1.45em;height:1.45em}
.ov-bar{display:flex;gap:.3em}
.ov-bar i{flex:1;height:.7em;border:1.5px solid currentColor;border-radius:2px}
.ov-bar i.on{background:currentColor}
.ov-kv{display:flex;justify-content:space-between}
.ov-kv b{font-weight:400}
.ov-big{font-size:1.6em}
.ov-big .px{width:.75em;height:.75em}
.ov-s{font-size:.9em;line-height:1.25;opacity:.85}
.lcd-ov.game{inset:auto;left:var(--scr-x,6px);top:var(--scr-y,33px);width:var(--scr-w,100%);height:var(--scr-h,100%);border-radius:0;background:none;justify-content:space-between;padding:.3em .45em}
.ov-gtop{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:.4em;font-size:.95em;pointer-events:none}
.ov-dots{display:flex;gap:.22em}
.ov-dots i{width:.55em;height:.55em;border:1.5px solid currentColor;border-radius:1px}
.ov-dots i.w{background:currentColor}
.ov-dots i.l{opacity:.35;background:currentColor}
.ov-g{position:absolute;top:0;bottom:0;width:50%;padding:0;border:0;background:none;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.ov-gl,.ov-gr{display:inline-flex;align-items:center;gap:.25em}
.ov-gr svg,.ov-gl svg{width:.9em;height:.9em}
.ov-time{display:block;width:4.5em;height:.55em;border:1.5px solid currentColor;border-radius:2px;overflow:hidden}
.ov-time i{display:block;height:100%;background:currentColor}
.ov-count{position:absolute;inset:0;display:grid;place-items:center;padding-bottom:.6em;font-size:2.4em;pointer-events:none}
.ov-count:empty{display:none}
.ov-g.l{left:0}.ov-g.r{right:0}
.ov-g.t,.ov-g.b{left:0;right:0;width:100%}.ov-g.t{bottom:50%}.ov-g.b{top:50%}
.ov-g.p1,.ov-g.p2,.ov-g.p3{width:33.34%}.ov-g.p1{left:0}.ov-g.p2{left:33.33%}.ov-g.p3{right:0}
.dbtn i{display:grid;place-items:center;color:var(--shell-ink)}
.dbtn{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
/* confetti and the card for big moments */
.kz-confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2147483000}
.kz-cheer{position:fixed;left:50%;top:40%;z-index:2147482000;width:max-content;max-width:calc(100vw - 32px);transform:translate(-50%,-50%);pointer-events:none}
.kz-cheer-in{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:220px;padding:16px 30px 18px;border:3px solid var(--accent,#ff8fb8);border-radius:30px;background:var(--surface,#fff);color:var(--ink,#5a3854);box-shadow:0 7px 0 var(--pill,#ffd6e6),0 24px 48px var(--soft,rgba(0,0,0,.18));text-align:center;animation:kzCheerIn .66s cubic-bezier(.18,.9,.32,1.3) both}
.kz-cheer.out .kz-cheer-in{animation:kzCheerOut .45s cubic-bezier(.5,0,.75,0) forwards}
.kz-cheer-star{width:46px;height:46px;color:var(--t2d,#f5c654);transform-origin:50% 55%;animation:kzSwing 1.5s ease-in-out .55s infinite}
.kz-cheer b{font-family:var(--f-display,inherit);font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.3px;color:var(--accent-strong,#d9508a)}
.kz-cheer small{font-size:15px;font-weight:700;color:var(--ink-soft,#a07c9a)}
.kz-cheer-pips{display:flex;gap:7px;margin-top:8px}
.kz-cheer-pips i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--pill,#ffe3ee);box-shadow:0 3px 0 var(--pill-d,#ff9fc3);font-size:15px;line-height:1;font-style:normal;animation:kzPip .46s cubic-bezier(.2,.9,.3,1.7) both}
.kz-cheer-pips i:nth-child(1){animation-delay:.32s}.kz-cheer-pips i:nth-child(2){animation-delay:.41s}.kz-cheer-pips i:nth-child(3){animation-delay:.5s}.kz-cheer-pips i:nth-child(4){animation-delay:.59s}.kz-cheer-pips i:nth-child(5){animation-delay:.68s}.kz-cheer-pips i:nth-child(6){animation-delay:.77s}.kz-cheer-pips i:nth-child(7){animation-delay:.86s}
@keyframes kzCheerIn{0%{opacity:0;transform:scale(.3) rotate(-10deg)}55%{opacity:1;transform:scale(1.12) rotate(2deg)}78%{transform:scale(.96) rotate(-1deg)}100%{transform:scale(1) rotate(0)}}
@keyframes kzCheerOut{to{opacity:0;transform:translateY(-28px) scale(.86)}}
@keyframes kzPip{0%{opacity:0;transform:scale(0) translateY(6px)}65%{opacity:1;transform:scale(1.35) translateY(-3px)}100%{opacity:1;transform:scale(1)}}
@keyframes kzSwing{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
.kz-shake{animation:kzShake .5s cubic-bezier(.36,.07,.19,.97) both}
@keyframes kzShake{10%,90%{transform:translate(-1px,1px)}20%,80%{transform:translate(3px,-1px)}30%,50%,70%{transform:translate(-5px,2px)}40%,60%{transform:translate(5px,-2px)}}
.cell.kz-glow::before{content:"";position:absolute;inset:-3px;border-radius:inherit;pointer-events:none;animation:kzGlow 1.5s ease-out both}
@keyframes kzGlow{0%{box-shadow:0 0 0 0 var(--tintd,#b29cef)}25%{box-shadow:0 0 0 9px color-mix(in srgb,var(--tintd,#b29cef) 55%,transparent)}100%{box-shadow:0 0 0 26px transparent}}
.cell.kz-glow .pip.on{animation:kzPip .42s cubic-bezier(.2,.9,.3,1.7) both}
.cell.kz-glow .pip.on:nth-child(2){animation-delay:.07s}.cell.kz-glow .pip.on:nth-child(3){animation-delay:.14s}.cell.kz-glow .pip.on:nth-child(4){animation-delay:.21s}.cell.kz-glow .pip.on:nth-child(5){animation-delay:.28s}
@media (max-width:420px){.kz-cheer b{font-size:26px}.kz-cheer-in{min-width:200px;padding:14px 22px 16px}}

/* @tama-css-end */

/* speech bubble */
.bubble{position:relative;background:var(--surface);border:2.5px solid var(--accent);border-radius:26px;padding:13px 18px 15px;box-shadow:0 6px 0 var(--pill),0 14px 26px var(--soft);min-height:88px}
.bubble::before{content:"";position:absolute;top:-12px;left:50%;width:20px;height:20px;background:var(--surface);border-left:2.5px solid var(--accent);border-top:2.5px solid var(--accent);border-top-left-radius:6px;transform:translateX(-50%) rotate(45deg)}
.bubble .who{font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:1px;color:var(--accent-strong)}
.bubble .who::after{content:" ♡";letter-spacing:0}
.bubble p{margin:2px 0 0;font-size:16px;line-height:1.5;font-weight:500;text-wrap:pretty}
.bubble.pop{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.95)}55%{transform:scale(1.03)}100%{transform:scale(1)}}

/* panels & forms */
.panel{background:var(--surface);border:2.5px solid var(--line);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:15px;box-shadow:0 12px 26px var(--soft)}
.panel h3{margin:0;font-family:var(--f-display);font-size:23px;font-weight:800}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.panel legend{font-weight:700;font-size:13.5px;color:var(--ink-soft);padding:0}
.panel fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.panel input[type="text"]{width:100%;font:inherit;font-size:16px;font-weight:500;padding:11px 16px;border-radius:999px;border:2.5px solid var(--line);background:var(--bg);color:var(--ink)}
.panel input[type="text"]:focus,.panel select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--glow)}
.panel select{width:100%;font:inherit;font-size:16px;font-weight:500;padding:11px 16px;border-radius:999px;border:2.5px solid var(--line);background:var(--bg);color:var(--ink)}
.note{margin:0;font-size:13px;color:var(--ink-soft)}
.pet-tools{gap:22px}
/* customize: friends, shells, places and stickers that open with wins */
.cz-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cz-head .ghost{padding:6px 16px}
/* the Customize panel opens with a bright banner (cool colours, next to the Store's warm ones) */
.panel.custom{border-color:color-mix(in srgb,#8f7cff 45%,var(--line));box-shadow:0 6px 0 color-mix(in srgb,#8f7cff 40%,var(--line)),0 16px 32px var(--soft)}
.custom .cz-head{position:relative;isolation:isolate;overflow:hidden;margin:-20px -20px 0;padding:18px 16px 18px 18px;border-radius:25.5px 25.5px 0 0;background:linear-gradient(120deg,#a77bff 0%,#6f9dff 52%,#3fcfa6 100%);color:#fff;box-shadow:inset 0 -4px 0 rgba(40,20,90,.14)}
.custom .cz-head::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 78% 22%,rgba(255,255,255,.9) 0 1.6px,transparent 2.4px),radial-gradient(circle at 64% 70%,rgba(255,255,255,.75) 0 1.3px,transparent 2px),radial-gradient(circle at 90% 62%,rgba(255,255,255,.8) 0 1.2px,transparent 2px),radial-gradient(circle at 52% 18%,rgba(255,255,255,.6) 0 1px,transparent 1.8px)}
.custom .cz-head::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.45) 48%,transparent 62%);transform:translateX(-130%);animation:ctaShine 4.2s ease-in-out infinite}
.cz-title{display:flex;align-items:center;gap:10px;min-width:0}
.cz-title > svg{flex:none;width:38px;height:38px;padding:6px;border-radius:14px;background:rgba(255,255,255,.22);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.cz-title svg path{fill:#fff}
.custom .cz-head h3{margin:0;color:#fff;font-size:26px;line-height:1.05;text-shadow:0 2px 0 rgba(40,20,90,.25)}
.cz-title small{display:block;margin-top:3px;font-size:12px;font-weight:700;line-height:1.3;color:rgba(255,255,255,.92)}
.custom .cz-head .ghost{flex:none;border:0;background:#fff;color:#6a4bd6;font-weight:800;box-shadow:0 3px 0 rgba(40,20,90,.25)}
.custom .cz-head .ghost:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(40,20,90,.25)}
/* the Customize link under the device is a little gradient pill too */
.pet-tools #btnCustomLink{display:inline-flex;align-items:center;padding:7px 16px;border-radius:999px;background:linear-gradient(120deg,#a77bff,#6f9dff 55%,#3fcfa6);color:#fff;text-decoration:none;font-family:var(--f-display);font-weight:800;box-shadow:0 3px 0 #5a46b8,0 8px 16px rgba(111,157,255,.35)}
.pet-tools #btnCustomLink:active{transform:translateY(2px);box-shadow:0 1px 0 #5a46b8}
.pet-tools #btnCustomLink.news::after{background:#fff;color:#6a4bd6}
.cz-tabs{display:flex;gap:2px;padding:4px;border-radius:999px;background:var(--bg)}
.cz-tab{position:relative;flex:1 1 auto;min-width:0;padding:7px 5px;border:0;border-radius:999px;background:none;color:var(--ink-soft);font:inherit;font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cz-tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 0 var(--line)}
.cz-tab.news::after{content:"";position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--accent-strong)}
.cz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px 6px}
.cz-grid.wide{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.egg-pick{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 2px 7px;border:0;border-radius:16px;background:none;color:var(--ink);font:inherit;cursor:pointer;transition:background-color .15s,transform .12s;-webkit-tap-highlight-color:transparent}
.egg-pick:hover{background:var(--soft)}
.egg-pick:active{transform:scale(.95)}
.egg-pick.sel{background:var(--pill);box-shadow:inset 0 0 0 2.5px var(--accent)}
.egg-mini.egg-skin{--u:.3px}
.egg-mini{position:relative;display:block;width:46px;height:54px;border-radius:32% 32% 28% 28% / 24% 24% 21% 21%;box-shadow:0 3px 0 var(--shell-deep),0 6px 10px var(--shadow)}
.egg-mini i{position:absolute;left:15%;right:15%;top:18%;height:38%;border-radius:5px;background:var(--lcd);box-shadow:0 0 0 2.5px var(--bezel)}
.egg-mini b{position:absolute;left:50%;bottom:13%;width:12px;height:6px;margin-left:-6px;border-radius:999px;background:var(--btn)}
.cz-thumb{display:block;width:88px;height:auto;aspect-ratio:64/36;border-radius:8px;image-rendering:pixelated;box-shadow:0 0 0 2.5px var(--bezel),0 3px 8px var(--shadow)}
.cz-thumb.char{width:64px;aspect-ratio:32/27}
.cz-sticker{display:block;width:46px;height:46px;filter:drop-shadow(0 1.5px 1.2px rgba(60,20,50,.28))}
.cz-sticker svg{display:block;width:100%;height:100%;overflow:visible}
.egg-pick .ep-n{font-size:11.5px;font-weight:800;line-height:1.1;text-align:center}
.egg-pick.locked .egg-mini,.egg-pick.locked .cz-thumb,.egg-pick.locked .cz-sticker{filter:grayscale(1) opacity(.42)}
.egg-pick.locked .ep-n{color:var(--ink-soft);font-weight:700}
.egg-pick .count{position:absolute;top:4px;left:6px;font-size:10.5px;font-weight:800;color:var(--accent-strong)}
.ep-lock{position:absolute;top:30px;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:2px;padding:2px 6px 2px 4px;border-radius:999px;background:var(--surface);box-shadow:0 1px 4px var(--soft);color:var(--ink);font-size:10.5px;font-weight:800;white-space:nowrap}
.ep-lock svg{width:10px;height:10px}
/* things from the store: a little bag instead of the lock */
.ep-lock.bag{top:4px;left:auto;right:4px;transform:none;background:linear-gradient(135deg,#ff6fa5,#ff9a62);color:#fff;padding:4px 6px;box-shadow:0 2px 6px rgba(255,95,158,.4)}
/* store items show in full colour, to tempt */
.egg-pick.paid .egg-mini,.egg-pick.paid .cz-thumb,.egg-pick.paid .cz-sticker{filter:none}
.egg-pick.paid .ep-n{color:var(--ink);font-weight:800}
.ep-lock.bag svg{width:12px;height:12px}
.ep-lock.stars{gap:3px}
.ep-lock.stars .px{width:10px;height:10px}
.egg-pick.fresh::after{content:attr(data-fresh);position:absolute;top:2px;right:2px;padding:1px 5px;border-radius:999px;background:var(--accent-strong);color:var(--on-accent);font-size:9.5px;font-weight:800}
.cz-stk{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
[data-custom].news::after{content:attr(data-news);display:inline-block;margin-left:6px;padding:2px 7px;border-radius:999px;background:var(--accent-strong);color:var(--on-accent);font-size:10.5px;font-weight:800;line-height:1.3;vertical-align:2px;white-space:nowrap;animation:newsPulse 1.6s ease-in-out infinite}
@keyframes newsPulse{50%{transform:scale(1.08)}}
/* stickers on the shell: above its surface, under the screen, the words and the button. What you see is the
   art layer, cut to the shell's own rounded shape, so a big sticker or one pushed to the edge never sticks out.
   On top of it, only while decorating, an invisible twin of every sticker takes the touches and carries the
   handles; the picked one shows a faint ghost of the part that is cut off. */
.shell > :not(.stk-layer):not(.stk-art){position:relative;z-index:1}
.stk-art{position:absolute;inset:0;z-index:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.stk-layer{position:absolute;inset:0;z-index:0;pointer-events:none;visibility:hidden}
.shell.decorating .stk-layer{visibility:visible}
.stk-layer .decal{filter:none}
.stk-layer .decal svg{opacity:0}
.stk-layer .decal.sel svg{opacity:.3}
.decal{position:absolute;width:15%;aspect-ratio:1;margin:0;padding:0;border:0;background:none;transform:translate(-50%,-50%) rotate(var(--r,0deg));filter:drop-shadow(0 1.5px 1.2px rgba(60,20,50,.3));pointer-events:none;touch-action:none;-webkit-user-select:none;user-select:none}
.decal svg,.cz-sticker svg{display:block;width:100%;height:100%;overflow:visible}
.decal .die *,.cz-sticker .die *{fill:#fff!important;stroke:#fff!important;stroke-width:5px!important;stroke-linejoin:round;stroke-linecap:round;opacity:1!important}
.decal .die .ln,.cz-sticker .die .ln{fill:none!important}
.shell.decorating > :not(.stk-layer){pointer-events:none}
/* while decorating the stickers come up front, so their edges and handles stay reachable; afterwards they tuck under the screen frame again */
.shell.decorating .stk-layer{z-index:2}
.shell.decorating .decal{pointer-events:auto;cursor:grab}
.shell.decorating .decal.drag{cursor:grabbing;filter:drop-shadow(0 6px 5px rgba(60,20,50,.35))}
.decal.sel::before{content:"";position:absolute;inset:-5px;border:2px dashed var(--accent-strong);border-radius:12px;pointer-events:none}
.decal-h{display:none;position:absolute;bottom:-12px;right:-12px;width:24px;height:24px;border-radius:50%;background:var(--accent-strong);color:var(--on-accent);box-shadow:0 1px 4px rgba(0,0,0,.25);font:800 15px/24px var(--f-body);font-style:normal;text-align:center;cursor:nwse-resize;touch-action:none}
.decal-h::after{content:"";position:absolute;inset:-10px}
.decal-x{display:none;position:absolute;top:-12px;right:-12px;width:24px;height:24px;border-radius:50%;background:var(--surface);color:var(--danger);box-shadow:0 1px 4px rgba(0,0,0,.25);font:800 15px/24px var(--f-body);font-style:normal;text-align:center;transform:rotate(calc(var(--r,0deg) * -1));cursor:pointer}
.decal-x::after{content:"";position:absolute;inset:-8px}
.shell.decorating .decal.sel .decal-x,.shell.decorating .decal.sel .decal-h{display:block}
.shell.decorating{box-shadow:0 0 0 4px var(--glow),0 8px 0 var(--shell-deep),0 22px 34px var(--shadow)}
.toggle{display:flex;align-items:center;gap:12px;cursor:pointer}
.toggle input{position:absolute;opacity:0;width:1px;height:1px}
.tg-track{flex:none;position:relative;width:48px;height:28px;border-radius:999px;background:var(--line);transition:background .15s}
.tg-track i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 2px 0 rgba(0,0,0,.12);transition:transform .18s}
.toggle input:checked + .tg-track{background:var(--accent-strong)}
.toggle input:checked + .tg-track i{transform:translateX(20px)}
.toggle input:focus-visible + .tg-track{box-shadow:0 0 0 4px var(--glow)}
.tg-text{display:flex;flex-direction:column;gap:1px}
.tg-text b{font-size:15px}
.tg-text small{font-size:12.5px;color:var(--ink-soft);font-weight:500}
.panel input[type="email"],.panel input[type="password"]{width:100%;font:inherit;font-size:16px;font-weight:500;padding:11px 16px;border-radius:999px;border:2.5px solid var(--line);background:var(--bg);color:var(--ink)}
.panel input[type="email"]:focus,.panel input[type="password"]:focus,.backup textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--glow)}
.auth-veil{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px 20px;overflow-y:auto;background:var(--bg);background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.auth-veil[hidden]{display:none}
.auth{width:100%;max-width:380px;text-align:center}
.auth h3{font-size:25px}
.auth .field{text-align:left}
.auth-art{display:grid;place-items:center;margin:-4px auto 0;width:64px;height:64px;border-radius:50%;background:var(--pill);font-size:32px;box-shadow:0 4px 0 var(--line)}
.auth .primary{width:100%;padding:13px 22px;font-size:16px}
.auth .primary:disabled{opacity:.6;cursor:wait}
.auth-msg{margin:0;min-height:1.3em;font-size:14px;font-weight:700;color:var(--danger)}
.auth-msg.good{color:var(--ink-soft)}
.auth-links{display:flex;justify-content:center;gap:8px 22px;flex-wrap:wrap;font-size:14px}
.auth-skip{background:none;border:0;padding:4px;color:var(--ink-soft);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.backup{border-top:2px dashed var(--line);padding-top:12px}
.backup summary{cursor:pointer;font-weight:800;font-size:14.5px;color:var(--ink-soft)}
.backup > :not(summary){margin-top:10px}
.backup textarea{width:100%;font:13px/1.4 ui-monospace,Menlo,monospace;padding:10px 12px;border-radius:16px;border:2.5px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.backup .actions{justify-content:flex-start;margin:6px 0}
.acct{justify-content:flex-start}
.migrate{margin-bottom:18px;padding:14px 18px;border-radius:24px;border:2.5px dashed var(--accent);background:var(--pill);display:flex;flex-direction:column;gap:10px}
.migrate p{margin:0;font-weight:700}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.primary{background:var(--accent-strong);color:var(--on-accent);border:0;padding:11px 22px;border-radius:999px;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 4px 0 var(--accent-shade);transition:transform .08s,box-shadow .08s}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-shade)}
.ghost{background:var(--surface);border:2.5px solid var(--line);color:var(--ink);padding:8px 16px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.ghost:hover{border-color:var(--accent)}
.emojis{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
.emo{height:42px;font-size:20px;border-radius:50%;border:2.5px solid var(--line);background:var(--bg);cursor:pointer;padding:0;color:var(--ink);aspect-ratio:1;max-width:100%;justify-self:center}
.emo[aria-pressed="true"]{border-color:var(--accent);background:var(--pill);box-shadow:0 0 0 3px var(--glow)}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--tintd);background:var(--tint);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:3px}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:40px;height:40px;border-radius:50%;border:2.5px solid var(--line);background:var(--bg);color:var(--accent-strong);font:800 22px var(--f-display);cursor:pointer;line-height:1}
.stepper output{font:800 26px var(--f-display);min-width:28px;text-align:center;font-variant-numeric:tabular-nums}

/* board */
.board{display:flex;flex-direction:column;gap:20px;min-width:0}
.dayhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.navbtn{width:44px;height:44px;flex:none;border-radius:50%;border:2.5px solid var(--line);background:var(--surface);font:800 22px var(--f-display);color:var(--accent-strong);box-shadow:0 4px 0 var(--line);cursor:pointer;display:grid;place-items:center;padding:0;line-height:1}
.navbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.navbtn:disabled{opacity:.35;cursor:default;transform:none}
.daytitle{min-width:0}
.daytitle h2{font-family:var(--f-display);font-weight:800;font-size:34px;margin:0;line-height:1}
.daytitle p{margin:4px 0 0;color:var(--ink-soft);font-weight:500}
.daycount{margin-left:auto;display:flex;align-items:baseline;gap:6px;padding:6px 18px 6px 16px;border-radius:999px;background:var(--pill);border:2.5px solid var(--pill-d);box-shadow:0 4px 0 var(--pill-d);position:relative}
.daycount::after{content:"✦";position:absolute;top:-10px;right:-6px;font-size:16px;color:var(--accent)}
.daycount b{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums}
.daycount span{font-weight:700;color:var(--ink-soft)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent-strong);text-decoration:underline wavy;text-underline-offset:5px;cursor:pointer;font-weight:700}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:14px}
.cell{--tint:var(--t3);--tintd:var(--t3d);position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-height:116px;padding:14px 14px 12px;border-radius:var(--r);background:var(--surface);border:2.5px solid var(--tint);box-shadow:0 5px 0 var(--tint),0 12px 22px var(--soft);color:var(--ink);font:inherit;text-align:left;cursor:pointer;transition:transform .1s,box-shadow .1s,background-color .25s,border-color .25s;min-width:0}
@media (hover:hover){button.cell:hover{transform:translateY(-2px)}}
button.cell:active{transform:translateY(3px);box-shadow:0 2px 0 var(--tint),0 4px 10px var(--soft)}
.cell.done{background:var(--tint);border-color:var(--tintd);box-shadow:0 5px 0 var(--tintd),0 12px 22px var(--soft)}
button.cell.done:active{box-shadow:0 2px 0 var(--tintd),0 4px 10px var(--soft)}
.cell.done::after{content:"✦";position:absolute;right:14px;bottom:10px;font-size:15px;line-height:1;color:var(--tintd)}
.cell.multi.done::after{content:none}
.cell.partial{border-color:var(--tintd)}
.cell .ic{font-size:22px;line-height:1;width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--tint);box-shadow:inset 0 -4px 0 var(--tintd);font-family:var(--f-body);font-weight:800;color:var(--ink)}
.cell.done .ic{background:var(--surface)}
.cell .lb{font-weight:700;font-size:15px;line-height:1.25;overflow-wrap:anywhere;padding-right:28px}
.cell .meta{margin-top:auto;font-size:12.5px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.cell.done .meta{color:var(--ink);background:var(--surface);padding:2px 10px;border-radius:999px}
.stamp{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--tintd);color:var(--on-accent);border:2.5px solid var(--surface);font-size:14px;line-height:1;box-shadow:0 3px 8px var(--soft);transform:scale(0) rotate(-12deg);transition:transform .2s}
.cell.done .stamp{transform:scale(1) rotate(-12deg)}
.cell.pop .stamp{animation:stampIn .5s ease}
.cell.pop{animation:cellPop .45s ease}
@keyframes stampIn{0%{transform:scale(0) rotate(-40deg)}60%{transform:scale(1.4) rotate(6deg)}100%{transform:scale(1) rotate(-12deg)}}
@keyframes cellPop{0%{transform:translateY(3px) scale(.98)}50%{transform:translateY(-4px) scale(1.02)}100%{transform:none}}
.cell.multi{padding:0;cursor:default}
.cell-main{display:flex;flex-direction:column;align-items:flex-start;gap:8px;width:100%;padding:14px 14px 4px;background:none;border:0;border-radius:var(--r) var(--r) 0 0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.cell-main .meta{margin-top:0}
.pips{display:flex;gap:4px;padding:4px 14px 14px;margin-top:auto;width:100%}
.pip{flex:1 1 0;min-width:0;max-width:30px;aspect-ratio:1;border-radius:50%;border:2.5px solid var(--tintd);background:var(--surface);font-size:11.5px;font-weight:800;color:var(--ink);cursor:pointer;padding:0;display:grid;place-items:center;line-height:1}
.pip.on{background:var(--tintd)}
.cell.add{border:2.5px dashed var(--accent);background:color-mix(in srgb,var(--surface) 55%,transparent);box-shadow:none;color:var(--accent-strong)}
.cell.add .ic{background:var(--pill);box-shadow:inset 0 -4px 0 var(--pill-d);color:var(--accent-strong);font-family:var(--f-display);font-size:26px}
.cell.add .meta{color:var(--ink-soft)}
.cell.edit{cursor:default}
.mini{margin-top:auto;font-weight:700;font-size:13px;padding:5px 14px;border-radius:999px;border:2px solid var(--pill-d);background:var(--pill);color:var(--ink);cursor:pointer}
.mini:hover{border-color:var(--danger);color:var(--danger)}
.grid.loading .cell{opacity:.55;pointer-events:none}
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.hiddenlist{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hiddenlist .lbl{color:var(--ink-soft);font-size:14px;font-weight:700}
.unhide{display:inline-flex;gap:6px;align-items:center;font-size:14px;font-weight:700;padding:6px 14px;border-radius:999px;border:2px dashed var(--accent);background:var(--surface);color:var(--ink);cursor:pointer}

/* history */
.history{display:flex;flex-direction:column;gap:16px;margin-top:16px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-h h2{font-family:var(--f-display);font-weight:800;font-size:30px;margin:0;line-height:1.1}
.sec-h h2::after{content:" ♡";color:var(--accent)}
.sec-h h3{font-family:var(--f-display);font-weight:800;font-size:21px;margin:0;line-height:1.1}
.sec-h .nav{display:flex;align-items:center;gap:8px}
.sec-h .nav span{font-size:14px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.navbtn.sm{width:36px;height:36px;font-size:18px;box-shadow:0 3px 0 var(--line)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}
.wday{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:22px;background:var(--surface);border:2.5px solid var(--line);min-height:156px;cursor:pointer;color:var(--ink);font:inherit;min-width:0;box-shadow:0 8px 18px var(--soft)}
.wday.today{border-color:var(--accent);background:color-mix(in srgb,var(--pill) 60%,var(--surface))}
.wday.sel{box-shadow:0 0 0 4px var(--glow),0 8px 18px var(--soft)}
.wday:disabled{opacity:.45;cursor:default;box-shadow:none}
.wday .wd{font-size:11.5px;font-weight:700;color:var(--ink-soft)}
.wday .dn{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1}
.wchips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.chip{--tint:var(--t3);font-size:14px;line-height:1;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;background:var(--tint);position:relative;font-weight:800}
.chip sup{position:absolute;right:-5px;top:-6px;font-size:9.5px;font-weight:800;background:var(--accent-strong);color:var(--on-accent);border-radius:999px;padding:1px 4px;line-height:1.2}
.wday .wc{margin-top:auto;font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--ink-soft)}
.weektotal{margin:0;color:var(--ink-soft);font-weight:500}
.hist-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1040px){.hist-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:480px){.wday{min-height:124px;border-radius:18px}.chip{width:21px;height:21px;font-size:12px}}
.card{background:var(--surface);border:2.5px solid var(--line);border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:0 12px 26px var(--soft)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .h{font-size:11px;font-weight:700;color:var(--ink-soft);text-align:center;padding-bottom:2px}
.cd{aspect-ratio:1;max-width:100%;border-radius:50%;border:0;background:var(--bg);font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0;font-variant-numeric:tabular-nums}
.cd.l1{background:color-mix(in srgb,var(--accent) 22%,var(--surface))}
.cd.l2{background:color-mix(in srgb,var(--accent) 42%,var(--surface))}
.cd.l3{background:color-mix(in srgb,var(--accent) 66%,var(--surface))}
.cd.l4{background:var(--accent-strong);color:var(--on-accent)}
.cd.today{outline:2.5px solid var(--ink);outline-offset:-2.5px}
.cd.sel{box-shadow:0 0 0 3px var(--accent)}
.cd:disabled{opacity:.35;cursor:default}
.cd.blank{visibility:hidden}
.legend{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--ink-soft)}
.legend i{width:14px;height:14px;border-radius:50%;display:inline-block;background:var(--bg)}
.legend i.l1{background:color-mix(in srgb,var(--accent) 22%,var(--surface))}
.legend i.l2{background:color-mix(in srgb,var(--accent) 42%,var(--surface))}
.legend i.l3{background:color-mix(in srgb,var(--accent) 66%,var(--surface))}
.legend i.l4{background:var(--accent-strong)}
.monthsum{margin:0;color:var(--ink-soft);font-size:14px;font-weight:500}
.tot{display:flex;flex-direction:column;gap:11px}
.trow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:5px 10px;align-items:center}
.trow .ti{width:34px;height:34px;border-radius:50%;background:var(--tint);box-shadow:inset 0 -3px 0 var(--tintd);display:grid;place-items:center;font-size:16px;grid-row:span 2;font-weight:800}
.trow .tl{font-size:14px;font-weight:700;overflow-wrap:anywhere}
.trow .tn{font-family:var(--f-display);font-weight:800;font-size:20px;grid-row:span 2;font-variant-numeric:tabular-nums}
.trow .bar{height:10px;border-radius:999px;background:var(--bg);overflow:hidden}
.trow .bar i{display:block;height:100%;border-radius:999px;background:repeating-linear-gradient(-45deg,var(--tintd) 0 6px,color-mix(in srgb,var(--tintd) 62%,var(--surface)) 6px 12px)}
.trow.zero{opacity:.5}
/* day/night group with the automatic switch */
.modegroup{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.modegroup .modebtn{box-shadow:none}
.autobtn{display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 7px;border-radius:999px;border:0;background:transparent;color:var(--ink-soft);font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.autobtn .track{position:relative;width:32px;height:19px;border-radius:999px;background:var(--line);transition:background-color .2s;flex:none}
.autobtn .track::after{content:"";position:absolute;top:2.5px;left:2.5px;width:14px;height:14px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px var(--soft);transition:transform .2s}
.autobtn[aria-checked="true"]{color:var(--ink)}
.autobtn[aria-checked="true"] .track{background:var(--accent-strong)}
.autobtn[aria-checked="true"] .track::after{transform:translateX(13px)}

/* ---------- the store and the customize calls, right under the logo ---------- */
.top-cta{display:flex;gap:12px;justify-content:center;align-items:stretch;flex-wrap:wrap;width:100%}
.cta-store{position:relative;isolation:isolate;overflow:hidden;display:inline-flex;align-items:center;gap:10px;padding:11px 12px 11px 20px;border:0;border-radius:999px;background:linear-gradient(135deg,#ff5f9e 0%,#ff8a6a 52%,#ffc23d 100%);color:#fff;font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1;letter-spacing:.2px;cursor:pointer;box-shadow:0 5px 0 #c8457a,0 14px 30px rgba(255,95,158,.45);text-shadow:0 1.5px 0 rgba(150,35,80,.4);transition:transform .12s,box-shadow .12s;-webkit-tap-highlight-color:transparent}
.cta-store > svg.bag{width:27px;height:27px;flex:none;filter:drop-shadow(0 1.5px 0 rgba(150,35,80,.4))}
.cta-store::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.6) 48%,transparent 62%);transform:translateX(-130%);animation:ctaShine 3.4s ease-in-out infinite}
.cta-store::after{content:"";position:absolute;inset:-6px;z-index:-2;border-radius:inherit;box-shadow:0 0 0 0 rgba(255,95,158,.5);animation:ctaPulse 2.4s ease-out infinite}
@media (hover:hover){.cta-store:hover{transform:translateY(-2px) scale(1.035);box-shadow:0 7px 0 #c8457a,0 18px 34px rgba(255,95,158,.5)}}
.cta-store:active{transform:translateY(4px);box-shadow:0 1px 0 #c8457a,0 6px 14px rgba(255,95,158,.4)}
.pts-chip{display:inline-flex;align-items:center;gap:5px;padding:6px 11px 6px 6px;border-radius:999px;background:#fffdf7;color:#b23a6c;font-family:var(--f-body);font-size:15px;font-weight:800;line-height:1;text-shadow:none;box-shadow:inset 0 -2px 0 rgba(200,69,122,.18)}
.pts-chip .coin{width:21px;height:21px;flex:none}
.cta-custom{display:inline-flex;align-items:center;gap:9px;padding:11px 20px;border-radius:999px;border:2.5px solid var(--accent);background:var(--surface);color:var(--accent-strong);font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1;cursor:pointer;box-shadow:0 5px 0 var(--accent),0 12px 24px var(--soft);transition:transform .12s,box-shadow .12s;-webkit-tap-highlight-color:transparent}
.cta-custom svg{width:24px;height:24px;flex:none}
@media (hover:hover){.cta-custom:hover{transform:translateY(-2px)}}
.cta-custom:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent)}
.cta-custom.news::after{font-family:var(--f-body)}
@keyframes ctaShine{0%,50%{transform:translateX(-130%)}78%,100%{transform:translateX(130%)}}
@keyframes ctaPulse{0%{box-shadow:0 0 0 0 rgba(255,95,158,.45)}70%,100%{box-shadow:0 0 0 14px rgba(255,95,158,0)}}
@media (max-width:520px){
  .top-cta{gap:10px}
  .top-cta > button{flex:1 1 0;justify-content:center;min-width:0}
  .cta-store{font-size:19px;padding:10px 8px 10px 14px;gap:7px}
  .cta-store > svg.bag{width:23px;height:23px}
  .pts-chip{font-size:13.5px;padding:5px 8px 5px 5px}
  .pts-chip .coin{width:18px;height:18px}
  .cta-custom{font-size:17px;padding:10px 12px}
  .cta-custom svg{width:21px;height:21px}
}
/* the Store tab stands out from the others */
.tab.tab-store{color:var(--accent-strong)}
.tab.tab-store svg{color:#ff7a8a}

.nb-page:focus-within{box-shadow:0 5px 0 var(--line),0 9px 0 var(--paper),0 11px 0 var(--line),0 24px 36px var(--soft),0 0 0 4px var(--glow)}
.nb-page::before{content:"";position:absolute;top:0;bottom:0;left:50px;width:2px;background:var(--margin)}
.nb-holes{position:absolute;top:22px;bottom:22px;left:13px;width:22px;background:radial-gradient(circle at 11px 17px,var(--bg) 6.5px,var(--line) 7px,transparent 8.5px) 0 0/22px var(--lh) repeat-y}
.nb-tape{position:absolute;top:-13px;left:50%;width:124px;height:28px;transform:translateX(-50%) rotate(-3deg);border-radius:3px;background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--accent) 58%,transparent) 0 8px,color-mix(in srgb,var(--accent) 34%,transparent) 8px 16px)}
.nb-date{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-height:var(--lh);margin-bottom:2px;font-family:var(--f-hand)}
.nb-date b{font-weight:400;font-size:29px;line-height:1.1;color:var(--accent-strong)}
.nb-date span{font-size:19px;color:var(--ink-soft)}
.nb-text{display:block;width:100%;min-height:calc(var(--lh) * 12);margin:0;padding:0;border:0;outline:none;resize:none;overflow:hidden;background-color:transparent;background-image:linear-gradient(to bottom,transparent calc(var(--lh) - 2px),var(--rule) calc(var(--lh) - 2px),var(--rule) var(--lh));background-size:100% var(--lh);font-family:var(--f-hand);font-size:21px;line-height:var(--lh);color:var(--ink)}
.nb-text::placeholder{color:var(--ink-soft);opacity:.75}
.nb-foot{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.nb-index{background:var(--surface);border:2.5px solid var(--line);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 26px var(--soft)}
.nb-list{display:flex;flex-direction:column;gap:6px}
.nb-entry{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:baseline;padding:8px 14px;border-radius:16px;border:2px solid transparent;background:var(--bg);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.nb-entry b{font-family:var(--f-display);font-weight:800;font-size:15px;white-space:nowrap}
.nb-entry span{font-family:var(--f-hand);font-size:18px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb-entry.sel{border-color:var(--pill-d);background:var(--pill)}
@media (max-width:480px){.nb-page{--lh:32px;padding:22px 14px 14px 50px}.nb-page::before{left:40px}.nb-holes{left:8px}.nb-text{font-size:20px}}

@media (max-width:480px){.tabs{gap:2px}.tab{padding:8px 12px;font-size:15px;gap:6px}.tab svg{width:16px;height:16px}}

/* notebook dividers + to-do page */
.nb-tape{left:auto;right:42px;transform:rotate(4deg)}
.nb-dividers{display:flex;gap:6px;padding-left:60px;margin-bottom:-6px;position:relative;z-index:1}
.nb-div{display:inline-flex;align-items:center;gap:8px;padding:8px 18px 12px;border:0;border-radius:16px 16px 0 0;background:color-mix(in srgb,var(--t5) 80%,var(--surface));color:var(--ink-soft);font-family:var(--f-hand);font-size:21px;line-height:1.1;cursor:pointer;box-shadow:inset 0 -6px 8px -6px var(--soft)}
.nb-div:nth-child(2){background:color-mix(in srgb,var(--t3) 80%,var(--surface))}
.nb-div[aria-selected="true"]{background:var(--paper);color:var(--accent-strong);box-shadow:none}
.nb-badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--accent-strong);color:var(--on-accent);font-family:var(--f-body);font-size:12px;font-weight:800}
.nb-page.todo{background-image:radial-gradient(color-mix(in srgb,var(--ink-soft) 30%,transparent) 1.3px,transparent 1.7px);background-size:22px 22px;background-position:8px 8px;min-height:460px}
.nb-page.todo::before{display:none}
.td-add{display:flex;align-items:center;gap:10px;margin:8px 0 14px}
.td-add input{flex:1;min-width:0;border:0;border-bottom:2.5px dashed var(--pill-d);background:transparent;padding:6px 2px;font-family:var(--f-hand);font-size:22px;color:var(--ink);outline:none}
.td-add input:focus{border-bottom-style:solid;border-bottom-color:var(--accent-strong)}
.td-add input::placeholder{color:var(--ink-soft);opacity:.8}
.td-plus{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--accent-strong);color:var(--on-accent);font:800 24px/1 var(--f-display);cursor:pointer;box-shadow:0 3px 0 var(--accent-shade)}
.td-plus:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-shade)}
.td-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.td{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:7px 2px;border-bottom:1.5px solid var(--rule)}
.td-check{width:26px;height:26px;border-radius:9px;border:2.5px solid var(--accent);background:var(--surface);display:grid;place-items:center;cursor:pointer;padding:0;color:var(--on-accent);font:800 15px/1 var(--f-body);transition:background-color .15s,transform .15s}
.td-check::after{content:"✓";opacity:0;transform:scale(.4);transition:opacity .15s,transform .2s}
.td.done .td-check{background:var(--accent-strong);border-color:var(--accent-strong)}
.td.done .td-check::after{opacity:1;transform:scale(1)}
.td.pop .td-check{animation:stampIn .45s ease}
.td-text{font-family:var(--f-hand);font-size:21px;line-height:1.3;color:var(--ink);overflow-wrap:anywhere}
.td.done .td-text{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--accent);text-decoration-thickness:2px}
.td-del{width:28px;height:28px;border-radius:50%;border:0;background:transparent;color:var(--ink-soft);font:700 20px/1 var(--f-body);cursor:pointer;opacity:.55}
.td-del:hover,.td-del:focus-visible{opacity:1;background:var(--pill);color:var(--danger)}
.td-sep{margin:16px 0 2px;font-family:var(--f-hand);font-size:18px;color:var(--ink-soft);list-style:none}
.td-empty{padding:18px 4px;font-family:var(--f-hand);font-size:20px;color:var(--ink-soft);list-style:none}

.foot{margin-top:30px;color:var(--ink-soft);font-size:13px;font-weight:500;text-align:center}
.foot::before{content:"♡ ";color:var(--accent)}
.legal{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px;margin:10px 0 6px;font-size:12.5px;font-weight:700}
.legal a{color:var(--ink-soft);text-decoration:none}
.legal a:hover{color:var(--accent-strong);text-decoration:underline}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick = a => a[Math.floor(Math.random()*a.length)];
const rand = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- words ---------- */
/* @i18n */
/* ---------- words: every piece of text comes from a language pack (src/lang/*.js) ----------
   tx('a.b', {x}) looks a key up in the current pack, falling back to English; lists give a random
   line; functions get the vars. txn('units.win', 3) picks the plural form with Intl.PluralRules.
   Dates and lists go through Intl, so they follow the language by themselves.
   The language is chosen once per device: saved choice → browser languages → English. */
const I18N = (function(){
  const PACKS = {}, KEY = 'puchika-lang';
  let code = 'en', pack = null, base = null, rules = null, numF = null, youFn = () => '';
  const fmtCache = {};

  function add(c, p){ PACKS[c] = p; if(c === 'en') base = p; }
  const dig = (o, key) => key.split('.').reduce((v, k) => v == null ? v : v[k], o);
  function raw(key){ let v = pack ? dig(pack, key) : undefined; if(v == null && base) v = dig(base, key); return v; }
  function you(){
    const name = youFn();
    if(!name) return '';
    const tpl = raw('meta.you');
    return tpl == null ? ' ' + name : String(tpl).replace('{name}', name);
  }
  function fill(s, vars){
    return String(s).replace(/\{(\w+)\}/g, (m, k) => {
      if(k === 'you' && !(vars && vars.you != null)) return you();
      return vars && vars[k] != null ? vars[k] : m;
    });
  }
  function resolve(v, vars){
    if(Array.isArray(v)) v = v[Math.floor(Math.random() * v.length)];
    if(typeof v === 'function') return fill(v(Object.assign({}, vars)), vars);
    return v == null ? null : fill(v, vars);
  }
  function t(key, vars){ const s = resolve(raw(key), vars); return s == null ? key : s; }
  const num = n => numF ? numF.format(n) : String(n);
  // plural forms: {one: '{n} win', other: '{n} wins'}; {n} is the number written the local way
  function tn(key, n, vars){
    const v = raw(key), all = Object.assign({}, vars, {n: num(n)});
    if(v && typeof v === 'object' && !Array.isArray(v)){
      const cat = rules ? rules.select(n) : (n === 1 ? 'one' : 'other');
      return resolve(v[cat] != null ? v[cat] : v.other, all);
    }
    return t(key, all);
  }
  function list(key){ const v = raw(key); return Array.isArray(v) ? v.slice() : []; }
  const has = key => raw(key) != null;

  function use(c){
    if(!PACKS[c]) c = 'en';
    code = c; pack = PACKS[c] || base;
    try { rules = new Intl.PluralRules(c); } catch(e){ rules = null; }
    try { numF = new Intl.NumberFormat(c); } catch(e){ numF = null; }
    for(const k in fmtCache) delete fmtCache[k];
    if(typeof document !== 'undefined') document.documentElement.lang = c;
  }
  function detect(){
    let saved = '';
    try { saved = localStorage.getItem(KEY) || ''; } catch(e){}
    if(PACKS[saved]) return saved;
    const want = (typeof navigator !== 'undefined' && (navigator.languages || [navigator.language])) || [];
    for(const l of want){
      if(!l) continue;
      const low = String(l).toLowerCase();
      if(PACKS[low]) return low;
      const short = low.split('-')[0];
      if(PACKS[short]) return short;
    }
    return 'en';
  }
  function choose(c){ try { localStorage.setItem(KEY, c); } catch(e){} use(c); }

  // fills [data-i18n]="key" (text) and [data-i18n-attr]="attr:key;attr:key" inside root
  function apply(root){
    root = root || document;
    root.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
    root.querySelectorAll('[data-i18n-attr]').forEach(el => {
      el.getAttribute('data-i18n-attr').split(';').forEach(pair => {
        const i = pair.indexOf(':'); if(i < 0) return;
        el.setAttribute(pair.slice(0, i).trim(), t(pair.slice(i + 1).trim()));
      });
    });
  }

  // dates, times and lists in the language's own way
  function dfmt(opts){
    const k = JSON.stringify(opts);
    if(!fmtCache[k]){ try { fmtCache[k] = new Intl.DateTimeFormat(code, opts); } catch(e){ fmtCache[k] = new Intl.DateTimeFormat('en', opts); } }
    return fmtCache[k];
  }
  const date = (d, opts) => dfmt(opts).format(d);
  function range(a, b, opts){
    const f = dfmt(opts);
    try { if(f.formatRange) return f.formatRange(a, b); } catch(e){}
    return f.format(a) + ' – ' + f.format(b);
  }
  function joinList(items){
    try { return new Intl.ListFormat(code, {style: 'long', type: 'conjunction'}).format(items); } catch(e){ return items.join(', '); }
  }
  const upper = s => String(s).toLocaleUpperCase(code);

  return {
    add, use, choose, detect, apply, t, tn, list, has, num, date, range, joinList, upper, fill,
    get lang(){ return code; },
    langs: () => Object.keys(PACKS).map(c => ({code: c, name: (dig(PACKS[c], 'meta.name') || c)})),
    setYou(fn){ youFn = typeof fn === 'function' ? fn : () => ''; }
  };
})();
// short names used everywhere (t and n are common local names in this code, so these are tx / txn)
const tx = I18N.t, txn = I18N.tn;

/* ---------- English: the base language pack ----------
   Every word the app shows lives in a pack like this one. To add a language:
     1. copy this file to src/lang/<code>.js (e.g. tr.js, ja.js, es.js) and change the first line to I18N.add('<code>', {
     2. translate the values; keep the keys, the {placeholders} and the one/other forms
        (plural forms follow Intl.PluralRules for that language: zero, one, two, few, many, other)
     3. rebuild. Anything left untranslated falls back to English, so a pack can be filled in bit by bit.
   A value can be a string, a list (one is picked at random) or a function (vars) => string, for grammar
   that a simple placeholder can't express. {you} is filled in with meta.you, or nothing if no name is set. */
I18N.add('en', {
  meta: {
    name: 'English',
    you: ', {name}'           // how the person's name joins a sentence: "Good morning{you}!" → "Good morning, Ana!"
  },

  app: {
    title: 'Puchika',
    tagline: 'Every little thing you do today counts. Tap it, mark it, watch your Puchi grow ♡',
    petDefault: 'Puchi'
  },

  units: {
    win: {one: '{n} win', other: '{n} wins'},
    winWord: {one: 'win', other: 'wins'},
    star: {one: '{n} star', other: '{n} stars'},
    day: {one: '{n} day', other: '{n} days'},
    page: {one: '{n} page', other: '{n} pages'},
    word: {one: '{n} word', other: '{n} words'},
    todo: {one: '{n} to-do', other: '{n} to-dos'},
    cell: {one: '{n} cell', other: '{n} cells'},
    shell: {one: '{n} shell', other: '{n} shells'},
    sticker: {one: '{n} sticker', other: '{n} stickers'},
    place: {one: '{n} place', other: '{n} places'},
    friend: {one: '{n} friend', other: '{n} friends'},
    heart: {one: '{n} heart', other: '{n} hearts'},

const STAGE_XP = [0, 3, 15, 40, 90, 180, 350];
// stage names belong to the character (a Sprout buds and blooms, a Bunny grows its ears)
const STAGES = STAGE_XP.map((xp, i) => ({xp, get n(){ return I18N.list('chars.' + CHAR + '.stages')[i] || ''; }}));
const MILESTONE_AT = [1, 3, 5, 8, 12];
const EMOJI_CHOICES = ['🚶','🏃','🧘','💧','📖','✍️','🎨','🎸','🛒','🪴','🐱','📞','🛁','🦷','🍎','☕','📝','💻','🎧','🧶','📷','🌙','✨','❤️'];

/* ---------- dates (written out by Intl in the chosen language) ---------- */
const pad = n => String(n).padStart(2,'0');
const keyOf = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey = k => { const p = k.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); };
const addDays = (k,n) => { const d = parseKey(k); d.setDate(d.getDate()+n); return keyOf(d); };
const mondayOf = k => { const d = parseKey(k); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return keyOf(d); };
const todayKey = () => keyOf(new Date());
const nowHM = () => { const d = new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const D = {
  full: d => I18N.date(d, {weekday:'long', day:'numeric', month:'long', year:'numeric'}),
  weekday: d => I18N.date(d, {weekday:'long'}),
  dayMonth: d => I18N.date(d, {day:'numeric', month:'long'}),
  shortDay: (d, withYear) => I18N.date(d, withYear ? {day:'numeric', month:'short', year:'numeric'} : {day:'numeric', month:'short'}),
  month: (y, m) => I18N.date(new Date(y, m, 1), {month:'long'}),
  monthYear: (y, m) => I18N.date(new Date(y, m, 1), {month:'long', year:'numeric'}),
  // Monday first; 2024-01-01 was a Monday
  wdShort: i => I18N.date(new Date(2024, 0, 1 + i), {weekday:'short'}),
  hour: h => I18N.date(new Date(2024, 0, 1, h, 0), {hour:'numeric', minute:'2-digit'})
};
// "Today", "Yesterday" or the weekday
function dayName(k){ const t = todayKey(); return k === t ? tx('board.today') : k === addDays(t, -1) ? tx('board.yesterday') : D.weekday(parseKey(k)); }

/* ---------- state ---------- */
const DEFAULT_SETTINGS = () => ({petName:'', userName:'', custom:[], hidden:[], sing:true, stickers:[], wallet:normWallet()});
const S = { settings: DEFAULT_SETTINGS(), wallet: normWallet(), days:{}, journal:{}, todos:[], pet:null, ready:false, mode:'boot', profileFirst:'', account:'' };
let sel = todayKey();
let lastToday = sel;
let weekStart = mondayOf(sel);
let monthY = parseKey(sel).getFullYear(), monthM = parseKey(sel).getMonth();
let editMode = false;
let justDone = null;
let greeted = false;

const cellDef = c => Object.assign({label: tx('cells.' + c.id + '.label')}, c);
const allDefs = () => DEFAULT_CELLS.map(cellDef).concat(S.settings.custom || []);
const visibleDefs = () => { const h = new Set(S.settings.hidden || []); return allDefs().filter(c => !h.has(c.id)); };
const defById = id => allDefs().find(c => c.id === id);
const cnt = a => Array.isArray(a) ? a.filter(v => v != null).length : 0;
function dayCount(k){ const d = S.days[k]; if(!d) return 0; let n = 0; for(const id in d) n += cnt(d[id]); return n; }
function totalXp(){ let n = 0; for(const k in S.days) n += dayCount(k); return n; }
function stageOf(xp){ let s = 0; STAGES.forEach((st,i) => { if(xp >= st.xp) s = i; }); return s; }
function hitap(){ return (S.settings.userName || '').trim() || S.profileFirst || ''; }
I18N.setYou(hitap);
const fmt = (s, vars) => String(s).replace(/\{(\w+)\}/g, (m, k) => vars && vars[k] != null ? vars[k] : m);
const winsTxt = n => txn('units.win', n);
// with no name of its own the pet is called Puchi, or Chika when Chika is the friend
const defaultPetName = () => CHAR === 'chika' ? tx('chars.chika.name') : tx('app.petDefault');

const upper = s => I18N.upper(s);

/* ---------- storage ---------- */
const LOCAL_KEY = 'puchika-v1';
const CACHE_KEY = 'puchika-cache-v1';
const Store = { mode:'boot', kind:'', uid:'', gen:0, col:null, unsub:null, readyTimer:null, pend:{}, busy:{}, timers:{}, setBusy:false, setDirty:false, setTimer:null };
function lsGet(k){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function normSettings(d){ const s = Object.assign(DEFAULT_SETTINGS(), d || {}); if(!Array.isArray(s.custom)) s.custom = []; if(!Array.isArray(s.hidden)) s.hidden = []; if(!Array.isArray(s.stickers)) s.stickers = []; s.wallet = normWallet(s.wallet); return s; }
// the store wallet: points to spend, the packs bought, single items found in surprise boxes ("kind:id"), and a short log
function normWallet(w){
  w = w && typeof w === 'object' ? w : {};
  const ids = a => Array.isArray(a) ? a.filter((x, i) => typeof x === 'string' && x.length < 60 && a.indexOf(x) === i).slice(0, 400) : [];
  return {pts: Math.max(0, Math.min(1e7, Math.floor(+w.pts || 0))), packs: ids(w.packs), got: ids(w.got),
    log: Array.isArray(w.log) ? w.log.filter(e => e && typeof e === 'object' && typeof e.what === 'string').slice(-60) : []};
}
function snapshotAll(){ return {settings:S.settings, days:S.days, journal:S.journal, todos:S.todos, pet:S.pet}; }
// filled in by the build from firebase-config.json; null means no accounts yet, everything stays in this browser
const FB_CONFIG = /*@@FB_CONFIG*/null/*@@*/;
function persistLocalCopy(){
  if(Store.mode === 'local') lsSet(LOCAL_KEY, snapshotAll());
  else if(Store.col) lsSet(CACHE_KEY, Object.assign(snapshotAll(), {owner: Store.uid || ''}));
}

function setSync(s){
  const el = $('#sync'); el.dataset.s = s;
  $('#syncText').textContent = I18N.has('sync.' + s) ? tx('sync.' + s) : '';
  renderAcctTop();
}
// a sign-in / account button on the main screen, so people who skipped signing in can always come back to it
function renderAcctTop(){

  b.hidden = !FB_CONFIG || !(fire || local);

  b.title = fire ? (S.account || '') : tx('storage.localAccount').trim();
}
function storageNote(){
  if(Store.kind === 'fire') return tx('storage.fire', {email: S.account || tx('storage.fireNoEmail')});
  if(Store.kind === 'claude') return tx('storage.claude');
  return tx('storage.local') + (FB_CONFIG ? tx('storage.localAccount') : '');
}
function resetData(){
  S.settings = DEFAULT_SETTINGS(); S.wallet = normWallet(); S.days = {}; S.journal = {}; S.todos = []; S.pet = null;
}
function applyCache(c){
  S.settings = normSettings(c.settings); S.days = c.days || {}; S.journal = c.journal || {}; S.todos = normTodos(c.todos); S.pet = PetCore.norm(c.pet, Date.now());
}

async function initStore(){
  // paint last known state while connecting
  const cache = lsGet(CACHE_KEY);
  if(cache) applyCache(cache);
  if(window.claude && typeof window.claude.use === 'function') return initClaude();
  if(FB_CONFIG && fbChoice() !== 'local') return initFire();
  goLocal(false);
}
// one live subscription to the whole collection, the same for claude.ai and Firebase
function subscribeCol(onNoAnswer){
  let gotAny = false;
  const fallback = setTimeout(() => { if(!gotAny && gen === Store.gen) onNoAnswer(); }, 9000);
  clearTimeout(Store.readyTimer); Store.readyTimer = null;
  const gen = ++Store.gen;
  const unsub = Store.col.onSnapshot(snap => {
    if(gen !== Store.gen) return;
    gotAny = true; clearTimeout(fallback);
    applySnapshot(snap);
    if(!S.ready && !snap.metadata.fromCache) markReady();
    else if(!S.ready && !Store.readyTimer) Store.readyTimer = setTimeout(() => { if(!S.ready) markReady(); }, 4000);
  }, err => {
    if(gen !== Store.gen) return;
    if(!S.ready){ clearTimeout(fallback); onNoAnswer(err); return; }
    setSync('err');
  });
  Store.unsub = typeof unsub === 'function' ? unsub : null;
}
async function initClaude(){
  Store.kind = 'claude';
  let db = null, user = null;
  try {
    const r = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    db = r[0]; user = r[1];
  } catch(e){ db = null; }
  let uid = null;
  if(user){
    try { uid = await user.id(); } catch(e){}
    try { const me = await user.me(); S.profileFirst = ((me && me.name) || '').trim().split(/\s+/)[0] || ''; } catch(e){}
  }
  if(!db || !uid) return goLocal(false);
  Store.mode = 'cloud'; Store.uid = uid;
  try { Store.col = db.collection('data/users/' + uid); } catch(e){ return goLocal(false); }
  subscribeCol(() => goLocal(true));
}
function goLocal(failedCloud){
  if(Store.unsub){ try { Store.unsub(); } catch(e){} Store.unsub = null; }
  Store.gen++; Store.mode = 'local'; Store.kind = 'local'; Store.col = null; Store.uid = '';
  const d = lsGet(LOCAL_KEY);
  if(d) applyCache(d);
  else if(!failedCloud){ S.settings = normSettings(S.settings); }
  markReady();
}
function dayPending(k){ return !!(Store.busy[k] || Store.timers[k] || (Store.pend[k] && Object.keys(Store.pend[k]).length)); }
function applySnapshot(snap){
  const days = {}, journal = {};
  for(const k in S.days){ if(dayPending(k)) days[k] = S.days[k]; }
  for(const k in S.journal){ if(jPending(k)) journal[k] = S.journal[k]; }
  for(const doc of snap.docs){
    const data = doc.data() || {};
    if(doc.id === 'settings'){ if(!Store.setBusy && !Store.setDirty && !Store.setTimer) S.settings = normSettings(data); continue; }
    if(doc.id === 'todos'){ if(!todoPending()) S.todos = normTodos(data.items); continue; }
    if(doc.id === 'pet'){ if(!petPending()){ const p = PetCore.norm(data, Date.now()); if(p) S.pet = p; } continue; }
    if(doc.id === WALLET_DOC){ if(PAID) S.wallet = normWallet(data); continue; }   // written only by the server (real payments)
    if(doc.id.indexOf('wallet') === 0) continue;
    if(doc.id.charAt(0) === 'd'){
      const k = doc.id.slice(1);
      if(dayPending(k)) continue;
      const c = data.c && typeof data.c === 'object' ? data.c : {};
      const clean = {}; for(const id in c){ if(Array.isArray(c[id])) clean[id] = c[id].slice(); }
      if(Object.keys(clean).length) days[k] = clean;
    }
    if(doc.id.charAt(0) === 'j'){
      const k = doc.id.slice(1);
      if(jPending(k)) continue;
      journal[k] = {text: typeof data.text === 'string' ? data.text : '', updatedAt: data.updatedAt || ''};
    }
  }
  S.days = days; S.journal = journal;
  persistLocalCopy();
  Pet.syncStage();
  renderAll();
  topupArrived();
}
function markReady(){
  S.ready = true;
  // a new pet; in the cloud it is only saved once something happens to it, so a slow sync never overwrites one made elsewhere
  if(!S.pet){ S.pet = PetCore.fresh(Date.now(), firstWinMs()); if(Store.mode !== 'cloud') queuePet(); }
  setSync(Store.mode === 'cloud' ? 'ok' : 'local');
  Pet.syncStage();
  renderAll();
  if(!greeted){ greeted = true; greet(); }
  offerLocalMerge();
}

/* ---------- Firebase: one account for every device ---------- */
const FB = {F:null, app:null, auth:null, db:null, user:null, listening:false, loading:null};
const FB_CHOICE_KEY = 'puchika-account';
const fbChoice = () => { try { return localStorage.getItem(FB_CHOICE_KEY) || ''; } catch(e){ return ''; } };
// the hosted page carries the SDK inline; anything else (the desktop file) borrows it from there
const FB_SITE = /*@@FB_SITE*/""/*@@*/;
function fbSdkUrl(){ return (FB_SITE || './') + 'fb-sdk.js'; }
function loadFbSdk(){
  if(window.KZFB) return Promise.resolve(window.KZFB);
  if(FB.loading) return FB.loading;
  FB.loading = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = fbSdkUrl(); s.async = true;
    s.onload = () => window.KZFB ? res(window.KZFB) : rej(new Error('sdk'));
    s.onerror = () => { s.remove(); rej(new Error('sdk')); };
    document.head.appendChild(s);
  }).catch(e => { FB.loading = null; throw e; });
  return FB.loading;
}
// the Firestore collection behind the same small interface the claude.ai store offers
function fireCol(F, db, uid){
  const c = F.collection(db, 'users', uid, 'data');
  const code = e => { const x = new Error(e && e.message || 'firestore'); x.code = String(e && e.code || '').replace(/-/g, '_'); return x; };
  const plain = o => JSON.parse(JSON.stringify(o));
  const merging = o => { if(o === null) return F.deleteField(); if(Array.isArray(o) || typeof o !== 'object') return o; const r = {}; for(const k in o) r[k] = merging(o[k]); return r; };
  return {
    onSnapshot(next, fail){
      return F.onSnapshot(c, {includeMetadataChanges: true},
        snap => next({docs: snap.docs.map(d => ({id: d.id, data: () => d.data()})), metadata: {fromCache: snap.metadata.fromCache}}),
        e => fail && fail(code(e)));
    },
    doc(id){
      const r = F.doc(c, id);
      return {
        set: o => F.setDoc(r, plain(o)).catch(e => { throw code(e); }),
        update: o => F.setDoc(r, merging(plain(o)), {merge: true}).catch(e => { throw code(e); }),
        delete: () => F.deleteDoc(r).catch(e => { throw code(e); })
      };
    }
  };
}
async function initFire(){
  Store.kind = 'fire'; Store.mode = 'cloud';
  setSync('boot');
  let F;
  try { F = await loadFbSdk(); }
  catch(e){
    // offline and nothing cached: show the last known page and try again shortly
    setSync('offline'); renderAll();
    setTimeout(() => { if(Store.kind === 'fire' && !FB.F) initFire(); }, 15000);
    return;
  }
  FB.F = F;
  if(!FB.app){
    FB.app = F.initializeApp(FB_CONFIG);
    FB.auth = F.initializeAuth(FB.app, {persistence: [F.indexedDBLocalPersistence, F.browserLocalPersistence]});
    try { FB.db = F.initializeFirestore(FB.app, {localCache: F.persistentLocalCache({tabManager: F.persistentMultipleTabManager()})}); }
    catch(e){ FB.db = F.initializeFirestore(FB.app, {localCache: F.memoryLocalCache()}); }
  }
  if(!FB.listening){ FB.listening = true; F.onAuthStateChanged(FB.auth, u => { if(Store.kind !== 'fire') return; if(u) fireUser(u); else fireNoUser(); }); }
  else { const u = FB.auth.currentUser; if(u) fireUser(u); else fireNoUser(); }
}
function fireUser(u){
  if(FB.user && FB.user.uid === u.uid && Store.col) return;
  FB.user = u; S.account = u.email || '';
  hideAuth();
  const cache = lsGet(CACHE_KEY);
  if(!cache || cache.owner !== u.uid){ resetData(); if(cache) lsSet(CACHE_KEY, null); }
  S.ready = false; Store.uid = u.uid; Store.mode = 'cloud';
  Store.col = fireCol(FB.F, FB.db, u.uid);
  renderAll(); renderAcctTop();
  subscribeCol(() => { if(!S.ready){ setSync('offline'); markReady(); } });
}
function fireNoUser(){
  if(Store.unsub){ try { Store.unsub(); } catch(e){} Store.unsub = null; }
  Store.gen++;
  const wasIn = !!FB.user;
  FB.user = null; Store.col = null; Store.uid = ''; S.account = '';
  if(wasIn){ resetData(); try { localStorage.removeItem(CACHE_KEY); } catch(e){} }
  S.ready = false; setSync('signin'); renderAll();
  showAuth();
}
async function fireSignOut(){
  if(!FB.F || !FB.auth) return;
  flushJournalNow(); flushTodosNow(); flushPetNow();
  try { await FB.F.signOut(FB.auth); } catch(e){}
}
function useLocalMode(){
  try { localStorage.setItem(FB_CHOICE_KEY, 'local'); } catch(e){}
  hideAuth(); S.ready = false; goLocal(false);
}
function useAccount(){
  try { localStorage.removeItem(FB_CHOICE_KEY); } catch(e){}
  $('#settingsPanel').hidden = true;
  S.ready = false; resetData(); renderAll();
  initFire();
}

/* login card */
let authMode = 'in', authBusy = false;
function showAuth(msg){
  $('#authVeil').hidden = false; renderAuth(); authMsg(msg || '');
  setTimeout(() => { const e = $('#authEmail'); if(e && !e.value) e.focus(); }, 60);
}
function hideAuth(){ $('#authVeil').hidden = true; }
function authMsg(m, good){ const el = $('#authMsg'); el.textContent = m; el.classList.toggle('good', !!good); }
function renderAuth(){
  const up = authMode === 'up';
  $('#authTitle').textContent = tx(up ? 'auth.titleUp' : 'auth.titleIn');
  $('#authGo').textContent = tx(up ? 'auth.goUp' : 'auth.goIn');
  $('#authSwitch').textContent = tx(up ? 'auth.toIn' : 'auth.toUp');
  $('#authForgot').hidden = up;
  $('#authPass').setAttribute('autocomplete', up ? 'new-password' : 'current-password');
}
const authErr = code => code && I18N.has('auth.err.' + code) ? tx('auth.err.' + code) : '';
$('#authForm').addEventListener('submit', async e => {
  e.preventDefault();
  if(authBusy) return;
  const email = $('#authEmail').value.trim(), pass = $('#authPass').value;
  if(!email || !pass){ authMsg(tx('auth.missing')); return; }
  authBusy = true; $('#authGo').disabled = true; authMsg(tx(authMode === 'up' ? 'auth.busyUp' : 'auth.busyIn'), true);
  try {
    const F = await loadFbSdk();
    if(!FB.auth){ await initFire(); }

  } catch(err){

  } finally { authBusy = false; $('#authGo').disabled = false; }
});
$('#authSwitch').addEventListener('click', () => { authMode = authMode === 'up' ? 'in' : 'up'; renderAuth(); authMsg(''); Sound.tick(); });
$('#authForgot').addEventListener('click', async () => {
  const email = $('#authEmail').value.trim();
  if(!email){ authMsg(tx('auth.needEmail')); $('#authEmail').focus(); return; }
  try { const F = await loadFbSdk(); await F.sendPasswordResetEmail(FB.auth, email); authMsg(tx('auth.resetSent'), true); }
  catch(err){ authMsg(authErr(err && err.code) || tx('auth.resetFailed')); }

<canvas id="out" width="1080" height="1920"></canvas><canvas id="lcd" width="8" height="8" style="display:none"></canvas>
<img id="logo" src="logo.webp" style="display:none">
<script>
// page.html?ep=<episode id>[&vox=<voices.js>]  — loads the renderer, the episode and (if made) its voices
const Q = new URLSearchParams(location.search), EPID = Q.get('ep'), VOX = Q.get('vox');
let XP = 200; const totalXp = () => XP; const stageOf = x => 4;
['engine.js', 'core.js', 'voice.js', 'kit.js'].concat(VOX ? [VOX] : [], ['eps/' + EPID + '.js', 'tracks.js', 'prelude.js', 'sound.js', 'audio.js'])
  .forEach(s => document.write('<script src="' + s + '"><\/script>'));
</script></body></html>
